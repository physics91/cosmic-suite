<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Puzzle</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000'/><line x1='8' y1='10' x2='24' y2='22' stroke='%23ffcc44' stroke-width='1' opacity='.5'/><circle cx='8' cy='10' r='2' fill='%23ffcc44'/><circle cx='24' cy='22' r='2' fill='%23ffcc44'/></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#060610;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;cursor:pointer}
    canvas{display:block}
    #info{position:fixed;top:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.3);font-size:12px;letter-spacing:3px;z-index:2;pointer-events:none}
    #level{position:fixed;top:45px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.15);font-size:10px;letter-spacing:2px;z-index:2;pointer-events:none}
    #win{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,200,100,.6);font-size:24px;font-weight:200;letter-spacing:8px;z-index:3;pointer-events:none;display:none}
    #controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
    .btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);padding:5px 14px;border-radius:12px;cursor:pointer;font-size:10px;transition:all .2s}
    .btn:hover{background:rgba(255,255,255,.1);color:#fff}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">CONNECT ALL STARS</div>
<div id="level"></div>
<div id="win">✦ CONSTELLATION COMPLETE ✦</div>
<div id="controls">
  <button class="btn" onclick="undo()">Undo</button>
  <button class="btn" onclick="resetPuzzle()">Reset</button>
  <button class="btn" onclick="nextLevel()">Next</button>
</div>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a><a id="random-jump" href="#" onclick="const e=['art.html','attractor.html','automata.html','beats.html','breathe.html','cellular-music.html','chat.html','clock.html','conway.html','dice.html','entropy.html','fourier.html','gravity-beats.html','gravity-well.html','harmonograph.html','index.html','interference.html','life.html','living-mandala.html','mandala.html','memory.html','music.html','neural.html','oracle.html','orbit.html','pendulum.html','puzzle.html','racer.html','reaction.html','rhythm.html','sandbox.html','scale.html','sonic-terrain.html','tarot.html','terrain.html','topology.html','type.html','words.html'];location.href=e[Math.random()*e.length|0];return false" style="position:fixed;top:12px;right:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">random &rarr;</a>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
let nodes=[],edges=[],userEdges=[],selected=-1,lvl=1,solved=false,totalSolved=0;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight;if(nodes.length)positionNodes();}
resize();addEventListener('resize',resize);

function generateLevel(n){
  nodes=[];edges=[];userEdges=[];selected=-1;solved=false;
  document.getElementById('win').style.display='none';
  // Generate n nodes in a circle with some randomness
  const count=n+3;// 4 minimum
  for(let i=0;i<count;i++){nodes.push({id:i,ax:0,ay:0});}
  positionNodes();
  // Generate edges — create a spanning tree + some extra
  const edgeCount=count+Math.floor(Math.random()*(count/2));
  const used=new Set();
  // Spanning tree first (ensure connected)
  for(let i=1;i<count;i++){const j=Math.floor(Math.random()*i);
    const key=Math.min(i,j)+'-'+Math.max(i,j);if(!used.has(key)){used.add(key);edges.push([i,j]);}}
  // Extra edges
  for(let e=edges.length;e<edgeCount;e++){
    const i=Math.floor(Math.random()*count),j=Math.floor(Math.random()*count);
    if(i===j)continue;const key=Math.min(i,j)+'-'+Math.max(i,j);
    if(!used.has(key)){used.add(key);edges.push([i,j]);}}}

function positionNodes(){
  const cx=W/2,cy=H/2,r=Math.min(W,H)*.3;
  for(let i=0;i<nodes.length;i++){
    const a=i*Math.PI*2/nodes.length+Math.random()*.3;
    const d=r*(.6+Math.random()*.4);
    nodes[i].ax=cx+Math.cos(a)*d;nodes[i].ay=cy+Math.sin(a)*d;
    nodes[i].vx=(Math.random()-.5)*.3;nodes[i].vy=(Math.random()-.5)*.3;
    nodes[i].anchored=false;}}

function updatePhysics(){
  for(const n of nodes){
    // Check if fully connected
    const conns=userEdges.filter(e=>e[0]===n.id||e[1]===n.id).length;
    const targetConns=edges.filter(e=>e[0]===n.id||e[1]===n.id).length;
    n.anchored=conns===targetConns&&targetConns>0;
    if(n.anchored){n.vx*=.9;n.vy*=.9;} // anchored nodes slow down
    else{
      // Drift
      n.vx+=(Math.random()-.5)*.02;n.vy+=(Math.random()-.5)*.02;
      n.vx*=.995;n.vy*=.995;
    }
    // Connected pairs attract gently
    for(const e of userEdges){
      const other=e[0]===n.id?nodes[e[1]]:e[1]===n.id?nodes[e[0]]:null;
      if(!other)continue;
      const dx=other.ax-n.ax,dy=other.ay-n.ay;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d>80){n.vx+=dx/d*.02;n.vy+=dy/d*.02;} // attract if far
      if(d<40){n.vx-=dx/d*.01;n.vy-=dy/d*.01;} // repel if too close
    }
    n.ax+=n.vx;n.ay+=n.vy;
    // Soft bounds
    if(n.ax<40){n.vx+=.05;n.ax=40;}if(n.ax>W-40){n.vx-=.05;n.ax=W-40;}
    if(n.ay<60){n.vy+=.05;n.ay=60;}if(n.ay>H-60){n.vy-=.05;n.ay=H-60;}
  }
}

function findNode(x,y){
  for(let i=0;i<nodes.length;i++){const dx=nodes[i].ax-x,dy=nodes[i].ay-y;if(dx*dx+dy*dy<600)return i;}return-1;}

function edgeExists(a,b){const key=Math.min(a,b)+'-'+Math.max(a,b);
  return userEdges.some(e=>Math.min(e[0],e[1])+'-'+Math.max(e[0],e[1])===key);}

function checkWin(){
  if(userEdges.length!==edges.length)return false;
  const required=new Set(edges.map(e=>Math.min(e[0],e[1])+'-'+Math.max(e[0],e[1])));
  const placed=new Set(userEdges.map(e=>Math.min(e[0],e[1])+'-'+Math.max(e[0],e[1])));
  for(const r of required)if(!placed.has(r))return false;return true;}

C.addEventListener('click',e=>{
  if(solved)return;const idx=findNode(e.clientX,e.clientY);if(idx<0)return;
  if(selected<0){selected=idx;return;}
  if(selected===idx){selected=-1;return;}
  // Check if this edge is valid (exists in puzzle)
  const key=Math.min(selected,idx)+'-'+Math.max(selected,idx);
  const valid=edges.some(e=>Math.min(e[0],e[1])+'-'+Math.max(e[0],e[1])===key);
  if(valid&&!edgeExists(selected,idx)){
    userEdges.push([selected,idx]);
    // Play tone
    try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
      o.frequency.value=300+userEdges.length*40;o.type='sine';g.gain.setValueAtTime(.03,a.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.3);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.3);}catch(e){}
    if(checkWin()){solved=true;totalSolved++;document.getElementById('win').style.display='block';
      setTimeout(()=>{lvl++;generateLevel(lvl);},2500);}}
  selected=idx;});

function undo(){if(userEdges.length){userEdges.pop();solved=false;document.getElementById('win').style.display='none';}}
function resetPuzzle(){userEdges=[];selected=-1;solved=false;document.getElementById('win').style.display='none';}
function nextLevel(){lvl++;generateLevel(lvl);}

// Background
const bg=Array.from({length:80},()=>({x:Math.random()*3e3,y:Math.random()*3e3,s:Math.random(),p:Math.random()*Math.PI*2}));

function anim(){requestAnimationFrame(anim);
  updatePhysics();
  X.fillStyle='rgba(6,6,16,.15)';X.fillRect(0,0,W,H);
  // BG
  for(const s of bg){s.p+=.003;X.globalAlpha=.04+Math.sin(s.p)*.02;X.fillStyle='#fff';
    X.beginPath();X.arc(s.x%W,s.y%H,s.s,0,Math.PI*2);X.fill();}
  // Target edges (hint — very faint)
  X.globalAlpha=.03;X.strokeStyle='#fff';X.lineWidth=.5;X.setLineDash([3,6]);
  for(const e of edges){X.beginPath();X.moveTo(nodes[e[0]].ax,nodes[e[0]].ay);X.lineTo(nodes[e[1]].ax,nodes[e[1]].ay);X.stroke();}
  X.setLineDash([]);
  // User edges
  for(let i=0;i<userEdges.length;i++){const e=userEdges[i];
    const hue=(i*30)%360;X.globalAlpha=.4;X.strokeStyle=`hsl(${hue},60%,60%)`;X.lineWidth=2;
    X.beginPath();X.moveTo(nodes[e[0]].ax,nodes[e[0]].ay);X.lineTo(nodes[e[1]].ax,nodes[e[1]].ay);X.stroke();}
  // Nodes
  for(let i=0;i<nodes.length;i++){const n=nodes[i];const isSel=i===selected;
    // Connected count
    const conns=userEdges.filter(e=>e[0]===i||e[1]===i).length;
    const targetConns=edges.filter(e=>e[0]===i||e[1]===i).length;
    const complete=conns===targetConns&&targetConns>0;
    X.globalAlpha=isSel?.3:complete?.15:.06;X.fillStyle=complete?'#44ff88':isSel?'#ffcc44':'#fff';
    X.beginPath();X.arc(n.ax,n.ay,isSel?16:10,0,Math.PI*2);X.fill();
    X.globalAlpha=isSel?.9:complete?.7:.5;X.fillStyle='#fff';
    X.beginPath();X.arc(n.ax,n.ay,isSel?5:3,0,Math.PI*2);X.fill();
    // Anchored stability ring
    if(complete){X.globalAlpha=.08;X.strokeStyle='#44ff88';X.lineWidth=.5;
      X.beginPath();X.arc(n.ax,n.ay,14,0,Math.PI*2);X.stroke();}
    // Drifting indicator for unconnected nodes
    if(!complete&&conns===0){const drift=Math.sin(Date.now()*.003+i)*.5;
      X.globalAlpha=.03;X.strokeStyle='#ffcc44';X.lineWidth=.3;
      X.beginPath();X.arc(n.ax,n.ay,12+drift*4,0,Math.PI*2);X.stroke();}
    // Connection counter
    X.globalAlpha=.2;X.font='8px sans-serif';X.textAlign='center';
    X.fillText(conns+'/'+targetConns,n.ax,n.ay+20);}
  X.globalAlpha=1;
  document.getElementById('level').textContent='LEVEL '+lvl+' · '+userEdges.length+'/'+edges.length+' edges · '+totalSolved+' solved';}

generateLevel(lvl);anim();
addEventListener('keydown',e=>{if(e.key==='f')document.documentElement.requestFullscreen().catch(()=>{});
  if(e.key==='z')undo();if(e.key==='r')resetPuzzle();if(e.key==='n')nextLevel();});
</script>
<script>try{const _pc=new BroadcastChannel("cosmic-pulse");const _pn="puzzle.html";setInterval(()=>_pc.postMessage({type:"pulse",href:_pn}),1000);}catch(e){}</script>
</body>
</html>
