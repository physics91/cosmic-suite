<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swarm Gravity</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000'/><circle cx='16' cy='16' r='4' fill='%236644ff' opacity='.3'/><polygon points='22,10 21,12 23,12' fill='%2388ccff' opacity='.5'/></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#020210;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;cursor:crosshair}
    canvas{display:block}
    #info{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.12);font-size:9px;letter-spacing:3px;z-index:2;pointer-events:none;text-align:center}
    #stats{position:fixed;bottom:16px;left:16px;color:rgba(255,255,255,.08);font-size:8px;z-index:2;pointer-events:none;font-family:monospace;line-height:1.8}
    .btn{position:fixed;z-index:20;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.3);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:9px;letter-spacing:1px}
    .btn:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">CLICK TO PLACE GRAVITY WELLS &middot; BOIDS STRUGGLE TO FLOCK &middot; RIGHT-CLICK TO REMOVE</div>
<div id="stats"></div>
<button class="btn" style="bottom:16px;right:16px" onclick="clearWells()">Clear Wells</button>
<button class="btn" style="bottom:16px;right:110px" onclick="presetOrbit()">Orbit</button>
<button class="btn" style="bottom:16px;right:170px" onclick="presetDual()">Binary</button>
<button class="btn" style="bottom:16px;right:235px" onclick="addBoids(50)">+50 Boids</button>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a><a id="random-jump" href="#" onclick="const e=['art.html','attractor.html','automata.html','beats.html','breathe.html','cellular-music.html','chat.html','clock.html','conway.html','dice.html','entropy.html','flocking.html','fourier.html','gravity-beats.html','gravity-well.html','harmonograph.html','index.html','interference.html','life.html','living-mandala.html','mandala.html','memory.html','music.html','neural.html','oracle.html','orbit.html','pendulum.html','puzzle.html','racer.html','reaction.html','rhythm.html','sandbox.html','scale.html','sonic-terrain.html','tarot.html','terrain.html','topology.html','type.html','words.html'];location.href=e[Math.random()*e.length|0];return false" style="position:fixed;top:12px;right:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">random &rarr;</a>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight;}
resize();addEventListener('resize',resize);

// === CONSTANTS ===
const MAX_BOIDS=10000;
const TRAIL_LEN=12;
const INITIAL_COUNT=1000;

// === STATE ===
const wells=[];
let captured=0;
let useWasm=false;
let boidCount=0;

// WASM exports and typed array views
let wasm=null;
let wasmPx,wasmPy,wasmVx,wasmVy,wasmType;

// Per-boid JS rendering state (parallel arrays)
const hueArr=new Float32Array(MAX_BOIDS);
const panicArr=new Float32Array(MAX_BOIDS);
const aliveArr=new Uint8Array(MAX_BOIDS);

// Trail ring buffers: each boid gets TRAIL_LEN slots
const trailX=new Float32Array(MAX_BOIDS*TRAIL_LEN);
const trailY=new Float32Array(MAX_BOIDS*TRAIL_LEN);
const trailHead=new Uint16Array(MAX_BOIDS); // current write index per boid
const trailCount=new Uint16Array(MAX_BOIDS); // how many valid entries per boid

// === JS FALLBACK PHYSICS (SoA) ===
let jsPx,jsPy,jsVx,jsVy;
function initJsArrays(){
  jsPx=new Float32Array(MAX_BOIDS);jsPy=new Float32Array(MAX_BOIDS);
  jsVx=new Float32Array(MAX_BOIDS);jsVy=new Float32Array(MAX_BOIDS);
}

function addBoid(x,y){
  if(boidCount>=MAX_BOIDS)return;
  const i=boidCount;
  const px=x!==undefined?x:Math.random()*W;
  const py=y!==undefined?y:Math.random()*H;
  const vx=(Math.random()-.5)*3;
  const vy=(Math.random()-.5)*3;
  if(useWasm){
    wasm.boids_add(px,py,vx,vy,0);
    boidCount=wasm.boids_get_count();
  }else{
    jsPx[i]=px;jsPy[i]=py;jsVx[i]=vx;jsVy[i]=vy;
    boidCount=i+1;
  }
  hueArr[i]=200+Math.random()*40;
  panicArr[i]=0;
  aliveArr[i]=1;
  trailHead[i]=0;trailCount[i]=0;
}

function addBoids(n){for(let i=0;i<n;i++)addBoid();}

// === WASM LOADING ===
async function initWasm(){
  try{
    const result=await WebAssembly.instantiateStreaming(
      fetch('./physics.wasm'),{env:{abort:()=>{}}});
    wasm=result.instance.exports;
    wasm.boids_init(MAX_BOIDS,W,H);
    wasm.boids_set_params(50,20,5,.2);
    // Create typed array views over WASM memory
    refreshWasmViews();
    useWasm=true;
  }catch(e){
    console.warn('WASM load failed, using JS fallback:',e);
    useWasm=false;
    initJsArrays();
  }
}

function refreshWasmViews(){
  const mem=wasm.memory.buffer;
  wasmPx=new Float32Array(mem,wasm.boids_get_px_ptr(),MAX_BOIDS);
  wasmPy=new Float32Array(mem,wasm.boids_get_py_ptr(),MAX_BOIDS);
  wasmVx=new Float32Array(mem,wasm.boids_get_vx_ptr(),MAX_BOIDS);
  wasmVy=new Float32Array(mem,wasm.boids_get_vy_ptr(),MAX_BOIDS);
  wasmType=new Float32Array(mem,wasm.boids_get_type_ptr(),MAX_BOIDS);
}

// === WELLS ===
addEventListener('click',e=>{if(e.target.closest('.btn,a'))return;
  wells.push({x:e.clientX,y:e.clientY,mass:60+Math.random()*40,phase:Math.random()*Math.PI*2});});
addEventListener('contextmenu',e=>{e.preventDefault();
  let best=-1,bd=2500;for(let i=0;i<wells.length;i++){const dx=wells[i].x-e.clientX,dy=wells[i].y-e.clientY;if(dx*dx+dy*dy<bd){bd=dx*dx+dy*dy;best=i;}}
  if(best>=0)wells.splice(best,1);});
addEventListener('keydown',e=>{if(e.key==='f')document.documentElement.requestFullscreen().catch(()=>{});if(e.key==='c')clearWells();});

function clearWells(){wells.length=0;}
function presetOrbit(){clearWells();wells.push({x:W/2,y:H/2,mass:120,phase:0});}
function presetDual(){clearWells();wells.push({x:W*.35,y:H/2,mass:80,phase:0});wells.push({x:W*.65,y:H/2,mass:80,phase:Math.PI});}

// === JS FALLBACK PHYSICS ===
const PERCEPTION=50,SEP_DIST=20,MAX_SPEED=5,MAX_FORCE=.2;

function updateJS(dt){
  const n=boidCount;
  for(let bi=n-1;bi>=0;bi--){
    if(!aliveArr[bi])continue;
    let bx=jsPx[bi],by=jsPy[bi],bvx=jsVx[bi],bvy=jsVy[bi];
    let sepX=0,sepY=0,sepN=0;
    let aliX=0,aliY=0,aliN=0;
    let cohX=0,cohY=0,cohN=0;
    let panic=0;

    for(let oi=0;oi<n;oi++){
      if(oi===bi||!aliveArr[oi])continue;
      const dx=jsPx[oi]-bx,dy=jsPy[oi]-by;
      const d=Math.sqrt(dx*dx+dy*dy);if(d>PERCEPTION)continue;
      if(d<SEP_DIST&&d>0){sepX-=dx/d;sepY-=dy/d;sepN++;}
      aliX+=jsVx[oi];aliY+=jsVy[oi];aliN++;
      cohX+=jsPx[oi];cohY+=jsPy[oi];cohN++;
    }

    let fx=0,fy=0;
    if(sepN>0){fx+=sepX/sepN*1.5;fy+=sepY/sepN*1.5;}
    if(aliN>0){fx+=(aliX/aliN-bvx)*.05;fy+=(aliY/aliN-bvy)*.05;}
    if(cohN>0){fx+=(cohX/cohN-bx)*.003;fy+=(cohY/cohN-by)*.003;}

    // Gravity from wells
    let dead=false;
    for(const w of wells){
      const dx=w.x-bx,dy=w.y-by;
      const d2=dx*dx+dy*dy;const d=Math.sqrt(d2);
      if(d<15){dead=true;captured++;break;}
      const gForce=w.mass*20/(d2+500);
      fx+=dx/d*gForce;fy+=dy/d*gForce;
      if(d<150)panic=Math.max(panic,1-d/150);
    }
    if(dead){aliveArr[bi]=0;continue;}

    if(panic>.3){
      for(const w of wells){
        const dx=w.x-bx,dy=w.y-by;
        const d=Math.sqrt(dx*dx+dy*dy)||1;
        if(d<150){fx-=dx/d*panic*.3;fy-=dy/d*panic*.3;}
      }
    }

    const fMag=Math.sqrt(fx*fx+fy*fy);
    const maxF=MAX_FORCE*(1+panic*2);
    if(fMag>maxF){fx=fx/fMag*maxF;fy=fy/fMag*maxF;}

    bvx+=fx;bvy+=fy;
    const spd=Math.sqrt(bvx*bvx+bvy*bvy);
    const maxS=MAX_SPEED*(1+panic);
    if(spd>maxS){bvx=bvx/spd*maxS;bvy=bvy/spd*maxS;}

    bx+=bvx;by+=bvy;
    if(bx<0)bx=W;if(bx>W)bx=0;if(by<0)by=H;if(by>H)by=0;

    jsPx[bi]=bx;jsPy[bi]=by;jsVx[bi]=bvx;jsVy[bi]=bvy;
    panicArr[bi]=panic;
  }

  // Respawn if too few alive
  let alive=0;for(let i=0;i<boidCount;i++)if(aliveArr[i])alive++;
  if(alive<30)for(let i=0;i<5;i++)addBoid();
}

// === WASM PHYSICS ===
function updateWasm(dt){
  // Set attractor (first well or center if none)
  if(wells.length>0){
    wasm.boids_set_attractor(wells[0].x,wells[0].y,wells[0].mass);
  }else{
    wasm.boids_set_attractor(W/2,H/2,0);
  }
  wasm.boids_step(dt);
  boidCount=wasm.boids_get_count();
  // Refresh views in case memory grew
  if(wasmPx.buffer!==wasm.memory.buffer)refreshWasmViews();

  // Compute panic per boid from well proximity (rendering-only state)
  const px=wasmPx,py=wasmPy;
  for(let i=0;i<boidCount;i++){
    let panic=0;
    let dead=false;
    for(const w of wells){
      const dx=w.x-px[i],dy=w.y-py[i];
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<15){dead=true;captured++;break;}
      if(d<150)panic=Math.max(panic,1-d/150);
    }
    if(dead){aliveArr[i]=0;}else{aliveArr[i]=1;}
    panicArr[i]=panic;
  }
}

function update(dt){
  if(useWasm)updateWasm(dt);
  else updateJS(dt);

  // Update trails for all alive boids
  const px=useWasm?wasmPx:jsPx;
  const py=useWasm?wasmPy:jsPy;
  for(let i=0;i<boidCount;i++){
    if(!aliveArr[i])continue;
    const off=i*TRAIL_LEN;
    const h=trailHead[i];
    trailX[off+h]=px[i];
    trailY[off+h]=py[i];
    trailHead[i]=(h+1)%TRAIL_LEN;
    if(trailCount[i]<TRAIL_LEN)trailCount[i]++;
  }
}

// === RENDER ===
let time=0,lastT=0;
function anim(now){
  requestAnimationFrame(anim);
  if(!lastT)lastT=now;
  const dt=Math.min((now-lastT)/1000,.05);
  lastT=now;
  time+=dt;

  X.fillStyle='rgba(2,2,16,.1)';X.fillRect(0,0,W,H);
  update(dt);

  const px=useWasm?wasmPx:jsPx;
  const py=useWasm?wasmPy:jsPy;
  const vx=useWasm?wasmVx:jsVx;
  const vy=useWasm?wasmVy:jsVy;

  // Wells
  for(const w of wells){
    w.phase+=.02;
    const r=Math.sqrt(w.mass)*2;
    const grad=X.createRadialGradient(w.x,w.y,0,w.x,w.y,r*4);
    grad.addColorStop(0,'rgba(100,68,255,.15)');grad.addColorStop(.5,'rgba(40,20,80,.05)');grad.addColorStop(1,'rgba(0,0,0,0)');
    X.fillStyle=grad;X.globalAlpha=.5;X.beginPath();X.arc(w.x,w.y,r*4,0,Math.PI*2);X.fill();
    X.strokeStyle='rgba(100,68,255,.15)';X.lineWidth=1;X.globalAlpha=.2;
    X.beginPath();X.ellipse(w.x,w.y,r*2.5,r*.7,w.phase,0,Math.PI*2);X.stroke();
    X.globalAlpha=.3;X.fillStyle='rgba(150,100,255,.2)';
    X.beginPath();X.arc(w.x,w.y,r*.3,0,Math.PI*2);X.fill();
  }

  // Boid trails
  for(let i=0;i<boidCount;i++){
    if(!aliveArr[i]||trailCount[i]<2)continue;
    const off=i*TRAIL_LEN;
    const cnt=trailCount[i];
    const head=trailHead[i];
    const color=panicArr[i]>.3?'rgba(255,100,80,.06)':'rgba(136,200,255,.04)';
    X.strokeStyle=color;X.lineWidth=.5;X.globalAlpha=1;
    X.beginPath();
    // Read ring buffer from oldest to newest
    const start=(head-cnt+TRAIL_LEN)%TRAIL_LEN;
    for(let j=0;j<cnt;j++){
      const idx=off+(start+j)%TRAIL_LEN;
      if(j===0)X.moveTo(trailX[idx],trailY[idx]);
      else X.lineTo(trailX[idx],trailY[idx]);
    }
    X.stroke();
  }

  // Boids
  for(let i=0;i<boidCount;i++){
    if(!aliveArr[i])continue;
    const bvx=vx[i],bvy=vy[i];
    const angle=Math.atan2(bvy,bvx);
    const spd=Math.sqrt(bvx*bvx+bvy*bvy);
    const sz=2.5+spd*.3;
    const panic=panicArr[i];
    const hue=panic>.3?0+panic*30:hueArr[i];
    const sat=panic>.3?80:50;
    X.globalAlpha=.5+panic*.3;X.fillStyle='hsl('+hue+','+sat+'%,60%)';
    X.save();X.translate(px[i],py[i]);X.rotate(angle);
    X.beginPath();X.moveTo(sz,0);X.lineTo(-sz*.5,-sz*.4);X.lineTo(-sz*.5,sz*.4);X.closePath();X.fill();
    X.restore();
  }

  X.globalAlpha=1;
  const engine=useWasm?'WASM':'JS';
  document.getElementById('stats').textContent=
    'boids: '+boidCount+'\nwells: '+wells.length+'\ncaptured: '+captured+'\nengine: '+engine;
}

// === INIT ===
initWasm().then(()=>{
  addBoids(INITIAL_COUNT);
  requestAnimationFrame(anim);
});
</script>
<script>try{const _pc=new BroadcastChannel("cosmic-pulse");const _pn="swarm-gravity.html";setInterval(()=>_pc.postMessage({type:"pulse",href:_pn}),1000);}catch(e){}</script>
</body>
