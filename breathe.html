<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Breathe</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000'/><circle cx='16' cy='16' r='8' fill='none' stroke='%2344ddaa' stroke-width='1' opacity='.5'/></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#050508;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;cursor:default;display:flex;justify-content:center;align-items:center;height:100vh}
    canvas{position:fixed;top:0;left:0;z-index:0}
    #center{position:relative;z-index:2;text-align:center;pointer-events:none}
    #phase{color:rgba(255,255,255,.4);font-size:18px;font-weight:200;letter-spacing:8px;margin-bottom:20px;transition:opacity 1s}
    #timer{color:rgba(255,255,255,.15);font-size:12px;letter-spacing:3px;margin-top:30px}
    #controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
    .btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);padding:6px 16px;border-radius:14px;cursor:pointer;font-size:11px;transition:all .2s}
    .btn:hover{background:rgba(255,255,255,.08);color:#fff}
    .btn.on{background:rgba(68,221,170,.1);border-color:rgba(68,221,170,.2);color:#fff}
    #pattern{position:fixed;top:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.2);font-size:10px;letter-spacing:2px;z-index:10}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="center">
  <div id="phase">CLICK TO BEGIN</div>
  <div id="timer"></div>
</div>
<div id="pattern">4-7-8 BREATHING</div>
<div id="controls">
  <button class="btn on" id="btnStart" onclick="toggle()">Start</button>
  <button class="btn" onclick="cyclePattern()">Pattern</button>
  <button class="btn" onclick="cycleTheme()">Theme</button>
  <button class="btn" onclick="toggleSound()">Sound</button>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight;}
resize();addEventListener('resize',resize);

// State
let active=false,breathPhase=0,breathTimer=0,totalTime=0,soundOn=false,cycles=0;
let lifetimeBreaths=+(localStorage.getItem('breathe_total')||0);
let aC=null,oscL=null,oscR=null,gainNode=null;

// Breathing patterns: [inhale, hold, exhale, hold] in seconds
const PATTERNS=[
  {name:'4-7-8 BREATHING',times:[4,7,8,0]},
  {name:'BOX BREATHING',times:[4,4,4,4]},
  {name:'CALM BREATH',times:[6,0,6,0]},
  {name:'ENERGIZE',times:[2,2,2,2]},
];
let patIdx=0;
const PHASES=['INHALE','HOLD','EXHALE','HOLD'];

// Themes
const THEMES=[
  {name:'Aurora',bg:[5,5,8],color:'68,221,170',accent:'#44ddaa'},
  {name:'Nebula',bg:[8,5,12],color:'170,120,255',accent:'#aa78ff'},
  {name:'Solar',bg:[10,6,2],color:'255,180,80',accent:'#ffb450'},
  {name:'Void',bg:[3,3,6],color:'150,150,200',accent:'#9696c8'},
];
let thIdx=0,th2=THEMES[0];

// Audio — binaural beats
function initSound(){
  aC=new(AudioContext||webkitAudioContext)();
  gainNode=aC.createGain();gainNode.gain.value=.06;gainNode.connect(aC.destination);
  oscL=aC.createOscillator();oscR=aC.createOscillator();
  const panL=aC.createStereoPanner();panL.pan.value=-1;
  const panR=aC.createStereoPanner();panR.pan.value=1;
  oscL.type='sine';oscR.type='sine';oscL.frequency.value=200;oscR.frequency.value=204;// 4Hz theta binaural
  oscL.connect(panL);panL.connect(gainNode);oscR.connect(panR);panR.connect(gainNode);
  oscL.start();oscR.start();}

function updateSound(){
  if(!soundOn||!aC)return;
  const t=aC.currentTime;const pat=PATTERNS[patIdx];const dur=pat.times[breathPhase];
  // Breath tone — rising on inhale, falling on exhale
  const sweep=breathPhase===0?150+progress*80:breathPhase===2?230-progress*80:200;
  const baseF=sweep;
  oscL.frequency.setTargetAtTime(baseF,t,.5);oscR.frequency.setTargetAtTime(baseF+4,t,.5);
  // Volume follows breath
  const vol=breathPhase===0?.08:breathPhase===2?.04:.06;
  gainNode.gain.setTargetAtTime(vol,t,.3);}

function toggleSound(){
  if(!soundOn){if(!aC)initSound();else aC.resume();soundOn=true;}
  else{soundOn=false;if(gainNode)gainNode.gain.setTargetAtTime(0,aC.currentTime,.1);}}

// Particles
const particles=[];for(let i=0;i<200;i++){
  particles.push({angle:Math.random()*Math.PI*2,dist:100+Math.random()*200,speed:.001+Math.random()*.002,
    sz:1+Math.random()*2,phase:Math.random()*Math.PI*2});}

function toggle(){active=!active;document.getElementById('btnStart').textContent=active?'Pause':'Start';
  document.getElementById('btnStart').classList.toggle('on',active);
  if(active)document.getElementById('phase').textContent=PHASES[0];}
function cyclePattern(){patIdx=(patIdx+1)%PATTERNS.length;document.getElementById('pattern').textContent=PATTERNS[patIdx].name;breathPhase=0;breathTimer=0;}
function cycleTheme(){thIdx=(thIdx+1)%THEMES.length;th2=THEMES[thIdx];}

// Render
function anim(){requestAnimationFrame(anim);
  const pat=PATTERNS[patIdx];const phaseDur=pat.times[breathPhase]||.01;

  if(active){
    breathTimer+=1/60;totalTime+=1/60;
    if(breathTimer>=phaseDur){breathTimer=0;const prev=breathPhase;breathPhase=(breathPhase+1)%4;
      if(prev===2){cycles++;lifetimeBreaths++;localStorage.setItem('breathe_total',''+lifetimeBreaths);if(cycles===10)document.getElementById('phase').textContent='10 BREATHS · WELL DONE';
        if(cycles===25)document.getElementById('phase').textContent='25 · YOU ARE CALM';
        if(cycles===50)document.getElementById('phase').textContent='50 · MASTERY';
        const quotes=['Be here now','This moment is enough','Breathe and let be','You are the sky','Stillness speaks'];
        if(cycles>5&&cycles%5===0)document.getElementById('timer').textContent+='\n'+quotes[(cycles/5|0)%quotes.length];}
      // Skip zero-duration phases
      while(pat.times[breathPhase]===0)breathPhase=(breathPhase+1)%4;
      document.getElementById('phase').textContent=PHASES[breathPhase];
      document.getElementById('phase').style.color=['rgba(100,200,255,.5)','rgba(255,200,100,.4)','rgba(100,255,150,.5)','rgba(255,200,100,.4)'][breathPhase];
      updateSound();}
    const min=totalTime/60|0;const sec=totalTime%60|0;
    document.getElementById('timer').textContent=min+'m '+sec+'s · '+cycles+' breaths · '+lifetimeBreaths+' lifetime';}

  // Breath progress 0→1
  const progress=breathTimer/phaseDur;
  // Scale: inhale expands, exhale contracts
  let scale=1;
  if(breathPhase===0)scale=.6+progress*.6;// 0.6 → 1.2
  else if(breathPhase===2)scale=1.2-progress*.6;// 1.2 → 0.6
  else scale=breathPhase===1?1.2:.6;// hold at current
  if(!active)scale=.8+Math.sin(Date.now()*.001)*.1;

  // Phase-based background tint
  const phaseTint=[[0,2,8],[3,3,5],[0,5,3],[2,2,4]][breathPhase]||[0,0,0];
  // Background
  const[br,bg,bb]=[th2.bg[0]+phaseTint[0],th2.bg[1]+phaseTint[1],th2.bg[2]+phaseTint[2]];
  X.fillStyle=`rgba(${br},${bg},${bb},.12)`;X.fillRect(0,0,W,H);

  const cx=W/2,cy=H/2;

  // Mandala rings
  for(let ring=0;ring<6;ring++){
    const r=(80+ring*35)*scale;const segments=6+ring*2;
    X.globalAlpha=.04-ring*.005;X.strokeStyle=`rgba(${th2.color},1)`;X.lineWidth=.5;
    X.beginPath();
    for(let i=0;i<=segments;i++){const a=i*Math.PI*2/segments+Date.now()*.0001*(ring%2?1:-1);
      const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
      i===0?X.moveTo(px,py):X.lineTo(px,py);}
    X.closePath();X.stroke();}

  // Central breathing circle
  const mainR=60*scale;
  const grad=X.createRadialGradient(cx,cy,0,cx,cy,mainR*2);
  grad.addColorStop(0,`rgba(${th2.color},.08)`);grad.addColorStop(.5,`rgba(${th2.color},.03)`);
  grad.addColorStop(1,'rgba(0,0,0,0)');
  X.globalAlpha=.6;X.fillStyle=grad;X.beginPath();X.arc(cx,cy,mainR*2,0,Math.PI*2);X.fill();

  // Inner circle with segment glow
  X.globalAlpha=.12;X.strokeStyle=`rgba(${th2.color},1)`;X.lineWidth=1.5;
  X.beginPath();X.arc(cx,cy,mainR,0,Math.PI*2);X.stroke();
  // Glowing segment
  if(active){X.globalAlpha=.2;X.strokeStyle=th2.accent;X.lineWidth=3;
    const segAngle=Math.PI/4;const segStart=-Math.PI/2+progress*Math.PI*2;
    X.beginPath();X.arc(cx,cy,mainR,segStart,segStart+segAngle);X.stroke();}

  // Progress arc
  if(active){X.globalAlpha=.25;X.strokeStyle=th2.accent;X.lineWidth=2;
    X.beginPath();X.arc(cx,cy,mainR,-Math.PI/2,-Math.PI/2+progress*Math.PI*2);X.stroke();}

  // Particles orbit the center
  for(const p of particles){
    p.angle+=p.speed*(breathPhase===0?1.5:breathPhase===2?.5:1);
    const d=p.dist*scale;const px=cx+Math.cos(p.angle+p.phase)*d;const py=cy+Math.sin(p.angle+p.phase)*d;
    p.phase+=Math.sin(Date.now()*.0005+p.angle)*.001;
    X.globalAlpha=.15+Math.sin(p.angle*3)*.1;X.fillStyle=`rgba(${th2.color},1)`;
    X.beginPath();X.arc(px,py,p.sz*(.5+scale*.5),0,Math.PI*2);X.fill();}

  // Background stars
  X.globalAlpha=.06;X.fillStyle='#fff';
  for(let i=0;i<50;i++){const x=(Math.sin(i*127.1+Date.now()*.00003)*.5+.5)*W;
    const y=(Math.cos(i*311.7+Date.now()*.00002)*.5+.5)*H;
    X.beginPath();X.arc(x,y,.5+Math.sin(Date.now()*.002+i)*.3,0,Math.PI*2);X.fill();}
  X.globalAlpha=1;}

addEventListener('click',e=>{if(!e.target.closest('#controls'))if(!active)toggle();});
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();toggle();}});
anim();
addEventListener("keydown",e=>{if(e.key==="f"&&!e.target.closest("input"))document.documentElement.requestFullscreen().catch(()=>{});});
</script>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a>
<script>try{const _pc=new BroadcastChannel("cosmic-pulse");const _pn="breathe.html";setInterval(()=>_pc.postMessage({type:"pulse",href:_pn}),1000);}catch(e){}</script>
</body>
</html>
