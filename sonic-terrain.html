<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonic Terrain</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000'/><path d='M6 22 L16 8 L26 22' fill='none' stroke='%23ff8844' stroke-width='1.5' opacity='.5'/><circle cx='16' cy='15' r='3' fill='none' stroke='%2344aaff' stroke-width='.8' opacity='.4'/></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;cursor:crosshair}
    canvas{display:block}
    #hud{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:10;pointer-events:none}
    .meter{display:flex;flex-direction:column;align-items:center;gap:4px}
    .meter-label{color:rgba(255,255,255,.2);font-size:8px;letter-spacing:2px}
    .meter-val{color:rgba(255,200,100,.5);font-size:14px;font-weight:200}
    #info{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.15);font-size:9px;letter-spacing:3px;z-index:2;pointer-events:none}
    #note-display{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.03);font-size:120px;font-weight:100;pointer-events:none;z-index:1;transition:opacity .3s}
    #waveform{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:300px;height:40px;z-index:5;pointer-events:none}
    #scale-indicator{position:fixed;top:40px;left:50%;transform:translateX(-50%);color:rgba(255,200,100,.2);font-size:10px;letter-spacing:2px;z-index:2;pointer-events:none}
    .btn{position:fixed;z-index:20;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.3);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:9px;letter-spacing:1px}
    .btn:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
  </style>
</head>
<body>
<div id="note-display"></div>
<div id="info">SCROLL TO FLY &middot; MOUSE TO LOOK &middot; CLICK TO CHANGE WORLD &middot; M TO MUTE</div>
<div id="scale-indicator"></div>
<canvas id="c"></canvas>
<canvas id="waveform" width="300" height="40"></canvas>
<div id="hud">
  <div class="meter"><span class="meter-val" id="m-note">-</span><span class="meter-label">NOTE</span></div>
  <div class="meter"><span class="meter-val" id="m-freq">-</span><span class="meter-label">Hz</span></div>
  <div class="meter"><span class="meter-val" id="m-biome">-</span><span class="meter-label">VOICE</span></div>
  <div class="meter"><span class="meter-val" id="m-chord">-</span><span class="meter-label">CHORD</span></div>
  <div class="meter"><span class="meter-val" id="m-tempo">-</span><span class="meter-label">BPM</span></div>
</div>
<button class="btn" style="bottom:20px;right:16px" onclick="cycleScale()">Scale: <span id="scName">Pentatonic</span></button>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const WF=document.getElementById('waveform'),WX=WF.getContext('2d');
let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight;}
resize();addEventListener('resize',resize);

// === NOISE ===
function hash(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function smooth(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  return hash(ix,iy)*(1-sx)*(1-sy)+hash(ix+1,iy)*sx*(1-sy)+hash(ix,iy+1)*(1-sx)*sy+hash(ix+1,iy+1)*sx*sy;}
function fbm(x,y,oct){let v=0,a=.5,f=1;for(let i=0;i<oct;i++){v+=smooth(x*f,y*f)*a;a*=.5;f*=2;}return v;}

// === CAMERA ===
let camX=0,camZ=0,camY=80,pitch=.4,yaw=0,speed=0;
let mx=0,my=0;
let seed=Math.random()*1000|0;

// === WORLDS (Terrain + Music personality) ===
const WORLDS=[
  {name:'CRYSTALLINE SHORE',water:.35,snow:.75,
   colors:['#1a3a6c','#2a7a4a','#5a9a4a','#9a8a5a','#bbb','#fff'],sky:[8,12,35],
   voice:'sine',baseFreq:220,scale:'pentatonic',reverb:.4},
  {name:'EMBER WASTES',water:.1,snow:.9,
   colors:['#5a2020','#7a3020','#9a4a30','#ba6a40','#dd9a70','#eeccaa'],sky:[25,8,3],
   voice:'sawtooth',baseFreq:110,scale:'minor',reverb:.2},
  {name:'FROZEN HYMN',water:.2,snow:.4,
   colors:['#1a2a5a','#3a6a8a','#8abbdd','#bbddee','#ddeeff','#fff'],sky:[3,6,18],
   voice:'triangle',baseFreq:330,scale:'major',reverb:.6},
  {name:'LAVA PSALM',water:.05,snow:.95,
   colors:['#1a0a0a','#3a1a0a','#7a2a0a','#bb4a0a','#ff7a20','#ffbb40'],sky:[18,4,1],
   voice:'square',baseFreq:82.4,scale:'blues',reverb:.15},
  {name:'BIOLUMINESCENT DRIFT',water:.3,snow:.8,
   colors:['#0a1a3a','#1a5a4a','#2a9a7a','#5abb5a','#aadd6a','#ddffcc'],sky:[4,10,20],
   voice:'sine',baseFreq:196,scale:'dorian',reverb:.5},
];
let world=WORLDS[seed%WORLDS.length];

// === MUSIC SCALES ===
const SCALES={
  pentatonic:[0,2,4,7,9],
  minor:[0,2,3,5,7,8,10],
  major:[0,2,4,5,7,9,11],
  dorian:[0,2,3,5,7,9,10],
  blues:[0,3,5,6,7,10],
};
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let currentScale='pentatonic';
const scaleKeys=Object.keys(SCALES);
function cycleScale(){
  const i=(scaleKeys.indexOf(currentScale)+1)%scaleKeys.length;
  currentScale=scaleKeys[i];
  document.getElementById('scName').textContent=currentScale.charAt(0).toUpperCase()+currentScale.slice(1);
}

// === AUDIO ENGINE ===
let aC=null,masterGain=null,compressor=null,convolver=null;
let muted=false;
const activeOscs={melody:null,bass:null,pad1:null,pad2:null,arp:null};
const activeGains={melody:null,bass:null,pad1:null,pad2:null,arp:null};

function initAudio(){
  aC=new(AudioContext||webkitAudioContext)();
  compressor=aC.createDynamicsCompressor();
  compressor.threshold.value=-24;compressor.ratio.value=4;
  masterGain=aC.createGain();masterGain.gain.value=.25;
  // Reverb
  convolver=aC.createConvolver();
  const r=aC.sampleRate,l=r*2.5,buf=aC.createBuffer(2,l,r);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,2.5);}
  convolver.buffer=buf;
  const reverbGain=aC.createGain();reverbGain.gain.value=.3;
  masterGain.connect(compressor);compressor.connect(aC.destination);
  masterGain.connect(convolver);convolver.connect(reverbGain);reverbGain.connect(aC.destination);
  // Create persistent oscillators
  for(const key of Object.keys(activeOscs)){
    const osc=aC.createOscillator();
    const gain=aC.createGain();
    osc.type=key==='bass'?'sine':key==='arp'?'triangle':'sine';
    gain.gain.value=0;
    osc.connect(gain);gain.connect(masterGain);
    osc.start();
    activeOscs[key]=osc;activeGains[key]=gain;
  }
}

function quantizeToScale(freq,scale){
  const midi=12*Math.log2(freq/440)+69;
  const note=Math.round(midi);
  const octave=Math.floor(note/12);
  const pc=((note%12)+12)%12;
  const intervals=SCALES[scale];
  let closest=intervals[0],minDist=99;
  for(const iv of intervals){const d=Math.abs(pc-iv);if(d<minDist){minDist=d;closest=iv;}}
  const quantized=octave*12+closest;
  return 440*Math.pow(2,(quantized-69)/12);
}

function heightToFreq(h,baseFreq){
  // Map height 0-1 to 2 octaves above base
  const raw=baseFreq*Math.pow(2,h*2);
  return quantizeToScale(raw,currentScale);
}

function freqToNoteName(f){
  const midi=Math.round(12*Math.log2(f/440)+69);
  return NOTE_NAMES[((midi%12)+12)%12]+(Math.floor(midi/12)-1);
}

// Chord from scale position
function getChordFreqs(rootFreq,scale){
  const midi=Math.round(12*Math.log2(rootFreq/440)+69);
  const pc=((midi%12)+12)%12;
  const intervals=SCALES[scale];
  const rootIdx=intervals.indexOf(pc);
  if(rootIdx===-1)return[rootFreq];
  const third=intervals[(rootIdx+2)%intervals.length];
  const fifth=intervals[(rootIdx+4)%intervals.length];
  const oct=Math.floor(midi/12);
  return[
    440*Math.pow(2,(oct*12+intervals[rootIdx]-69)/12),
    440*Math.pow(2,(oct*12+third-69)/12),
    440*Math.pow(2,(oct*12+fifth-69)/12),
  ];
}

let lastNoteTime=0,arpStep=0;
function updateAudio(h,biome,spd){
  if(!aC||muted)return;
  const t=aC.currentTime;
  const baseFreq=world.baseFreq;
  const melodyFreq=heightToFreq(h,baseFreq);
  const bassFreq=quantizeToScale(baseFreq*(.5+h*.5),currentScale)/2;
  const chord=getChordFreqs(melodyFreq*.5,currentScale);
  // Tempo based on speed
  const tempo=60+Math.abs(spd)*40;
  const beatInterval=60/tempo;
  // Melody — follows terrain height
  activeOscs.melody.type=world.voice;
  activeOscs.melody.frequency.setTargetAtTime(melodyFreq,t,.08);
  activeGains.melody.gain.setTargetAtTime(Math.abs(spd)>.3?.04:.01,t,.1);
  // Bass — low drone
  activeOscs.bass.frequency.setTargetAtTime(bassFreq,t,.3);
  activeGains.bass.gain.setTargetAtTime(.03,t,.2);
  // Pad — chord tones
  if(chord.length>=2){
    activeOscs.pad1.frequency.setTargetAtTime(chord[1]*.5,t,.15);
    activeGains.pad1.gain.setTargetAtTime(.015,t,.3);
  }
  if(chord.length>=3){
    activeOscs.pad2.frequency.setTargetAtTime(chord[2]*.5,t,.15);
    activeGains.pad2.gain.setTargetAtTime(.012,t,.3);
  }
  // Arpeggio — plays scale notes rhythmically when moving
  if(Math.abs(spd)>.5&&t-lastNoteTime>beatInterval){
    lastNoteTime=t;
    const intervals=SCALES[currentScale];
    const arpNote=intervals[arpStep%intervals.length];
    const arpFreq=melodyFreq*Math.pow(2,arpNote/12-Math.floor(arpNote/12));
    activeOscs.arp.frequency.setTargetAtTime(quantizeToScale(arpFreq,currentScale),t,.01);
    activeGains.arp.gain.setTargetAtTime(.025,t,.01);
    activeGains.arp.gain.setTargetAtTime(0,t+beatInterval*.6,.05);
    arpStep++;
  }
  // Update HUD
  document.getElementById('m-note').textContent=freqToNoteName(melodyFreq);
  document.getElementById('m-freq').textContent=Math.round(melodyFreq);
  document.getElementById('m-biome').textContent=biome;
  document.getElementById('m-chord').textContent=chord.slice(0,3).map(f=>freqToNoteName(f)).join(' ');
  document.getElementById('m-tempo').textContent=Math.round(tempo);
  document.getElementById('note-display').textContent=freqToNoteName(melodyFreq);
  document.getElementById('scale-indicator').textContent=world.name+' · '+currentScale.toUpperCase();
}

// === TERRAIN ===
function getHeight(wx,wz){return fbm(wx*.008+seed,wz*.008+seed*2,6);}
function getColor(h){
  const cols=world.colors;
  if(h<world.water)return cols[0];
  const land=(h-world.water)/(1-world.water);
  if(land<.2)return cols[1];if(land<.4)return cols[2];if(land<.6)return cols[3];
  if(h>world.snow)return cols[5];return cols[4];
}
function getBiome(h){
  if(h<world.water)return 'ocean';
  const land=(h-world.water)/(1-world.water);
  if(land<.15)return 'shore';if(land<.35)return 'plains';
  if(land<.55)return 'hills';if(h>world.snow)return 'peaks';return 'ridge';
}

// === INPUT ===
let audioStarted=false;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
addEventListener('wheel',e=>{e.preventDefault();speed+=e.deltaY>0?.5:-.5;},{passive:false});
addEventListener('click',()=>{
  if(!audioStarted){initAudio();audioStarted=true;}
  seed=Math.random()*1000|0;world=WORLDS[seed%WORLDS.length];
  currentScale=world.scale;
  document.getElementById('scName').textContent=currentScale.charAt(0).toUpperCase()+currentScale.slice(1);
});
addEventListener('keydown',e=>{
  if(e.key==='f')document.documentElement.requestFullscreen().catch(()=>{});
  if(e.key==='m'){muted=!muted;if(masterGain)masterGain.gain.setTargetAtTime(muted?0:.25,aC.currentTime,.1);}
  if(e.key==='s'||e.key==='S')cycleScale();
});
// Touch
let touchY=0;
addEventListener('touchstart',e=>{
  if(!audioStarted){initAudio();audioStarted=true;}
  touchY=e.touches[0].clientY;
},{passive:true});
addEventListener('touchmove',e=>{
  const dy=touchY-e.touches[0].clientY;touchY=e.touches[0].clientY;
  speed+=dy*.05;mx=e.touches[0].clientX;my=e.touches[0].clientY;
},{passive:true});

// === NOTE PARTICLES ===
const noteParticles=[];
function spawnNoteParticle(x,y,hue){
  noteParticles.push({x,y,vx:(Math.random()-.5)*2,vy:-Math.random()*3-1,life:1,hue,sz:2+Math.random()*3});
}

// === WAVEFORM VISUALIZER ===
function drawWaveform(h){
  WX.clearRect(0,0,300,40);
  WX.strokeStyle=`hsla(${h*360},60%,60%,.3)`;
  WX.lineWidth=1;WX.beginPath();
  const t=performance.now()*.002;
  for(let i=0;i<300;i++){
    const v=Math.sin(i*.05+t)*Math.sin(i*.02+t*.7)*15+20;
    i===0?WX.moveTo(i,v):WX.lineTo(i,v);
  }
  WX.stroke();
}

// === RENDER ===
const stars=Array.from({length:60},()=>({x:Math.random()*3e3,y:Math.random()*3e3,s:Math.random(),p:Math.random()*Math.PI*2}));
let frame=0;

function anim(){requestAnimationFrame(anim);frame++;
  // Camera
  yaw+=(mx/W-.5)*.03;pitch=.1+(my/H)*.8;
  speed*=.95;
  camX+=Math.sin(yaw)*speed;camZ+=Math.cos(yaw)*speed;
  const groundH=getHeight(camX*.1,camZ*.1);
  camY=60+groundH*120;

  // Sky
  const[sr,sg,sb]=world.sky;
  const skyG=X.createLinearGradient(0,0,0,H*.6);
  skyG.addColorStop(0,`rgb(${sr},${sg},${sb})`);
  skyG.addColorStop(1,`rgb(${sr*3},${sg*3},${sb*2})`);
  X.fillStyle=skyG;X.fillRect(0,0,W,H*.6);
  X.fillStyle=`rgb(${sr},${sg},${sb})`;X.fillRect(0,H*.6,W,H*.4);

  // Stars
  X.fillStyle='#fff';
  for(const s of stars){s.p+=.002;X.globalAlpha=.06+Math.sin(s.p)*.03;
    X.beginPath();X.arc(s.x%W,s.y%H*.5,s.s,0,Math.PI*2);X.fill();}

  // Terrain with music-reactive glow
  const COLS=Math.min(W,200),DETAIL=120;
  let terrainHeights=[];
  for(let col=0;col<COLS;col++){
    const screenX=col/COLS;const angle=yaw+(screenX-.5)*.8;
    let maxY=H;
    for(let d=1;d<DETAIL;d++){
      const dist=d*3;
      const wx=camX+Math.sin(angle)*dist;const wz=camZ+Math.cos(angle)*dist;
      const h=getHeight(wx*.1,wz*.1);
      const terrainY=h*120;
      const screenY=H*.5+(camY-terrainY)/(dist*.04)*pitch;
      if(screenY<maxY&&screenY>0){
        const fog=Math.min(1,dist/300);
        const baseCol=getColor(h);
        X.globalAlpha=1-fog*.7;X.fillStyle=baseCol;
        const colW=Math.ceil(W/COLS)+1;
        X.fillRect(col*W/COLS,screenY,colW,maxY-screenY);
        // Music-reactive edge glow when moving
        if(d<20&&Math.abs(speed)>1){
          X.globalAlpha=.1*(1-d/20);
          X.fillStyle=`hsl(${h*360},70%,60%)`;
          X.fillRect(col*W/COLS,screenY,colW,2);
          if(frame%8===0&&Math.random()<.3)spawnNoteParticle(col*W/COLS,screenY,h*360);
        }
        maxY=screenY;
        if(col===COLS/2|0)terrainHeights.push(h);
      }
    }
  }

  // Sun with pulse
  const pulse=Math.sin(frame*.02)*.1+1;
  X.globalAlpha=.12*pulse;X.fillStyle='#ffeecc';
  const sunX=W*.8+Math.sin(Date.now()*.0001)*100;
  X.beginPath();X.arc(sunX,H*.15,20*pulse,0,Math.PI*2);X.fill();
  X.globalAlpha=.03;X.beginPath();X.arc(sunX,H*.15,60,0,Math.PI*2);X.fill();

  // Note particles
  X.globalAlpha=1;
  for(let i=noteParticles.length-1;i>=0;i--){
    const p=noteParticles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life-=.015;
    if(p.life<=0){noteParticles.splice(i,1);continue;}
    X.globalAlpha=p.life*.6;
    X.fillStyle=`hsl(${p.hue},70%,70%)`;
    X.beginPath();X.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);X.fill();
  }

  // Frequency bars on edges
  if(audioStarted&&Math.abs(speed)>.3){
    const barH=groundH*H*.3;
    X.globalAlpha=.04;
    X.fillStyle=`hsl(${groundH*360},60%,50%)`;
    X.fillRect(0,H-barH,3,barH);
    X.fillRect(W-3,H-barH,3,barH);
  }

  X.globalAlpha=1;
  // Update audio with terrain data
  const biome=getBiome(groundH);
  updateAudio(groundH,biome,speed);
  drawWaveform(groundH);
}
anim();
</script>
</body>
</html>
