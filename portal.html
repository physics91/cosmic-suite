resize();addEventListener('resize',resize);

const EXP=[

  {name:'TOPOLOGY',desc:'Torus \u00b7 M\u00f6bius \u00b7 Klein \u00b7 Trefoil \u00b7 3D wireframe',tag:'shape',href:'topology.html',color:'#ff88aa',icon:'\u2205',orbit:30,cat:'think'},
  {name:'REACTION',desc:'Turing patterns \u00b7 coral \u00b7 mitosis \u00b7 maze \u00b7 Gray-Scott',tag:'emerge',href:'reaction.html',color:'#ffaa66',icon:'\u2234',orbit:31,cat:'think'},
  {name:'PENDULUM',desc:'Double/triple pendulum \u00b7 chaos theory \u00b7 butterfly effect',tag:'chaos',href:'pendulum.html',color:'#ffaa44',icon:'\u2307',orbit:32,cat:'think'},
  {name:'HARMONOGRAPH',desc:'Pendulum \u00d7 Fourier \u00b7 Lissajous \u00b7 Victorian science art',tag:'draw+physics',href:'harmonograph.html',color:'#ffcc88',icon:'\u221e',orbit:33,cat:'create'},
  {name:'ATTRACTOR',desc:'Lorenz \u00b7 R\u00f6ssler \u00b7 Aizawa \u00b7 strange attractors in 3D',tag:'chaos',href:'attractor.html',color:'#ff6644',icon:'\u2318',orbit:34,cat:'think'},
  {name:'NEURAL',desc:'Build neural networks \u00b7 watch thoughts propagate',tag:'brain',href:'neural.html',color:'#88ddff',icon:'\u2b22',orbit:35,cat:'think'},
  {name:'AUTOMATA',desc:'Wolfram rules \u00b7 Rule 30/90/110 \u00b7 1D cellular automata',tag:'compute',href:'automata.html',color:'#ff8844',icon:'\u25a6',orbit:36,cat:'think'},
  {name:'SANDBOX',desc:'Falling sand \u00b7 water \u00b7 fire \u00b7 acid \u00b7 pixel physics',tag:'build',href:'sandbox.html',color:'#cc9944',icon:'\u25a3',orbit:38,cat:'play'},
  {name:'FLOCKING',desc:'Boids \u00b7 3 rules create flocking \u00b7 predators \u00b7 species',tag:'swarm',href:'flocking.html',color:'#88ccff',icon:'\u2667',orbit:39,cat:'think'},
  {name:'SWARM GRAVITY',desc:'Flocking \u00d7 Gravity \u00b7 boids fight black holes',tag:'swarm+warp',href:'swarm-gravity.html',color:'#8866ff',icon:'\u2741',orbit:40,cat:'think'},
  {name:'FRACTAL',desc:'Mandelbrot \u00b7 Julia set \u00b7 infinite zoom \u00b7 6 palettes',tag:'infinite',href:'fractal.html',color:'#ff8844',icon:'\u2738',orbit:41,cat:'think'},
  {name:'SORTING',desc:'7 algorithms visualized \u00b7 hear the sort \u00b7 watch them think',tag:'compute',href:'sorting.html',color:'#4488ff',icon:'\u2261',orbit:42,cat:'think'},
  {name:'ORDER',desc:'Entropy \u00d7 Sorting \u00b7 simulated annealing \u00b7 crystallization',tag:'freeze',href:'order.html',color:'#6688ff',icon:'\u2726',orbit:43,cat:'feel'},
  {name:'PI WALK',desc:'\u03c0 / e / \u03c6 digits as direction \u00b7 walk through constants',tag:'math',href:'pi.html',color:'#ffcc88',icon:'\u03c0',orbit:44,cat:'think'},
  {name:'CHAOS MAP',desc:'Fractal \u00d7 Pendulum \u00b7 flip time fractal boundary',tag:'chaos+fractal',href:'chaos-map.html',color:'#ff6644',icon:'\u2592',orbit:45,cat:'think'},
  {name:'SPIROGRAPH',desc:'Gears within gears \u00b7 hypotrochoid \u00b7 export PNG',tag:'draw',href:'spirograph.html',color:'#44ffaa',icon:'\u2609',orbit:46,cat:'create'},
  {name:'ORBITS',desc:'Launch planets \u00b7 Kepler\u2019s laws \u00b7 binary stars \u00b7 figure-8',tag:'gravity',href:'orbits.html',color:'#ffcc44',icon:'\u2609',orbit:47,cat:'think'},
  {name:'CELLULAR MUSIC',desc:'Automata \u00d7 Music \u00b7 rules become melodies',tag:'compute+listen',href:'cellular-music.html',color:'#ffcc44',icon:'\u266b',orbit:37,cat:'create'},
];
document.getElementById('sub').textContent+=(' \u00b7 '+EXP.length+' EXPERIENCES');

let hovered=-1,t=0,mTrail=[],viewMode='orbit',filterCat='all';// orbit or galaxy
const bgStars=Array.from({length:200},()=>({x:Math.random()*3e3,y:Math.random()*3e3,s:Math.random()*1.5,p:Math.random()*Math.PI*2}));

// === COSMIC MEMORY — reads traces from all experiences ===
const cosmicMemory={
  breathCycles:+(localStorage.getItem('breathe_cycles')||0),
  orbitBest:+(localStorage.getItem('orbit_best')||0),
  orbitGames:+(localStorage.getItem('orbit_games')||0),
  cosmosStars:+(localStorage.getItem('cosmos_stars')||0),
  typedChars:+(localStorage.getItem('type_chars')||0),
  puzzleLevels:+(localStorage.getItem('puzzle_level')||0),
  racerBest:+(localStorage.getItem('racer_best')||0),
  memoryWins:+(localStorage.getItem('memory_wins')||0),
  beatsBest:+(localStorage.getItem('beats_best')||0),
  totalTime:+(localStorage.getItem('suite_time')||0),
  visits:+(localStorage.getItem('suite_visits')||0),
};
// Universe age = total seconds across all tracked activity
const universeAge=cosmicMemory.totalTime+cosmicMemory.breathCycles*60+cosmicMemory.orbitGames*30;
// "Constellations" formed by visited experiences
const visitedExps=[];
for(let i=0;i<EXP.length;i++){
  const key='visited_'+EXP[i].href.replace('.html','');
  if(localStorage.getItem(key))visitedExps.push(i);
}
// Mark current visit
function markVisit(href){localStorage.setItem('visited_'+href.replace('.html',''),'1');}
// Cosmic epoch name based on total engagement
function getEpoch(){
  const a=universeAge;
  if(a<60)return'THE VOID';if(a<300)return'THE SPARK';if(a<900)return'THE NEBULA';
  if(a<1800)return'THE IGNITION';if(a<3600)return'THE CONSTELLATION';
  if(a<7200)return'THE GALAXY';if(a<14400)return'THE SUPERCLUSTER';
  return'THE OBSERVABLE UNIVERSE';
}

// === COSMIC ACHIEVEMENTS ===
const ACHIEVEMENTS=[
  {id:'first_visit',name:'First Light',desc:'Visit your first experience',check:()=>visitedExps.length>=1},
  {id:'explorer_5',name:'Explorer',desc:'Visit 5 different experiences',check:()=>visitedExps.length>=5},
  {id:'explorer_10',name:'Voyager',desc:'Visit 10 different experiences',check:()=>visitedExps.length>=10},
  {id:'explorer_20',name:'Pioneer',desc:'Visit 20 different experiences',check:()=>visitedExps.length>=20},
  {id:'all_cats',name:'Renaissance',desc:'Visit all 4 categories',check:()=>{const cats=new Set(visitedExps.map(i=>EXP[i].cat));return cats.size>=4;}},
  {id:'time_10',name:'Deep Space',desc:'Spend 10 minutes total',check:()=>cosmicMemory.totalTime>=600},
  {id:'time_60',name:'Time Lord',desc:'Spend 60 minutes total',check:()=>cosmicMemory.totalTime>=3600},
  {id:'epoch_galaxy',name:'Galaxy Brain',desc:'Reach THE GALAXY epoch',check:()=>universeAge>=7200},
  {id:'night_owl',name:'Night Owl',desc:'Visit between midnight and 4am',check:()=>{const h=new Date().getHours();return h>=0&&h<4;}},
  {id:'returner',name:'Eternal Return',desc:'Visit the portal 10 times',check:()=>visits>=10},
];

const unlockedAch=JSON.parse(localStorage.getItem('suite_achievements')||'[]');
function checkAchievements(){
  let newUnlock=false;
  for(const a of ACHIEVEMENTS){
    if(unlockedAch.includes(a.id))continue;
    try{if(a.check()){unlockedAch.push(a.id);newUnlock=true;showAchievement(a);}}catch(e){}
  }
  if(newUnlock)localStorage.setItem('suite_achievements',JSON.stringify(unlockedAch));
}
let achNotification=null,achTimer=0;
function showAchievement(a){
  achNotification=a;achTimer=180; // 3 seconds at 60fps
}

// === COSMIC PULSE — multi-tab heartbeat via BroadcastChannel ===
const pulseChannel=new BroadcastChannel('cosmic-pulse');
const aliveExps={}; // {href: lastPulseTime}
pulseChannel.onmessage=e=>{
  if(e.data&&e.data.type==='pulse'){aliveExps[e.data.href]=Date.now();}
};
// Clean stale pulses
setInterval(()=>{const now=Date.now();for(const k of Object.keys(aliveExps)){if(now-aliveExps[k]>3000)delete aliveExps[k];}},2000);

function getPlanetPos(i){const cx=W/2,cy=H/2,exp=EXP[i];
  if(viewMode==='galaxy'){const gx=((i*127.1+37)%1-.5)*W*.7;const gy=((i*311.7+13)%1-.5)*H*.6;
    return{x:cx+gx+Math.sin(t*.3+i)*5,y:cy+gy+Math.cos(t*.2+i)*5};}
  const r=60+exp.orbit*30;const a=t*.2/exp.orbit+i*Math.PI*2/EXP.length;
  return{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r};}

C.addEventListener('mousemove',e=>{mTrail.push({x:e.clientX,y:e.clientY});if(mTrail.length>15)mTrail.shift();
  let best=-1,bd=2500;
  for(let i=0;i<EXP.length;i++){const{x:px,y:py}=getPlanetPos(i);
    const dx=e.clientX-px,dy=e.clientY-py;if(dx*dx+dy*dy<bd){bd=dx*dx+dy*dy;best=i;}}
  if(best!==hovered){
    if(best>=0&&!muted){
      if(!portalAC)initPortalAudio();
      // Fade in hovered planet's tone
      if(portalAC&&planetOscs[best]){
        planetOscs[best].gain.gain.setTargetAtTime(.03,portalAC.currentTime,.05);
      }
    }
    // Fade out previous
    if(hovered>=0&&portalAC&&planetOscs[hovered]){
      planetOscs[hovered].gain.gain.setTargetAtTime(0,portalAC.currentTime,.3);
    }
    hovered=best;
    if(best>=0){document.getElementById('lName').textContent=EXP[best].name;
      document.getElementById('lDesc').textContent=EXP[best].desc;
      document.getElementById('lTag').textContent=EXP[best].tag;
      document.getElementById('label').classList.add('show');document.body.style.cursor='pointer';}
    else{document.getElementById('label').classList.remove('show');document.body.style.cursor='default';}}});

// Daily cosmic seed — shared DNA across all experiences
const today=new Date();const cosmicSeed=(today.getFullYear()*10000+today.getMonth()*100+today.getDate());
C.addEventListener('click',e=>{
  let best=-1,bd=2500;
  for(let i=0;i<EXP.length;i++){const{x:px,y:py}=getPlanetPos(i);
    const dx=e.clientX-px,dy=e.clientY-py;if(dx*dx+dy*dy<bd){bd=dx*dx+dy*dy;best=i;}}
  if(!portalAC)initPortalAudio();
  if(best>=0){markVisit(EXP[best].href);location.href=EXP[best].href+'?seed='+cosmicSeed;}});

// Visit counter + time tracking
const _startT=Date.now();addEventListener('beforeunload',()=>{const spent=+(localStorage.getItem('suite_time')||0);localStorage.setItem('suite_time',''+(spent+Math.floor((Date.now()-_startT)/1000)));});
const totalMin=Math.floor(+(localStorage.getItem('suite_time')||0)/60);
const visits=+(localStorage.getItem('suite_visits')||0)+1;localStorage.setItem('suite_visits',''+visits);
document.getElementById('hint').textContent='VISIT #'+visits+(totalMin?' · '+totalMin+' min total':'');

let muted=false;

// === MUSICA UNIVERSALIS — each planet has a frequency ===
let portalAC=null,portalMaster=null,portalDrone=null,portalDroneGain=null;
const planetOscs={};
const SCALE_FREQS=[130.81,146.83,164.81,174.61,196,220,246.94,261.63,293.66,329.63,349.23,392,440,493.88,523.25,587.33,659.25,698.46,783.99,880,987.77,1046.5,1174.66,1318.51,1396.91,1567.98,1760,1975.53];
function initPortalAudio(){
  if(portalAC)return;
  portalAC=new(AudioContext||webkitAudioContext)();
  portalMaster=portalAC.createGain();portalMaster.gain.value=.12;
  // Reverb
  const cv=portalAC.createConvolver(),r=portalAC.sampleRate,l=r*3,buf=portalAC.createBuffer(2,l,r);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,3);}
  cv.buffer=buf;const rvG=portalAC.createGain();rvG.gain.value=.4;
  portalMaster.connect(portalAC.destination);
  portalMaster.connect(cv);cv.connect(rvG);rvG.connect(portalAC.destination);
  // Base drone — low octave hum
  portalDrone=portalAC.createOscillator();portalDroneGain=portalAC.createGain();
  portalDrone.type='sine';portalDrone.frequency.value=65.41; // C2
  portalDroneGain.gain.value=.02;
  portalDrone.connect(portalDroneGain);portalDroneGain.connect(portalMaster);
  portalDrone.start();
  // Create persistent oscillator per planet
  for(let i=0;i<EXP.length;i++){
    const osc=portalAC.createOscillator();
    const gain=portalAC.createGain();
    osc.type=i%3===0?'sine':i%3===1?'triangle':'sine';
    osc.frequency.value=SCALE_FREQS[i%SCALE_FREQS.length];
    gain.gain.value=0;
    osc.connect(gain);gain.connect(portalMaster);
    osc.start();
    planetOscs[i]={osc,gain};
  }
}

// === SEARCH ===
let searchQuery='',searchVisible=false;
const searchEl=document.getElementById('search');
searchEl.addEventListener('input',()=>{searchQuery=searchEl.value.toLowerCase();});
searchEl.addEventListener('keydown',e=>{
  if(e.key==='Escape'){searchVisible=false;searchEl.style.display='none';searchEl.value='';searchQuery='';searchEl.blur();}
  if(e.key==='Enter'){
    // Navigate to first match
    const match=EXP.findIndex(ex=>matchesSearch(ex));
    if(match>=0){markVisit(EXP[match].href);location.href=EXP[match].href+'?seed='+cosmicSeed;}
    e.stopPropagation();
  }
  e.stopPropagation();
});
function matchesSearch(exp){
  if(!searchQuery)return true;
  const q=searchQuery;
  return exp.name.toLowerCase().includes(q)||exp.desc.toLowerCase().includes(q)||exp.tag.toLowerCase().includes(q)||exp.cat.includes(q);
}

addEventListener('keydown',e=>{
  if(e.target===searchEl)return;
  const n=+e.key;if(n>=1&&n<=9)location.href=EXP[n-1].href+'?seed='+cosmicSeed;
  if(e.key==='m'){muted=!muted;if(portalMaster)portalMaster.gain.setTargetAtTime(muted?0:.12,portalAC.currentTime,.1);}
  if(e.key==='f')document.documentElement.requestFullscreen().catch(()=>{});
  if(e.key==='g')viewMode=viewMode==='orbit'?'galaxy':'orbit';
  if(e.key==='/'){e.preventDefault();searchVisible=!searchVisible;searchEl.style.display=searchVisible?'block':'none';if(searchVisible)searchEl.focus();else{searchEl.value='';searchQuery='';}}
});
// === 42 EASTER EGG ===
let keyBuffer='';
addEventListener('keypress',e=>{
  if(e.target===searchEl)return;
  keyBuffer+=e.key;if(keyBuffer.length>5)keyBuffer=keyBuffer.slice(-5);
  if(keyBuffer.includes('42')){
    keyBuffer='';easterEgg42=180; // 3 seconds
  }
});
let easterEgg42=0;
function anim(){requestAnimationFrame(anim);t+=.01;
  X.fillStyle='rgba(5,5,8,.12)';X.fillRect(0,0,W,H);
  const cx=W/2,cy=H/2;
  // BG stars
  for(const s of bgStars){s.p+=.003;X.globalAlpha=.05+Math.sin(s.p)*.03;X.fillStyle='#fff';
    X.beginPath();X.arc(s.x%W,s.y%H,s.s,0,Math.PI*2);X.fill();}
  // Mouse trail
  for(let i=1;i<mTrail.length;i++){const a=i/mTrail.length;X.globalAlpha=a*.06;X.fillStyle='#fff';
    X.beginPath();X.arc(mTrail[i].x,mTrail[i].y,a*2,0,Math.PI*2);X.fill();}
  // Shooting star
  if(Math.random()<.005){const sy2=Math.random()*H*.5,sx2=Math.random()*W;
    X.globalAlpha=.15;X.strokeStyle='#fff';X.lineWidth=1;X.beginPath();
    X.moveTo(sx2,sy2);X.lineTo(sx2+80,sy2+30);X.stroke();
    X.globalAlpha=.03;X.lineTo(sx2+120,sy2+45);X.stroke();}
  // Center sun
  X.globalAlpha=.06;const sg=X.createRadialGradient(cx,cy,0,cx,cy,50);
  sg.addColorStop(0,'rgba(255,255,255,.3)');sg.addColorStop(1,'rgba(0,0,0,0)');
  X.fillStyle=sg;X.beginPath();X.arc(cx,cy,50,0,Math.PI*2);X.fill();
  const pulse=3+Math.sin(t*2)*1.5;
  X.globalAlpha=.5;X.fillStyle='#fff';X.beginPath();X.arc(cx,cy,pulse,0,Math.PI*2);X.fill();
  X.globalAlpha=.02;X.beginPath();X.arc(cx,cy,pulse*8,0,Math.PI*2);X.fill();
  // Orbit rings
  for(const exp of EXP){const r=60+exp.orbit*30;
    X.globalAlpha=.015;X.strokeStyle='#fff';X.lineWidth=.5;
    X.beginPath();X.arc(cx,cy,r,0,Math.PI*2);X.stroke();}
  // Experience planets
  for(let i=0;i<EXP.length;i++){const exp=EXP[i];
    let px,py;
    if(viewMode==='galaxy'){// Galaxy scatter view
      const gx=((i*127.1+37)%1-.5)*W*.7;const gy=((i*311.7+13)%1-.5)*H*.6;
      px=cx+gx+Math.sin(t*.3+i)*5;py=cy+gy+Math.cos(t*.2+i)*5;
    }else{const r=60+exp.orbit*30;const a=t*.2/exp.orbit+i*Math.PI*2/EXP.length;
      px=cx+Math.cos(a)*r;py=cy+Math.sin(a)*r;}
    const catFiltered=filterCat!=='all'&&exp.cat!==filterCat;
    const searchFiltered=searchQuery&&!matchesSearch(exp);
    const filtered=catFiltered||searchFiltered;
    if(filtered){X.globalAlpha=.02;X.fillStyle=exp.color;X.beginPath();X.arc(px,py,3,0,Math.PI*2);X.fill();continue;}
    const isToday=i===new Date().getDay()%EXP.length;
    const isAlive=!!aliveExps[exp.href]; // currently open in another tab
    const isHov=i===hovered;const sz=isHov?12:isAlive?10:isToday?9:7;
    // Alive pulse — breathing glow for open experiences
    if(isAlive){
      const alivePulse=Math.sin(t*6+i)*.5+.5;
      X.globalAlpha=.08+alivePulse*.12;X.fillStyle=exp.color;
      X.beginPath();X.arc(px,py,sz*4+alivePulse*8,0,Math.PI*2);X.fill();
      // Pulse ring
      X.globalAlpha=.1*alivePulse;X.strokeStyle=exp.color;X.lineWidth=1;
      X.beginPath();X.arc(px,py,sz*2+alivePulse*15,0,Math.PI*2);X.stroke();
    }
    // Glow
    X.globalAlpha=isHov?.15:isAlive?.1:.04;X.fillStyle=exp.color;
    X.beginPath();X.arc(px,py,sz*3,0,Math.PI*2);X.fill();
    // Body
    X.globalAlpha=isHov?.9:isAlive?.8:isToday?.7:.5;X.fillStyle=exp.color;
    X.beginPath();X.arc(px,py,sz,0,Math.PI*2);X.fill();
    // Icon
    X.globalAlpha=isHov?.8:.3;X.font=(isHov?16:11)+'px sans-serif';X.textAlign='center';X.textBaseline='middle';
    X.fillText(exp.icon,px,py);
    // Connection to neighbors when hovered
    if(isHov){for(let j=0;j<EXP.length;j++){if(j===i)continue;const e2=EXP[j];
      const r2=60+e2.orbit*30;const a2=t*.2/e2.orbit+j*Math.PI*2/EXP.length;
      const px2=cx+Math.cos(a2)*r2,py2=cy+Math.sin(a2)*r2;
      const d=Math.sqrt((px-px2)**2+(py-py2)**2);if(d<200){
        X.globalAlpha=.04*(1-d/200);X.strokeStyle=exp.color;X.lineWidth=.5;
        X.beginPath();X.moveTo(px,py);X.lineTo(px2,py2);X.stroke();}}}
    // Sparkles on hover
    if(isHov){for(let s=0;s<3;s++){const sa=Math.random()*Math.PI*2;const sd=sz+Math.random()*20;
      X.globalAlpha=Math.random()*.2;X.fillStyle=exp.color;X.beginPath();
      X.arc(px+Math.cos(sa)*sd,py+Math.sin(sa)*sd,1,0,Math.PI*2);X.fill();}}
    // Proximity audio — planets sing when mouse is near
    if(portalAC&&planetOscs[i]&&!muted&&mTrail.length>0){
      const mx=mTrail[mTrail.length-1].x,my=mTrail[mTrail.length-1].y;
      const md=Math.sqrt((px-mx)**2+(py-my)**2);
      if(md<150&&i!==hovered){
        const vol=.008*(1-md/150);
        planetOscs[i].gain.gain.setTargetAtTime(vol,portalAC.currentTime,.1);
      }else if(i!==hovered){
        planetOscs[i].gain.gain.setTargetAtTime(0,portalAC.currentTime,.2);
      }
    }
    // Label — always show (dimmer when not hovered)
    X.globalAlpha=isHov?.5:.12;X.font=(isHov?'10':'7')+'px sans-serif';X.fillStyle='#fff';
    X.fillText(exp.name,px,py+sz+12);}
  // Constellation lines — connect visited experiences
  if(visitedExps.length>1){
    X.strokeStyle='rgba(255,200,100,.06)';X.lineWidth=.5;
    for(let a=0;a<visitedExps.length;a++){
      for(let b=a+1;b<visitedExps.length;b++){
        const pa=getPlanetPos(visitedExps[a]),pb=getPlanetPos(visitedExps[b]);
        const d=Math.sqrt((pa.x-pb.x)**2+(pa.y-pb.y)**2);
        if(d<400){X.globalAlpha=.04*(1-d/400);
          X.beginPath();X.moveTo(pa.x,pa.y);X.lineTo(pb.x,pb.y);X.stroke();}
      }
    }
    // Visited nodes glow brighter
    for(const vi of visitedExps){
      const vp=getPlanetPos(vi);
      X.globalAlpha=.03;X.fillStyle='rgba(255,200,100,1)';
      X.beginPath();X.arc(vp.x,vp.y,15,0,Math.PI*2);X.fill();
    }
  }
  // Epoch indicator
  X.globalAlpha=.06;X.fillStyle='#ffcc88';X.font='8px sans-serif';X.textAlign='center';
  X.fillText('EPOCH: '+getEpoch(),cx,H-24);
  // Achievement counter
  X.globalAlpha=.06;X.fillStyle='#ffcc88';X.font='8px sans-serif';
  X.fillText('\u2605 '+unlockedAch.length+'/'+ACHIEVEMENTS.length+' achievements',cx,H-36);
  // Check achievements periodically
  if(Math.floor(t*100)%100===0)checkAchievements();
  // Achievement notification
  if(achTimer>0&&achNotification){
    achTimer--;
    const fade=achTimer<30?achTimer/30:achTimer>150?(180-achTimer)/30:1;
    X.globalAlpha=fade*.4;X.fillStyle='#ffcc44';X.font='12px sans-serif';
    X.fillText('\u2605 '+achNotification.name,cx,80);
    X.globalAlpha=fade*.2;X.font='9px sans-serif';X.fillStyle='#fff';
    X.fillText(achNotification.desc,cx,96);
  }
  // 42 Easter Egg
  if(easterEgg42>0){
    easterEgg42--;
    const fade=easterEgg42<30?easterEgg42/30:easterEgg42>150?(180-easterEgg42)/30:1;
    X.globalAlpha=fade*.3;X.fillStyle='#ffcc44';X.font='20px sans-serif';X.textAlign='center';
    X.fillText('42',cx,cy);
    X.globalAlpha=fade*.15;X.font='10px sans-serif';X.fillStyle='#fff';
    X.fillText('The Answer to Life, the Universe, and Everything',cx,cy+25);
    X.globalAlpha=fade*.08;X.font='8px sans-serif';
    X.fillText('\u2014 Douglas Adams',cx,cy+40);
  }
  // Universe age — time since first commit
  const BIRTH=new Date('2026-03-26T05:51:46+09:00').getTime();
  const now=new Date();const ageMs=now.getTime()-BIRTH;
  const ageSec=Math.floor(ageMs/1000);
  const ageH=Math.floor(ageSec/3600);const ageM=Math.floor(ageSec%3600/60);const ageS=ageSec%60;
  const pad=n=>(''+n).padStart(2,'0');
  // Bottom bar
  X.globalAlpha=.06;X.fillStyle='#fff';X.font='10px monospace';X.textAlign='center';
  X.fillText(pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds())+' \u00b7 '+EXP.length+' experiences \u00b7 0 dependencies',cx,H-10);
  // Universe age
  X.globalAlpha=.04;X.fillStyle='#ffcc88';X.font='8px sans-serif';
  X.fillText('universe age: '+ageH+'h '+pad(ageM)+'m '+pad(ageS)+'s',cx,H-48);
  X.globalAlpha=1;}
anim();
</script>
