<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Cosmic Suite</title>
  <meta name="description" content="23 cosmic experiences in pure HTML. Explore a universe, compose with stars, draw with gravity, breathe with mandalas. Zero dependencies.">
  <meta property="og:title" content="The Cosmic Suite">
  <meta property="og:description" content="9 cosmic experiences in pure HTML. No frameworks. No dependencies. Just imagination and JavaScript.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://physics91.github.io/cosmic-suite/portal.html">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="The Cosmic Suite">
  <meta name="twitter:description" content="Explore, listen, create, feel, think, watch, play, learn, write — 9 cosmic web experiences.">
  <meta name="theme-color" content="#050508">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000' stroke='%23fff' stroke-width='.5' opacity='.5'/><circle cx='16' cy='16' r='3' fill='%23fff'/></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#050508;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;cursor:default}
    canvas{display:block}
    #label{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);text-align:center;z-index:2;pointer-events:none;transition:opacity .4s;opacity:0}
    #label.show{opacity:1}
    #label h2{color:rgba(255,255,255,.7);font-weight:200;font-size:22px;letter-spacing:5px}
    #label .desc{color:rgba(255,255,255,.3);font-size:11px;margin-top:6px;max-width:400px;line-height:1.7}
    #label .tag{color:rgba(255,255,255,.2);font-size:9px;margin-top:8px;letter-spacing:3px;text-transform:uppercase}
    #title{position:fixed;top:30px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.15);font-size:16px;font-weight:200;letter-spacing:8px;z-index:2;pointer-events:none}
    #hint{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.1);font-size:9px;letter-spacing:2px;z-index:2;pointer-events:none}
    #sub{position:fixed;top:52px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.08);font-size:10px;letter-spacing:3px;z-index:2;pointer-events:none}
  </style>
</head>
<body>
<div id="title">THE COSMIC SUITE</div>
<div id="sub"></div>
<script>const _h=new Date().getHours();document.getElementById('sub').textContent=(_h<6?'the stars await':_h<12?'good morning, creator':_h<18?'the cosmos turns':'welcome to the night sky')+' · 23 EXPERIENCES';</script>
<div id="label"><h2 id="lName"></h2><div class="desc" id="lDesc"></div><div class="tag" id="lTag"></div></div>
<div id="hint">HOVER TO EXPLORE · CLICK TO ENTER · G=galaxy · 1-9=jump</div>
<div style="position:fixed;bottom:50px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3;flex-wrap:wrap;justify-content:center">
  <button onclick="filterCat='all'" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);padding:4px 10px;border-radius:10px;cursor:pointer;font-size:9px">All</button>
  <button onclick="filterCat='create'" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);padding:4px 10px;border-radius:10px;cursor:pointer;font-size:9px">Create</button>
  <button onclick="filterCat='play'" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);padding:4px 10px;border-radius:10px;cursor:pointer;font-size:9px">Play</button>
  <button onclick="filterCat='feel'" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);padding:4px 10px;border-radius:10px;cursor:pointer;font-size:9px">Feel</button>
  <button onclick="filterCat='think'" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);padding:4px 10px;border-radius:10px;cursor:pointer;font-size:9px">Think</button>
  <button onclick="location.href=EXP[Math.random()*EXP.length|0].href" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);padding:4px 10px;border-radius:10px;cursor:pointer;font-size:9px">Random</button>
  <button onclick="document.documentElement.requestFullscreen().catch(()=>{})"
    style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);padding:5px 14px;border-radius:12px;cursor:pointer;font-size:10px;letter-spacing:1px">Fullscreen</button>
  <button onclick="location.href=EXP[new Date().getDay()%EXP.length].href" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);padding:5px 14px;border-radius:12px;cursor:pointer;font-size:10px;letter-spacing:1px">Today's Pick</button>
</div>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight;}
resize();addEventListener('resize',resize);

const EXP=[
  {name:'COSMOS',desc:'Universe simulator · 4672 lines · 84 achievements',tag:'explore',href:'index.html',color:'#6688ff',icon:'🌌',orbit:1,cat:'think'},
  {name:'MUSIC BOX',desc:'Visual sequencer · stars become notes · mic input',tag:'listen',href:'music.html',color:'#ffcc44',icon:'🎵',orbit:2,cat:'create'},
  {name:'GRAVITY CANVAS',desc:'Draw with gravity · force fields · symmetry',tag:'create',href:'art.html',color:'#ff6644',icon:'🎨',orbit:3,cat:'create'},
  {name:'BREATHE',desc:'Guided meditation · 4 patterns · binaural beats',tag:'feel',href:'breathe.html',color:'#44ddaa',icon:'🧘',orbit:4,cat:'feel'},
  {name:'PARTICLE LIFE',desc:'Emergent life · 4 species · 3D mode',tag:'think',href:'life.html',color:'#ff4488',icon:'🧬',orbit:5,cat:'think'},
  {name:'COSMIC CLOCK',desc:'Time spiral · moon phase · season · day arc',tag:'watch',href:'clock.html',color:'#aabbcc',icon:'🕐',orbit:6,cat:'feel'},
  {name:'ORBIT RUNNER',desc:'Survive in orbit · combos · trajectory preview',tag:'play',href:'orbit.html',color:'#44aaff',icon:'🚀',orbit:7,cat:'play'},
  {name:'COSMIC SCALE',desc:'40 orders of magnitude · map view · auto-scroll',tag:'learn',href:'scale.html',color:'#aa77ff',icon:'🔬',orbit:8,cat:'think'},
  {name:'COSMIC TYPE',desc:'Keystrokes = stars · WPM · color themes',tag:'write',href:'type.html',color:'#ff88aa',icon:'✍',orbit:9,cat:'create'},
  {name:'TERRAIN',desc:'5 planet types · fly over procedural worlds',tag:'fly',href:'terrain.html',color:'#88aa44',icon:'🏔',orbit:10,cat:'think'},
  {name:'COSMIC CHAT',desc:'Talk to the universe · it talks back',tag:'converse',href:'chat.html',color:'#88ddff',icon:'💬',orbit:11,cat:'feel'},
  {name:'RHYTHM',desc:'Breathe + Music · your breath composes',tag:'sync',href:'rhythm.html',color:'#ff88aa',icon:'💫',orbit:12,cat:'create'},
  {name:'PUZZLE',desc:'Connect stars · graph puzzle · levels',tag:'solve',href:'puzzle.html',color:'#ffcc44',icon:'🧩',orbit:13,cat:'play'},
  {name:'LIVING WORDS',desc:'Words become creatures · ecosystems of language',tag:'speak',href:'words.html',color:'#ff88cc',icon:'💬',orbit:14,cat:'think'},
  {name:'MEMORY',desc:'Find star pairs · form constellations',tag:'remember',href:'memory.html',color:'#ffcc44',icon:'🧠',orbit:15,cat:'play'},
  {name:'MANDALA',desc:'Sacred geometry · n-fold symmetry drawing',tag:'draw',href:'mandala.html',color:'#cc88ff',icon:'🔮',orbit:16,cat:'create'},
  {name:'RACER',desc:'Pseudo-3D racing · dodge at light speed',tag:'race',href:'racer.html',color:'#44aaff',icon:'🏎',orbit:17,cat:'play'},
  {name:'TAROT',desc:'The cosmos reads your fortune',tag:'divine',href:'tarot.html',color:'#ffcc44',icon:'🔮',orbit:18,cat:'feel'},
  {name:'BEATS',desc:'Rhythm game · hit falling stars · DFJK',tag:'groove',href:'beats.html',color:'#ff44aa',icon:'🎧',orbit:19,cat:'play'},
  {name:'LIVING MANDALA',desc:'Mandala × Life · symmetrical creatures',tag:'grow',href:'living-mandala.html',color:'#ff88cc',icon:'❋',orbit:20,cat:'create'},
  {name:'DICE',desc:'Cast cosmic dice · the universe answers',tag:'fate',href:'dice.html',color:'#ffaa44',icon:'🎲',orbit:21,cat:'feel'},
  {name:'SONIC TERRAIN',desc:'Terrain × Music · landscape becomes melody',tag:'listen+fly',href:'sonic-terrain.html',color:'#ff8844',icon:'🌄',orbit:22,cat:'create'},
  {name:'GRAVITY WELL',desc:'Bend spacetime · light lensing · accretion disks',tag:'warp',href:'gravity-well.html',color:'#6644ff',icon:'🕳',orbit:23,cat:'think'},
];

let hovered=-1,t=0,mTrail=[],viewMode='orbit',filterCat='all';// orbit or galaxy
const bgStars=Array.from({length:200},()=>({x:Math.random()*3e3,y:Math.random()*3e3,s:Math.random()*1.5,p:Math.random()*Math.PI*2}));

// === COSMIC MEMORY — reads traces from all experiences ===
const cosmicMemory={
  breathCycles:+(localStorage.getItem('breathe_cycles')||0),
  orbitBest:+(localStorage.getItem('orbit_best')||0),
  orbitGames:+(localStorage.getItem('orbit_games')||0),
  cosmosStars:+(localStorage.getItem('cosmos_stars')||0),
  typedChars:+(localStorage.getItem('type_chars')||0),
  puzzleLevels:+(localStorage.getItem('puzzle_level')||0),
  racerBest:+(localStorage.getItem('racer_best')||0),
  memoryWins:+(localStorage.getItem('memory_wins')||0),
  beatsBest:+(localStorage.getItem('beats_best')||0),
  totalTime:+(localStorage.getItem('suite_time')||0),
  visits:+(localStorage.getItem('suite_visits')||0),
};
// Universe age = total seconds across all tracked activity
const universeAge=cosmicMemory.totalTime+cosmicMemory.breathCycles*60+cosmicMemory.orbitGames*30;
// "Constellations" formed by visited experiences
const visitedExps=[];
for(let i=0;i<EXP.length;i++){
  const key='visited_'+EXP[i].href.replace('.html','');
  if(localStorage.getItem(key))visitedExps.push(i);
}
// Mark current visit
function markVisit(href){localStorage.setItem('visited_'+href.replace('.html',''),'1');}
// Cosmic epoch name based on total engagement
function getEpoch(){
  const a=universeAge;
  if(a<60)return'THE VOID';if(a<300)return'THE SPARK';if(a<900)return'THE NEBULA';
  if(a<1800)return'THE IGNITION';if(a<3600)return'THE CONSTELLATION';
  if(a<7200)return'THE GALAXY';if(a<14400)return'THE SUPERCLUSTER';
  return'THE OBSERVABLE UNIVERSE';
}

function getPlanetPos(i){const cx=W/2,cy=H/2,exp=EXP[i];
  if(viewMode==='galaxy'){const gx=((i*127.1+37)%1-.5)*W*.7;const gy=((i*311.7+13)%1-.5)*H*.6;
    return{x:cx+gx+Math.sin(t*.3+i)*5,y:cy+gy+Math.cos(t*.2+i)*5};}
  const r=60+exp.orbit*30;const a=t*.2/exp.orbit+i*Math.PI*2/EXP.length;
  return{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r};}

C.addEventListener('mousemove',e=>{mTrail.push({x:e.clientX,y:e.clientY});if(mTrail.length>15)mTrail.shift();
  let best=-1,bd=2500;
  for(let i=0;i<EXP.length;i++){const{x:px,y:py}=getPlanetPos(i);
    const dx=e.clientX-px,dy=e.clientY-py;if(dx*dx+dy*dy<bd){bd=dx*dx+dy*dy;best=i;}}
  if(best!==hovered){
    if(best>=0&&best!==hovered&&!muted){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=300+best*50;o.type='sine';g.gain.setValueAtTime(.02,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.3);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.3);}catch(e){}}
    hovered=best;
    if(best>=0){document.getElementById('lName').textContent=EXP[best].name;
      document.getElementById('lDesc').textContent=EXP[best].desc;
      document.getElementById('lTag').textContent=EXP[best].tag;
      document.getElementById('label').classList.add('show');document.body.style.cursor='pointer';}
    else{document.getElementById('label').classList.remove('show');document.body.style.cursor='default';}}});

// Daily cosmic seed — shared DNA across all experiences
const today=new Date();const cosmicSeed=(today.getFullYear()*10000+today.getMonth()*100+today.getDate());
C.addEventListener('click',e=>{
  let best=-1,bd=2500;
  for(let i=0;i<EXP.length;i++){const{x:px,y:py}=getPlanetPos(i);
    const dx=e.clientX-px,dy=e.clientY-py;if(dx*dx+dy*dy<bd){bd=dx*dx+dy*dy;best=i;}}
  if(best>=0){markVisit(EXP[best].href);location.href=EXP[best].href+'?seed='+cosmicSeed;}});

// Visit counter + time tracking
const _startT=Date.now();addEventListener('beforeunload',()=>{const spent=+(localStorage.getItem('suite_time')||0);localStorage.setItem('suite_time',''+(spent+Math.floor((Date.now()-_startT)/1000)));});
const totalMin=Math.floor(+(localStorage.getItem('suite_time')||0)/60);
const visits=+(localStorage.getItem('suite_visits')||0)+1;localStorage.setItem('suite_visits',''+visits);
document.getElementById('hint').textContent='VISIT #'+visits+(totalMin?' · '+totalMin+' min total':'');

let muted=false;
addEventListener('keydown',e=>{const n=+e.key;if(n>=1&&n<=9)location.href=EXP[n-1].href+'?seed='+cosmicSeed;
  if(e.key==='m')muted=!muted;if(e.key==='f')document.documentElement.requestFullscreen().catch(()=>{});
  if(e.key==='g')viewMode=viewMode==='orbit'?'galaxy':'orbit';});
function anim(){requestAnimationFrame(anim);t+=.01;
  X.fillStyle='rgba(5,5,8,.12)';X.fillRect(0,0,W,H);
  const cx=W/2,cy=H/2;
  // BG stars
  for(const s of bgStars){s.p+=.003;X.globalAlpha=.05+Math.sin(s.p)*.03;X.fillStyle='#fff';
    X.beginPath();X.arc(s.x%W,s.y%H,s.s,0,Math.PI*2);X.fill();}
  // Mouse trail
  for(let i=1;i<mTrail.length;i++){const a=i/mTrail.length;X.globalAlpha=a*.06;X.fillStyle='#fff';
    X.beginPath();X.arc(mTrail[i].x,mTrail[i].y,a*2,0,Math.PI*2);X.fill();}
  // Shooting star
  if(Math.random()<.005){const sy2=Math.random()*H*.5,sx2=Math.random()*W;
    X.globalAlpha=.15;X.strokeStyle='#fff';X.lineWidth=1;X.beginPath();
    X.moveTo(sx2,sy2);X.lineTo(sx2+80,sy2+30);X.stroke();
    X.globalAlpha=.03;X.lineTo(sx2+120,sy2+45);X.stroke();}
  // Center sun
  X.globalAlpha=.06;const sg=X.createRadialGradient(cx,cy,0,cx,cy,50);
  sg.addColorStop(0,'rgba(255,255,255,.3)');sg.addColorStop(1,'rgba(0,0,0,0)');
  X.fillStyle=sg;X.beginPath();X.arc(cx,cy,50,0,Math.PI*2);X.fill();
  const pulse=3+Math.sin(t*2)*1.5;
  X.globalAlpha=.5;X.fillStyle='#fff';X.beginPath();X.arc(cx,cy,pulse,0,Math.PI*2);X.fill();
  X.globalAlpha=.02;X.beginPath();X.arc(cx,cy,pulse*8,0,Math.PI*2);X.fill();
  // Orbit rings
  for(const exp of EXP){const r=60+exp.orbit*30;
    X.globalAlpha=.015;X.strokeStyle='#fff';X.lineWidth=.5;
    X.beginPath();X.arc(cx,cy,r,0,Math.PI*2);X.stroke();}
  // Experience planets
  for(let i=0;i<EXP.length;i++){const exp=EXP[i];
    let px,py;
    if(viewMode==='galaxy'){// Galaxy scatter view
      const gx=((i*127.1+37)%1-.5)*W*.7;const gy=((i*311.7+13)%1-.5)*H*.6;
      px=cx+gx+Math.sin(t*.3+i)*5;py=cy+gy+Math.cos(t*.2+i)*5;
    }else{const r=60+exp.orbit*30;const a=t*.2/exp.orbit+i*Math.PI*2/EXP.length;
      px=cx+Math.cos(a)*r;py=cy+Math.sin(a)*r;}
    const filtered=filterCat!=='all'&&exp.cat!==filterCat;
    if(filtered){X.globalAlpha=.02;X.fillStyle=exp.color;X.beginPath();X.arc(px,py,3,0,Math.PI*2);X.fill();continue;}
    const isToday=i===new Date().getDay()%EXP.length;
    const isHov=i===hovered;const sz=isHov?12:isToday?9:7;
    // Glow
    X.globalAlpha=isHov?.15:.04;X.fillStyle=exp.color;
    X.beginPath();X.arc(px,py,sz*3,0,Math.PI*2);X.fill();
    // Body
    X.globalAlpha=isHov?.9:isToday?.7:.5;X.fillStyle=exp.color;
    X.beginPath();X.arc(px,py,sz,0,Math.PI*2);X.fill();
    // Icon
    X.globalAlpha=isHov?.8:.3;X.font=(isHov?16:11)+'px sans-serif';X.textAlign='center';X.textBaseline='middle';
    X.fillText(exp.icon,px,py);
    // Connection to neighbors when hovered
    if(isHov){for(let j=0;j<EXP.length;j++){if(j===i)continue;const e2=EXP[j];
      const r2=60+e2.orbit*30;const a2=t*.2/e2.orbit+j*Math.PI*2/EXP.length;
      const px2=cx+Math.cos(a2)*r2,py2=cy+Math.sin(a2)*r2;
      const d=Math.sqrt((px-px2)**2+(py-py2)**2);if(d<200){
        X.globalAlpha=.04*(1-d/200);X.strokeStyle=exp.color;X.lineWidth=.5;
        X.beginPath();X.moveTo(px,py);X.lineTo(px2,py2);X.stroke();}}}
    // Sparkles on hover
    if(isHov){for(let s=0;s<3;s++){const sa=Math.random()*Math.PI*2;const sd=sz+Math.random()*20;
      X.globalAlpha=Math.random()*.2;X.fillStyle=exp.color;X.beginPath();
      X.arc(px+Math.cos(sa)*sd,py+Math.sin(sa)*sd,1,0,Math.PI*2);X.fill();}}
    // Label — always show (dimmer when not hovered)
    X.globalAlpha=isHov?.5:.12;X.font=(isHov?'10':'7')+'px sans-serif';X.fillStyle='#fff';
    X.fillText(exp.name,px,py+sz+12);}
  // Constellation lines — connect visited experiences
  if(visitedExps.length>1){
    X.strokeStyle='rgba(255,200,100,.06)';X.lineWidth=.5;
    for(let a=0;a<visitedExps.length;a++){
      for(let b=a+1;b<visitedExps.length;b++){
        const pa=getPlanetPos(visitedExps[a]),pb=getPlanetPos(visitedExps[b]);
        const d=Math.sqrt((pa.x-pb.x)**2+(pa.y-pb.y)**2);
        if(d<400){X.globalAlpha=.04*(1-d/400);
          X.beginPath();X.moveTo(pa.x,pa.y);X.lineTo(pb.x,pb.y);X.stroke();}
      }
    }
    // Visited nodes glow brighter
    for(const vi of visitedExps){
      const vp=getPlanetPos(vi);
      X.globalAlpha=.03;X.fillStyle='rgba(255,200,100,1)';
      X.beginPath();X.arc(vp.x,vp.y,15,0,Math.PI*2);X.fill();
    }
  }
  // Epoch indicator
  X.globalAlpha=.06;X.fillStyle='#ffcc88';X.font='8px sans-serif';X.textAlign='center';
  X.fillText('EPOCH: '+getEpoch(),cx,H-24);
  // Mini clock
  const now=new Date(),pad=n=>(''+n).padStart(2,'0');
  X.globalAlpha=.06;X.fillStyle='#fff';X.font='10px monospace';X.textAlign='center';
  X.fillText(pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds())+' · '+EXP.length+' experiences · 0 dependencies',cx,H-10);
  X.globalAlpha=1;}
anim();
</script>
</body>
</html>
