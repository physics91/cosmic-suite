<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Cosmic Suite</title>
  <meta name="description" content="9 cosmic experiences in pure HTML. Explore a universe, compose with stars, draw with gravity, breathe with mandalas. Zero dependencies.">
  <meta property="og:title" content="The Cosmic Suite">
  <meta property="og:description" content="9 cosmic experiences in pure HTML. No frameworks. No dependencies. Just imagination and JavaScript.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://physics91.github.io/cosmic-suite/portal.html">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="The Cosmic Suite">
  <meta name="twitter:description" content="Explore, listen, create, feel, think, watch, play, learn, write — 9 cosmic web experiences.">
  <meta name="theme-color" content="#050508">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000' stroke='%23fff' stroke-width='.5' opacity='.5'/><circle cx='16' cy='16' r='3' fill='%23fff'/></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#050508;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;cursor:default}
    canvas{display:block}
    #label{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);text-align:center;z-index:2;pointer-events:none;transition:opacity .4s;opacity:0}
    #label.show{opacity:1}
    #label h2{color:rgba(255,255,255,.7);font-weight:200;font-size:22px;letter-spacing:5px}
    #label .desc{color:rgba(255,255,255,.3);font-size:11px;margin-top:6px;max-width:400px;line-height:1.7}
    #label .tag{color:rgba(255,255,255,.2);font-size:9px;margin-top:8px;letter-spacing:3px;text-transform:uppercase}
    #title{position:fixed;top:30px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.15);font-size:16px;font-weight:200;letter-spacing:8px;z-index:2;pointer-events:none}
    #hint{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.1);font-size:9px;letter-spacing:2px;z-index:2;pointer-events:none}
    #sub{position:fixed;top:52px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.08);font-size:10px;letter-spacing:3px;z-index:2;pointer-events:none}
  </style>
</head>
<body>
<div id="title">THE COSMIC SUITE</div>
<div id="sub">9 EXPERIENCES · 0 DEPENDENCIES</div>
<div id="label"><h2 id="lName"></h2><div class="desc" id="lDesc"></div><div class="tag" id="lTag"></div></div>
<div id="hint">HOVER TO EXPLORE · CLICK TO ENTER</div>
<div style="position:fixed;bottom:50px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3">
  <button onclick="location.href=EXP[Math.random()*EXP.length|0].href" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);padding:5px 14px;border-radius:12px;cursor:pointer;font-size:10px;letter-spacing:1px">Random</button>
  <button onclick="location.href=EXP[new Date().getDay()%EXP.length].href" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);padding:5px 14px;border-radius:12px;cursor:pointer;font-size:10px;letter-spacing:1px">Today's Pick</button>
</div>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight;}
resize();addEventListener('resize',resize);

const EXP=[
  {name:'COSMOS',desc:'A complete universe simulator. Physics, astronomy, biology, civilization, consciousness.',tag:'explore',href:'index.html',color:'#6688ff',icon:'🌌',orbit:1},
  {name:'MUSIC BOX',desc:'Place stars on a grid. They become notes. A visual sequencer.',tag:'listen',href:'music.html',color:'#ffcc44',icon:'🎵',orbit:2},
  {name:'GRAVITY CANVAS',desc:'Draw with gravity. Place wells, watch particles flow.',tag:'create',href:'art.html',color:'#ff6644',icon:'🎨',orbit:3},
  {name:'BREATHE',desc:'Cosmic meditation. Sync your breath with the mandala.',tag:'feel',href:'breathe.html',color:'#44ddaa',icon:'🧘',orbit:4},
  {name:'PARTICLE LIFE',desc:'Color-coded particles attract and repel. Life emerges from rules.',tag:'think',href:'life.html',color:'#ff4488',icon:'🧬',orbit:5},
  {name:'COSMIC CLOCK',desc:'Time rendered as orbiting light. A clock for stargazers.',tag:'watch',href:'clock.html',color:'#aabbcc',icon:'🕐',orbit:6},
  {name:'ORBIT RUNNER',desc:'One button. Stay in orbit. Don\'t crash. Don\'t drift.',tag:'play',href:'orbit.html',color:'#44aaff',icon:'🚀',orbit:7},
  {name:'COSMIC SCALE',desc:'Scroll from quarks to the observable universe. 40 orders of magnitude.',tag:'learn',href:'scale.html',color:'#aa77ff',icon:'🔬',orbit:8},
  {name:'COSMIC TYPE',desc:'Every keystroke creates a star. Words become constellations.',tag:'write',href:'type.html',color:'#ff88aa',icon:'✍',orbit:9},
];

let hovered=-1,t=0;
const bgStars=Array.from({length:200},()=>({x:Math.random()*3e3,y:Math.random()*3e3,s:Math.random()*1.5,p:Math.random()*Math.PI*2}));

C.addEventListener('mousemove',e=>{
  const cx=W/2,cy=H/2;let best=-1,bd=2500;
  for(let i=0;i<EXP.length;i++){const exp=EXP[i];
    const r=60+exp.orbit*30;const a=t*.2/exp.orbit+i*Math.PI*2/EXP.length;
    const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
    const dx=e.clientX-px,dy=e.clientY-py;if(dx*dx+dy*dy<bd){bd=dx*dx+dy*dy;best=i;}}
  if(best!==hovered){hovered=best;
    if(best>=0){document.getElementById('lName').textContent=EXP[best].name;
      document.getElementById('lDesc').textContent=EXP[best].desc;
      document.getElementById('lTag').textContent=EXP[best].tag;
      document.getElementById('label').classList.add('show');document.body.style.cursor='pointer';}
    else{document.getElementById('label').classList.remove('show');document.body.style.cursor='default';}}});

// Daily cosmic seed — shared DNA across all experiences
const today=new Date();const cosmicSeed=(today.getFullYear()*10000+today.getMonth()*100+today.getDate());
C.addEventListener('click',e=>{
  // Find nearest planet on click (works for mobile too)
  const cx=W/2,cy=H/2;let best=-1,bd=2500;
  for(let i=0;i<EXP.length;i++){const exp=EXP[i];
    const r=60+exp.orbit*30;const a=t*.2/exp.orbit+i*Math.PI*2/EXP.length;
    const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
    const dx=e.clientX-px,dy=e.clientY-py;if(dx*dx+dy*dy<bd){bd=dx*dx+dy*dy;best=i;}}
  if(best>=0)location.href=EXP[best].href+'?seed='+cosmicSeed;});

function anim(){requestAnimationFrame(anim);t+=.01;
  X.fillStyle='rgba(5,5,8,.12)';X.fillRect(0,0,W,H);
  const cx=W/2,cy=H/2;
  // BG stars
  for(const s of bgStars){s.p+=.003;X.globalAlpha=.05+Math.sin(s.p)*.03;X.fillStyle='#fff';
    X.beginPath();X.arc(s.x%W,s.y%H,s.s,0,Math.PI*2);X.fill();}
  // Center sun
  X.globalAlpha=.06;const sg=X.createRadialGradient(cx,cy,0,cx,cy,50);
  sg.addColorStop(0,'rgba(255,255,255,.3)');sg.addColorStop(1,'rgba(0,0,0,0)');
  X.fillStyle=sg;X.beginPath();X.arc(cx,cy,50,0,Math.PI*2);X.fill();
  X.globalAlpha=.5;X.fillStyle='#fff';X.beginPath();X.arc(cx,cy,4,0,Math.PI*2);X.fill();
  // Orbit rings
  for(const exp of EXP){const r=60+exp.orbit*30;
    X.globalAlpha=.015;X.strokeStyle='#fff';X.lineWidth=.5;
    X.beginPath();X.arc(cx,cy,r,0,Math.PI*2);X.stroke();}
  // Experience planets
  for(let i=0;i<EXP.length;i++){const exp=EXP[i];
    const r=60+exp.orbit*30;const a=t*.2/exp.orbit+i*Math.PI*2/EXP.length;
    const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
    const isHov=i===hovered;const sz=isHov?12:7;
    // Glow
    X.globalAlpha=isHov?.15:.04;X.fillStyle=exp.color;
    X.beginPath();X.arc(px,py,sz*3,0,Math.PI*2);X.fill();
    // Body
    X.globalAlpha=isHov?.9:.5;X.fillStyle=exp.color;
    X.beginPath();X.arc(px,py,sz,0,Math.PI*2);X.fill();
    // Icon
    X.globalAlpha=isHov?.8:.3;X.font=(isHov?16:11)+'px sans-serif';X.textAlign='center';X.textBaseline='middle';
    X.fillText(exp.icon,px,py);
    // Sparkles on hover
    if(isHov){for(let s=0;s<3;s++){const sa=Math.random()*Math.PI*2;const sd=sz+Math.random()*20;
      X.globalAlpha=Math.random()*.2;X.fillStyle=exp.color;X.beginPath();
      X.arc(px+Math.cos(sa)*sd,py+Math.sin(sa)*sd,1,0,Math.PI*2);X.fill();}}
    // Label — always show (dimmer when not hovered)
    X.globalAlpha=isHov?.5:.12;X.font=(isHov?'10':'7')+'px sans-serif';X.fillStyle='#fff';
    X.fillText(exp.name,px,py+sz+12);}
  X.globalAlpha=1;}
anim();
</script>
</body>
</html>
