<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interference</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000'/><circle cx='12' cy='16' r='6' fill='none' stroke='%2344aaff' stroke-width='.5' opacity='.4'/><circle cx='20' cy='16' r='6' fill='none' stroke='%2344aaff' stroke-width='.5' opacity='.4'/></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#020210;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;cursor:crosshair}
    canvas{display:block}
    #info{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.15);font-size:9px;letter-spacing:3px;z-index:2;pointer-events:none;text-align:center}
    #stats{position:fixed;bottom:16px;left:16px;color:rgba(255,255,255,.1);font-size:8px;z-index:2;pointer-events:none;font-family:monospace}
    .btn{position:fixed;z-index:20;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.3);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:9px;letter-spacing:1px}
    .btn:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
    .btn.active{background:rgba(68,170,255,.1);border-color:rgba(68,170,255,.3)}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">CLICK TO CREATE WAVE SOURCES &middot; DRAG FOR WALLS &middot; WATCH INTERFERENCE</div>
<div id="stats"></div>
<button class="btn" style="bottom:16px;right:16px" onclick="clearAll()">Clear</button>
<button class="btn" style="bottom:16px;right:70px" onclick="presetDouble()">Double Slit</button>
<button class="btn" style="bottom:16px;right:155px" onclick="presetTriple()">Triple</button>
<button class="btn" style="bottom:16px;right:215px" onclick="presetCircle()">Circle</button>
<button class="btn active" style="bottom:40px;right:16px" id="btnColor" onclick="cycleColor()">Color: <span id="colorName">Ocean</span></button>
<button class="btn" style="bottom:40px;right:140px" id="btnWall" onclick="wallMode=!wallMode;this.classList.toggle('active')">Wall Mode</button>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a><a id="random-jump" href="#" onclick="const e=['art.html','attractor.html','automata.html','beats.html','breathe.html','cellular-music.html','chat.html','clock.html','conway.html','dice.html','entropy.html','fourier.html','gravity-beats.html','gravity-well.html','harmonograph.html','index.html','interference.html','life.html','living-mandala.html','mandala.html','memory.html','music.html','neural.html','oracle.html','orbit.html','pendulum.html','puzzle.html','racer.html','reaction.html','rhythm.html','sandbox.html','scale.html','sonic-terrain.html','tarot.html','terrain.html','topology.html','type.html','words.html'];location.href=e[Math.random()*e.length|0];return false" style="position:fixed;top:12px;right:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">random &rarr;</a>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H,field,fieldPrev,fieldVel;
const RES=3; // pixel resolution
let cols,rows;

// === WASM STATE ===
let wasm=null;    // WASM instance (null = JS fallback)
let wasmMem=null; // WASM memory object
let useWasm=false;
// WASM source index tracking: maps our sources array index to WASM source index
let wasmSourceIndices=[];

function resize(){
  W=C.width=innerWidth;H=C.height=innerHeight;
  const newCols=Math.ceil(W/RES),newRows=Math.ceil(H/RES);
  if(newCols===cols&&newRows===rows)return;
  cols=newCols;rows=newRows;
  if(useWasm){
    // Re-init WASM grid
    wasm.wave_init(cols,rows,DAMPING);
    // Re-add sources
    wasmSourceIndices=[];
    for(const s of sources){
      const cx=Math.floor(s.x/RES),cy=Math.floor(s.y/RES);
      wasmSourceIndices.push(wasm.wave_add_source(cx,cy,s.freq,s.amplitude*.5));
    }
    // Re-add walls
    for(const idx of walls){
      const wx=idx%cols,wy=(idx/cols)|0;
      if(wx<cols&&wy<rows)wasm.wave_set_wall(wx,wy,1);
    }
    // Create views into WASM memory
    rebuildWasmViews();
  }else{
    // JS fallback
    field=new Float32Array(cols*rows);
    fieldPrev=new Float32Array(cols*rows);
    fieldVel=new Float32Array(cols*rows);
  }
}

function rebuildWasmViews(){
  if(!useWasm)return;
  const ptr=wasm.wave_get_field_ptr();
  const wallPtr=wasm.wave_get_walls_ptr();
  const len=cols*rows;
  field=new Float32Array(wasmMem.buffer,ptr,len);
  wasmWalls=new Uint8Array(wasmMem.buffer,wallPtr,len);
}

let wasmWalls=null; // Uint8Array view into WASM wall mask

// === WAVE SOURCES ===
const sources=[];
const walls=new Set(); // wall cells block propagation

class WaveSource{
  constructor(x,y,freq){
    this.x=x;this.y=y;
    this.freq=freq||.15;
    this.phase=0;
    this.amplitude=1;
  }
}

// === COLOR SCHEMES ===
const COLORS=[
  {name:'Ocean',pos:'#0066ff',neg:'#002244',bg:[2,2,16]},
  {name:'Fire',pos:'#ff4400',neg:'#440000',bg:[10,2,2]},
  {name:'Neon',pos:'#00ffaa',neg:'#003322',bg:[2,8,6]},
  {name:'Mono',pos:'#ffffff',neg:'#222222',bg:[4,4,4]},
  {name:'Plasma',pos:'#ff44ff',neg:'#220022',bg:[6,2,8]},
];
let colorIdx=0;
function cycleColor(){colorIdx=(colorIdx+1)%COLORS.length;document.getElementById('colorName').textContent=COLORS[colorIdx].name;}

// === INPUT ===
let wallMode=false,drawing=false;
C.addEventListener('mousedown',e=>{
  if(wallMode){drawing=true;addWall(e.clientX,e.clientY);return;}
  addSource(e.clientX,e.clientY);
});
C.addEventListener('mousemove',e=>{if(drawing&&wallMode)addWall(e.clientX,e.clientY);});
addEventListener('mouseup',()=>{drawing=false;});
// Touch
C.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];
  if(wallMode){drawing=true;addWall(t.clientX,t.clientY);return;}
  addSource(t.clientX,t.clientY);
},{passive:false});
C.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(drawing&&wallMode)addWall(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});
C.addEventListener('touchend',()=>{drawing=false;});

function addSource(px,py){
  const freq=.1+Math.random()*.1;
  const s=new WaveSource(px,py,freq);
  sources.push(s);
  if(useWasm){
    const cx=Math.floor(px/RES),cy=Math.floor(py/RES);
    wasmSourceIndices.push(wasm.wave_add_source(cx,cy,s.freq,s.amplitude*.5));
  }
  // Sound
  try{
    if(!aC)aC=new(AudioContext||webkitAudioContext)();
    const t=aC.currentTime;
    const o=aC.createOscillator(),g=aC.createGain();
    o.type='sine';o.frequency.value=300+sources.length*80;
    g.gain.setValueAtTime(.02,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);
    o.connect(g);g.connect(aC.destination);o.start(t);o.stop(t+.3);
  }catch(e){}
}

function addWall(mx,my){
  const cx=Math.floor(mx/RES),cy=Math.floor(my/RES);
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
    const wx=cx+dx,wy=cy+dy;
    if(wx>=0&&wx<cols&&wy>=0&&wy<rows){
      const idx=wy*cols+wx;
      walls.add(idx);
      if(useWasm)wasm.wave_set_wall(wx,wy,1);
    }
  }
}

addEventListener('keydown',e=>{
  if(e.key==='f')document.documentElement.requestFullscreen().catch(()=>{});
  if(e.key==='c')clearAll();
  if(e.key==='w'){wallMode=!wallMode;document.getElementById('btnWall').classList.toggle('active');}
});

let aC=null;

function clearAll(){
  sources.length=0;
  walls.clear();
  wasmSourceIndices=[];
  if(useWasm){
    wasm.wave_clear();
    rebuildWasmViews();
  }else{
    field.fill(0);fieldPrev.fill(0);fieldVel.fill(0);
  }
}

function presetDouble(){
  clearAll();
  addSource(W*.15,H*.5);
  // Override freq for consistency
  sources[sources.length-1].freq=.12;
  if(useWasm){
    // Remove and re-add with correct freq
    wasm.wave_clear();
    wasmSourceIndices=[];
    const s=sources[0];
    const cx=Math.floor(s.x/RES),cy=Math.floor(s.y/RES);
    wasmSourceIndices.push(wasm.wave_add_source(cx,cy,.12,s.amplitude*.5));
  }
  // Two slits as gaps in a wall
  const wallX=Math.floor(W*.4/RES);
  for(let y=0;y<rows;y++){
    const gy=y*RES;
    const gap1=Math.abs(gy-H*.35)<20;
    const gap2=Math.abs(gy-H*.65)<20;
    if(!gap1&&!gap2){
      walls.add(y*cols+wallX);
      if(useWasm)wasm.wave_set_wall(wallX,y,1);
    }
  }
}
function presetTriple(){
  clearAll();
  const cx=W/2,cy=H/2,r=150;
  for(let i=0;i<3;i++){
    const a=Math.PI*2*i/3-Math.PI/2;
    addSource(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
    sources[sources.length-1].freq=.12;
  }
  if(useWasm){
    // Re-sync sources with correct freq
    wasm.wave_clear();
    wasmSourceIndices=[];
    for(const s of sources){
      const sx=Math.floor(s.x/RES),sy=Math.floor(s.y/RES);
      wasmSourceIndices.push(wasm.wave_add_source(sx,sy,.12,s.amplitude*.5));
    }
  }
}
function presetCircle(){
  clearAll();
  const cx=W/2,cy=H/2,r=200;
  for(let i=0;i<8;i++){
    const a=Math.PI*2*i/8;
    addSource(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
    sources[sources.length-1].freq=.12;
  }
  if(useWasm){
    wasm.wave_clear();
    wasmSourceIndices=[];
    for(const s of sources){
      const sx=Math.floor(s.x/RES),sy=Math.floor(s.y/RES);
      wasmSourceIndices.push(wasm.wave_add_source(sx,sy,.12,s.amplitude*.5));
    }
  }
}

// === WAVE SIMULATION ===
const DAMPING=.997;
const SPEED=.45;
let time=0;

// JS fallback simulation (original wave equation code)
function simulateJS(){
  time++;
  // Inject from sources
  for(const s of sources){
    s.phase+=s.freq;
    const cx=Math.floor(s.x/RES),cy=Math.floor(s.y/RES);
    if(cx>=0&&cx<cols&&cy>=0&&cy<rows){
      const idx=cy*cols+cx;
      field[idx]+=Math.sin(s.phase)*s.amplitude*.5;
    }
  }
  // Wave propagation (2D wave equation via finite differences)
  const next=new Float32Array(cols*rows);
  for(let y=1;y<rows-1;y++){
    for(let x=1;x<cols-1;x++){
      const idx=y*cols+x;
      if(walls.has(idx)){next[idx]=0;continue;}
      const laplacian=
        (walls.has(idx-1)?0:field[idx-1])+
        (walls.has(idx+1)?0:field[idx+1])+
        (walls.has(idx-cols)?0:field[idx-cols])+
        (walls.has(idx+cols)?0:field[idx+cols])-4*field[idx];
      next[idx]=(2*field[idx]-fieldPrev[idx]+SPEED*SPEED*laplacian)*DAMPING;
    }
  }
  fieldPrev.set(field);
  field.set(next);
}

// WASM simulation: just call wave_step, then refresh views
function simulateWASM(steps){
  wasm.wave_step(steps);
  // Refresh views in case WASM reallocated memory (triple-buffer rotation)
  const ptr=wasm.wave_get_field_ptr();
  const len=cols*rows;
  field=new Float32Array(wasmMem.buffer,ptr,len);
}

// === RENDER ===
let imgData=null;
const offC=document.createElement('canvas');
const offX=offC.getContext('2d');

function isWall(i){
  if(useWasm)return wasmWalls[i]!==0;
  return walls.has(i);
}

function anim(){
  requestAnimationFrame(anim);

  if(useWasm){
    simulateWASM(2); // 2 steps per frame for speed
  }else{
    simulateJS();simulateJS();
  }

  if(!imgData||imgData.width!==cols||imgData.height!==rows)
    imgData=new ImageData(cols,rows);
  const d=imgData.data;
  const scheme=COLORS[colorIdx];
  const bg=scheme.bg;

  for(let i=0;i<cols*rows;i++){
    const v=field[i];
    const pi=i*4;
    if(isWall(i)){d[pi]=40;d[pi+1]=40;d[pi+2]=60;d[pi+3]=255;continue;}
    const intensity=Math.min(1,Math.abs(v)*3);
    let r,g,b;
    if(v>0){
      r=parseInt(scheme.pos.slice(1,3),16);
      g=parseInt(scheme.pos.slice(3,5),16);
      b=parseInt(scheme.pos.slice(5,7),16);
    }else{
      r=parseInt(scheme.neg.slice(1,3),16);
      g=parseInt(scheme.neg.slice(3,5),16);
      b=parseInt(scheme.neg.slice(5,7),16);
    }
    d[pi]=bg[0]+intensity*r|0;d[pi+1]=bg[1]+intensity*g|0;d[pi+2]=bg[2]+intensity*b|0;d[pi+3]=255;
  }

  offC.width=cols;offC.height=rows;
  offX.putImageData(imgData,0,0);
  X.imageSmoothingEnabled=true;
  X.drawImage(offC,0,0,cols,rows,0,0,W,H);

  // Source markers
  for(const s of sources){
    // Update phase for rendering even in WASM mode (marker animation)
    if(useWasm)s.phase+=s.freq;
    X.globalAlpha=.2+Math.sin(s.phase)*.1;
    X.fillStyle=scheme.pos;
    X.beginPath();X.arc(s.x,s.y,4,0,Math.PI*2);X.fill();
    X.globalAlpha=.05;
    X.beginPath();X.arc(s.x,s.y,12,0,Math.PI*2);X.fill();
  }
  X.globalAlpha=1;

  const engine=useWasm?'WASM':'JS';
  document.getElementById('stats').textContent=
    'engine: '+engine+'\nsources: '+sources.length+'\nwalls: '+walls.size+'\nresolution: '+cols+'x'+rows;
}

// === WASM LOADER ===
async function initWasm(){
  try{
    const resp=await WebAssembly.instantiateStreaming(
      fetch('./physics.wasm'),
      {env:{abort:()=>{}}}
    );
    wasm=resp.instance.exports;
    wasmMem=wasm.memory;
    useWasm=true;
    // Init WASM grid
    wasm.wave_init(cols,rows,DAMPING);
    rebuildWasmViews();
    console.log('[interference] WASM engine loaded');
  }catch(e){
    console.warn('[interference] WASM load failed, using JS fallback:',e);
    useWasm=false;
    wasm=null;
  }
}

// === BOOTSTRAP ===
resize();
addEventListener('resize',resize);

initWasm().then(()=>{
  anim();
});
</script>
<script>try{const _pc=new BroadcastChannel("cosmic-pulse");const _pn="interference.html";setInterval(()=>_pc.postMessage({type:"pulse",href:_pn}),1000);}catch(e){}</script>
</body>
</html>
