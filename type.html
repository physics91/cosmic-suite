<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Type</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000'/><text x='16' y='20' text-anchor='middle' fill='%23fff' font-size='14' opacity='.5'>A</text></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#050508;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
    canvas{display:block;position:fixed;top:0;left:0}
    #text{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);width:80%;max-width:600px;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.06);color:rgba(255,255,255,.7);font-size:18px;font-weight:200;letter-spacing:2px;padding:12px 0;text-align:center;outline:none;z-index:3;font-family:'Segoe UI',system-ui,sans-serif}
    #text::placeholder{color:rgba(255,255,255,.15)}
    #info{position:fixed;top:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.15);font-size:10px;letter-spacing:2px;z-index:3;pointer-events:none}
    #stats{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.1);font-size:9px;letter-spacing:1px;z-index:3;pointer-events:none}
    #title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.025);font-size:50px;font-weight:100;letter-spacing:10px;pointer-events:none}
  </style>
</head>
<body>
<div id="title">TYPE</div>
<div id="info">EVERY KEYSTROKE CREATES A STAR</div>
<input id="text" type="text" placeholder="start typing..." autofocus>
<div id="stats"></div>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight;}
resize();addEventListener('resize',resize);

let stars=[],totalKeys=0,totalWords=0;
const hueBase=Math.random()*360;

// Audio
let aC=null,gain=null;
function initAudio(){aC=new(AudioContext||webkitAudioContext)();gain=aC.createGain();gain.gain.value=.04;gain.connect(aC.destination);}

function playNote(char){
  if(!aC)initAudio();
  const code=char.charCodeAt(0);
  const scale=[0,2,4,5,7,9,11];// major scale
  const note=60+scale[code%scale.length]+Math.floor(code/scale.length)%3*12;
  const freq=440*Math.pow(2,(note-69)/12);
  const o=aC.createOscillator(),g=aC.createGain();
  o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(.03,aC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,aC.currentTime+.8);
  o.connect(g);g.connect(gain);o.start();o.stop(aC.currentTime+.8);}

function spawnStar(char){
  const angle=Math.random()*Math.PI*2;
  const dist=100+Math.random()*Math.min(W,H)*.35;
  const x=W/2+Math.cos(angle)*dist;
  const y=H/2+Math.sin(angle)*dist;
  const hue=(hueBase+totalKeys*7)%360;
  stars.push({x,y,char,hue,sz:2+Math.random()*3,life:600+Math.random()*400,
    vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,
    born:performance.now(),glow:1,phase:Math.random()*Math.PI*2});
  totalKeys++;playNote(char);}

function spawnWord(word){
  // Create a constellation from the word
  const cx=W*.2+Math.random()*W*.6;const cy=H*.15+Math.random()*H*.5;
  const spacing=20+Math.random()*10;
  for(let i=0;i<word.length;i++){
    const x=cx+(i-word.length/2)*spacing+(Math.random()-.5)*8;
    const y=cy+(Math.random()-.5)*15;
    const hue=(hueBase+totalWords*30)%360;
    stars.push({x,y,char:word[i],hue,sz:2+Math.random()*2,life:800+Math.random()*400,
      vx:(Math.random()-.5)*.1,vy:(Math.random()-.5)*.1,
      born:performance.now(),glow:1,wordStar:true,phase:Math.random()*Math.PI*2});}
  totalWords++;}

// Input
const input=document.getElementById('text');
let lastLength=0;
input.addEventListener('input',()=>{
  const val=input.value;
  if(val.length>lastLength){// New character typed
    const char=val[val.length-1];
    if(char===' '){// Word complete
      const words=val.trim().split(/\s+/);
      const lastWord=words[words.length-1];
      if(lastWord)spawnWord(lastWord);}
    else{spawnStar(char);}}
  lastLength=val.length;});

input.addEventListener('keydown',e=>{
  if(e.key==='Enter'){// Submit line — burst all remaining characters
    const val=input.value.trim();
    if(val){const words=val.split(/\s+/);
      for(const w of words)if(w)spawnWord(w);
      input.value='';lastLength=0;}
    e.preventDefault();}});

// Background
const bg=Array.from({length:100},()=>({x:Math.random()*3e3,y:Math.random()*3e3,s:Math.random(),p:Math.random()*Math.PI*2}));

function anim(){requestAnimationFrame(anim);
  X.fillStyle='rgba(5,5,8,.06)';X.fillRect(0,0,W,H);
  // BG
  for(const s of bg){s.p+=.005;X.globalAlpha=.04+Math.sin(s.p)*.03;X.fillStyle='#fff';
    X.beginPath();X.arc(s.x%W,s.y%H,s.s,0,Math.PI*2);X.fill();}
  // Stars
  for(let i=stars.length-1;i>=0;i--){const s=stars[i];
    s.life--;s.glow*=.97;s.x+=s.vx;s.y+=s.vy;s.phase+=.02;
    if(s.life<=0){stars.splice(i,1);continue;}
    const alpha=Math.min(1,s.life/100)*Math.min(1,(800-s.life+s.life)/100);
    // Glow
    X.globalAlpha=alpha*.06+s.glow*.1;X.fillStyle=`hsl(${s.hue},50%,60%)`;
    X.beginPath();X.arc(s.x,s.y,s.sz*4,0,Math.PI*2);X.fill();
    // Core
    X.globalAlpha=alpha*(.4+Math.sin(s.phase)*.15);X.fillStyle='#fff';
    X.beginPath();X.arc(s.x,s.y,s.sz,0,Math.PI*2);X.fill();
    // Letter (faint)
    if(s.char&&s.glow>.1){X.globalAlpha=alpha*s.glow*.4;X.fillStyle=`hsl(${s.hue},40%,70%)`;
      X.font=(s.sz*3)+'px sans-serif';X.textAlign='center';X.textBaseline='middle';
      X.fillText(s.char,s.x,s.y+s.sz*5);}}
  // Constellation lines between word stars
  X.strokeStyle='rgba(255,255,255,.02)';X.lineWidth=.5;
  const wordStars=stars.filter(s=>s.wordStar);
  for(let i=1;i<wordStars.length;i++){
    const a=wordStars[i-1],b=wordStars[i];
    const dx=a.x-b.x,dy=a.y-b.y;if(dx*dx+dy*dy>10000)continue;
    X.globalAlpha=.03;X.beginPath();X.moveTo(a.x,a.y);X.lineTo(b.x,b.y);X.stroke();}
  X.globalAlpha=1;
  document.getElementById('stats').textContent=totalKeys+' keys · '+totalWords+' words · '+stars.length+' stars';}
anim();
input.focus();
</script>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a>
</body>
</html>
