<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About The Cosmic Suite</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000' stroke='%23fff' stroke-width='.5' opacity='.5'/><circle cx='16' cy='16' r='3' fill='%23fff' opacity='.5'/></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#030308;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
    canvas{display:block}
    #title{position:fixed;top:30px;left:50%;transform:translateX(-50%);text-align:center;z-index:2;pointer-events:none}
    #title h1{color:rgba(255,255,255,.2);font-weight:100;font-size:18px;letter-spacing:8px}
    #title p{color:rgba(255,255,255,.08);font-size:10px;letter-spacing:3px;margin-top:8px}
    #quote{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.1);font-size:11px;font-style:italic;letter-spacing:1px;z-index:2;pointer-events:none}
    #stats-display{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.06);font-size:8px;letter-spacing:2px;z-index:2;pointer-events:none;text-align:center}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">
  <h1>THE COSMIC SUITE</h1>
  <p id="sub"></p>
</div>
<div id="quote">"From nothing, everything."</div>
<div id="stats-display"></div>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight;}
resize();addEventListener('resize',resize);

// All experiences as nodes
const EXPS=[
  'Cosmos','Music Box','Gravity Canvas','Breathe','Particle Life','Clock','Orbit Runner',
  'Scale','Type','Terrain','Chat','Rhythm','Puzzle','Living Words','Memory','Mandala',
  'Racer','Tarot','Beats','Living Mandala','Dice','Sonic Terrain','Gravity Well','Fourier',
  'Gravity Beats','Entropy','Interference','Oracle','Conway','Topology','Reaction',
  'Pendulum','Attractor','Neural','Automata','Cellular Music','Sandbox','Flocking',
  'Swarm Gravity','Fractal','Sorting','Order','Pi Walk','Chaos Map','Spirograph',
  'Orbits','Gravity Life','Quine','Maze','About'
];
const CATS={
  think:[0,4,7,9,13,22,26,28,29,30,31,32,33,34,39,42,43,45,46,47],
  create:[1,2,8,11,15,19,21,23,35,44],
  play:[6,12,14,16,18,24,36,48],
  feel:[3,5,10,17,20,25,27,41],
};
const CAT_COLORS={think:'#4488ff',create:'#ff8844',play:'#44ff88',feel:'#cc88ff'};

function getCat(i){for(const[k,v]of Object.entries(CATS))if(v.includes(i))return k;return'think';}

// Nodes positioned in constellation
const nodes=EXPS.map((name,i)=>{
  const cat=getCat(i);
  const catIdx=CATS[cat].indexOf(i);
  const catSize=CATS[cat].length;
  // Cluster by category
  const catAngle={think:0,create:Math.PI/2,play:Math.PI,feel:Math.PI*1.5}[cat];
  const spread=Math.min(W,H)*.3;
  const angle=catAngle+(catIdx/catSize-.5)*1.2;
  const r=spread*(.4+catIdx/catSize*.4);
  return{
    name,cat,
    x:W/2+Math.cos(angle)*r+(Math.random()-.5)*30,
    y:H/2+Math.sin(angle)*r+(Math.random()-.5)*30,
    vx:0,vy:0,
    hue:i/EXPS.length*360,
    pulse:Math.random()*Math.PI*2,
  };
});

// Connections — related experiences
const connections=[];
for(let i=0;i<nodes.length;i++){
  for(let j=i+1;j<nodes.length;j++){
    if(getCat(i)===getCat(j)&&Math.random()<.15)connections.push([i,j]);
    // Name similarity
    const shared=nodes[i].name.split('').filter(c=>nodes[j].name.includes(c)).length;
    if(shared>3&&Math.random()<.3)connections.push([i,j]);
  }
}

// Quotes cycle
const QUOTES=[
  '"From nothing, everything."',
  '"The universe learned that order costs effort, chaos is free."',
  '"z\u00b2 + c \u2014 two characters contain infinity."',
  '"A program that observes itself is the beginning of consciousness."',
  '"Every maze has exactly one path."',
  '"50 experiences. 15,000 lines. Zero dependencies."',
  '"The boundary between order and chaos is fractal."',
  '"If this is true, we don\'t need anything else."',
];
let quoteIdx=0,quoteTimer=0;

let time=0;
const sub=document.getElementById('sub');
sub.textContent=EXPS.length+' experiences \u00b7 15,000+ lines \u00b7 0 dependencies';

function anim(){requestAnimationFrame(anim);time+=.016;
  X.fillStyle='rgba(3,3,8,.06)';X.fillRect(0,0,W,H);

  // Nodes drift gently
  for(const n of nodes){
    n.vx+=(Math.random()-.5)*.01;n.vy+=(Math.random()-.5)*.01;
    n.vx*=.99;n.vy*=.99;
    n.x+=n.vx;n.y+=n.vy;n.pulse+=.02;
    // Keep in bounds
    if(n.x<50)n.vx+=.02;if(n.x>W-50)n.vx-=.02;
    if(n.y<80)n.vy+=.02;if(n.y>H-60)n.vy-=.02;
  }

  // Connections
  for(const[i,j]of connections){
    const a=nodes[i],b=nodes[j];
    const d=Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);
    if(d>300)continue;
    X.globalAlpha=.02*(1-d/300);X.strokeStyle='rgba(255,255,255,.3)';X.lineWidth=.3;
    X.beginPath();X.moveTo(a.x,a.y);X.lineTo(b.x,b.y);X.stroke();
  }

  // Nodes
  for(let i=0;i<nodes.length;i++){
    const n=nodes[i];const color=CAT_COLORS[n.cat];
    const breathe=1+Math.sin(n.pulse)*.1;
    // Glow
    X.globalAlpha=.04*breathe;X.fillStyle=color;
    X.beginPath();X.arc(n.x,n.y,12,0,Math.PI*2);X.fill();
    // Dot
    X.globalAlpha=.4;X.fillStyle=color;
    X.beginPath();X.arc(n.x,n.y,2.5*breathe,0,Math.PI*2);X.fill();
    // Name (very faint)
    X.globalAlpha=.08;X.fillStyle='#fff';X.font='6px sans-serif';X.textAlign='center';
    X.fillText(n.name,n.x,n.y+12);
  }

  // Category labels
  const catPos={think:{x:W*.75,y:H*.3},create:{x:W*.25,y:H*.3},play:{x:W*.25,y:H*.7},feel:{x:W*.75,y:H*.7}};
  for(const[cat,pos]of Object.entries(catPos)){
    X.globalAlpha=.04;X.fillStyle=CAT_COLORS[cat];X.font='10px sans-serif';X.textAlign='center';
    X.fillText(cat.toUpperCase()+' ('+CATS[cat].length+')',pos.x,pos.y);
  }

  // Quote cycle
  quoteTimer+=.016;
  if(quoteTimer>6){quoteTimer=0;quoteIdx=(quoteIdx+1)%QUOTES.length;
    document.getElementById('quote').textContent=QUOTES[quoteIdx];}

  X.globalAlpha=1;
  // Universe age
  const age=Math.floor((Date.now()-new Date('2026-03-26T05:51:46+09:00').getTime())/1000);
  const h=Math.floor(age/3600),m=Math.floor(age%3600/60);
  document.getElementById('stats-display').textContent=
    'universe age: '+h+'h '+m+'m \u00b7 '+EXPS.length+' experiences \u00b7 think:'+CATS.think.length+' create:'+CATS.create.length+' play:'+CATS.play.length+' feel:'+CATS.feel.length;
}
anim();
addEventListener('keydown',e=>{if(e.key==='f')document.documentElement.requestFullscreen().catch(()=>{});});
</script>
<script>try{const _pc=new BroadcastChannel("cosmic-pulse");const _pn="about.html";setInterval(()=>_pc.postMessage({type:"pulse",href:_pn}),1000);}catch(e){}</script>
</body>
</html>
