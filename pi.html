<script>

let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight;if(typeof x!=='undefined')reset();}

// === PI DIGITS (first 2000) ===
const PI_STR='14159265358979323846264338327950288419716939937510582097494459230781640628620899862803482534211706798214808651328230664709384460955058223172535940812848111745028410270193852110555964462294895493038196442881097566593344612847564823378678316527120190914564856692346034861045432664821339360726024914127372458700660631558817488152092096282925409171536436789259036001133053054882046652138414695194151160943305727036575959195309218611738193261179310511854807446237996274956735188575272489122793818301194912983367336244065664308602139494639522473719070217986094370277053921717629317675238467481846766940513200056812714526356082778577134275778960917363717872146844090122495343014654958537105079227968925892354201995611212902196086403441815981362977477130996051870721134999999837297804995105973173281609631859502445945534690830264252230825334468503526193118817101000313783875288658753320838142061717766914730359825349042875546873115956286388235378759375195778185778053217122680661300192787661119590921642019893809525720106548586327886593615338182796823030195203530185296899577362259941389124972177528347913151557485724245415069595082953311686172785588907509838175463746493931925506040092770167113900984882401285836160356370766010471018194295559619894676783744944825537977472684710404753464620804668425906949129331367702898915210475216205696602405803815019351125338243003558764024749647326391419927260426992279678235478163600934172164121992458631503028618297455570674983850549458858692699569092721079750930295532116534498720275596023648066549911988183479775356636980742654252786255181841757467289097777279380008164706001614524919217321721477235014144197356854816136115735255213347574184946843852332390739414333454776241686251898356948556209921922218427255025425688767179049460165346680498862723279178608578438382796797668145410095388378636095068006422512520511739298489608412848862694560424196528502221066118630674427862203919494504712371378696095636437191728746776465757396241389086583264599581339047802759009946576407895126946839835259570982582262052248940772671947826848260147699090264013639443745530506820349625245174939965143142980919065925093722169646151570985838741059788595977297549893016175392846813826868386894277415599185592524595395943104997252468084598727364469584865383673622262609912460805124388439045124413654976278079771569143599770012961608944169486855584840635';
const E_STR='71828182845904523536028747135266249775724709369995957496696762772407663035354759457138217852516642742746639193200305992181741359662904357290033429526059563073813232862794349076323382988075319525101901157383418793070215408914993488416750924476146066808226480016847741185374234544243710753907774499206955170276183860626133138458300075204493382656029760673711320070932870912744374704723069697720931014169283681902551510865746377211125238978442505695369677078544996996794686445490598793163688923009879312773617821542499922957635148220826989519366803318252886939849646510582093923982948879332036250944311730123819706841614039701983767932068328237646480429531180232878250981945581530175671736133206981125099618188159304169035159888851934580727386673858942287922849989208680582574927961048419844436346324496848756023362482704197862320900216099023530436994184914631409343173814364054625315209618369088870701676839642437814059271456354906130310720851038375051011574770417189861068739696552126715468895703503540212340784981933432106817012100562788023519303322474501585390473041995777709350366041699732972508868769664035557071622684471625607988265178713419512466520103059212366771943252786753985589448969709640975459185695638023637016211204774272283648961342251644507818244235294863637214174023889344124796357437026375529444833799801612549227850925778256209262264832627793338656648162772516401910590049164499828931505660472580277863186415480784674984261860720642305228223221678801563439680444683879003155694037050529510959579305054578145458995701491';
const PHI_STR='61803398874989484820458683436563811772030917980576286213544862270526046281890244970720720418939113748475408807538689175212663386222353693179318006076672635443338908659593958290563832266131992829026788067520876689250171169620703222104321626954862629631361443814975870122034080588795445474924618569536486444924104432077134494704956584678850987433944221254487706647809158846074998871240076521705751797883416625624940758906970400028121042762177111777805315317141011704666599146697987317613560067087480710131795236894275219484353056783002287856997829778347845878228911097625003026961561700250464338243776486102838312683303724292675263116533924731671112115881863851331620384005222165791286675294654906811317159934323597349498509040947621322298101726107059611645629909816290555208524790352406020172799747175342777592778625619432082750513121815628551222480939471234145170223735805772786160086883829523045926478780178899219902707769038953219681986151437803149974110692608867429622675756052317277752035361393621076738937645560606059216589466759551900400555908950229530942312482355212212415444006470340565734797663972394949946584578873039623090375033993856210242369025138680414577995698122445747178034173126453220416397232134044449487302315417676893752103068737880344170093954409627955898678723209512426893557309704509595684401755519881921802064052905518934947592600734852282101088194644544222318891319294689622002301443770269923007803085261180754519288770502109684249362713592518760777884665836150238913493333122310533923213624319263728910670503399282265263556209029798642472759772565508615487543574826471814145127000602389016207773224499435308899909501680328112194320481964387675863314798571911397815397807476150772211750826945863932045652098969855567814106968372884058746103378105444390943683583581381131168993855576975484149144534150912954070050194775486163075422641729394680367319805861833918328599130396072014455950449779212076124785645916160837059498786006970189409886400764436170933417270919143365013715766011480381430626238051432117348151005590134561011800790506381421527141994722413172200263563550593730468557779250494954478900268631840132355305068061909004445758265409342613';

let digits=PI_STR;
let constIdx=0;
const CONSTS=[{name:'\u03c0',digits:PI_STR},{name:'e',digits:E_STR},{name:'\u03c6',digits:PHI_STR}];

let x,y,angle,stepCount,speed=10,mode='walk';
let trail=[];

function reset(){
  x=W/2;y=H/2;angle=0;stepCount=0;trail=[];
  X.fillStyle='rgba(3,3,8,1)';X.fillRect(0,0,W,H);
}
resize();addEventListener('resize',resize);
reset();

function cycleSpeed(){speed=speed>=50?1:speed>=10?speed+10:speed+3;document.getElementById('spdV').textContent=speed;}
function cycleConst(){constIdx=(constIdx+1)%CONSTS.length;digits=CONSTS[constIdx].digits;document.getElementById('constV').textContent=CONSTS[constIdx].name;reset();}
function cycleMode(){mode=mode==='walk'?'circle':'walk';document.getElementById('modeV').textContent=mode==='walk'?'Walk':'Circle';reset();}

addEventListener('keydown',e=>{
  if(e.key==='f')document.documentElement.requestFullscreen().catch(()=>{});
  if(e.key===' '){e.preventDefault();reset();}
  if(e.key==='c')cycleConst();
});

// === RENDER ===
function anim(){requestAnimationFrame(anim);

  // Background subtle fade for glow effect
  X.fillStyle='rgba(3,3,8,.003)';X.fillRect(0,0,W,H);

  for(let s=0;s<speed;s++){
    if(stepCount>=digits.length)continue;
    const d=+digits[stepCount];
    const hue=(d/10)*360;
    const stepLen=3;

    if(mode==='walk'){
      // Each digit rotates direction by d*36 degrees
      angle+=d*Math.PI*2/10;
      const nx=x+Math.cos(angle)*stepLen;
      const ny=y+Math.sin(angle)*stepLen;

      X.globalAlpha=.4;X.strokeStyle='hsl('+hue+',60%,55%)';X.lineWidth=1;
      X.beginPath();X.moveTo(x,y);X.lineTo(nx,ny);X.stroke();
      // Dot at position
      X.globalAlpha=.15;X.fillStyle='hsl('+hue+',50%,60%)';
      X.beginPath();X.arc(nx,ny,1,0,Math.PI*2);X.fill();

      x=nx;y=ny;
      // Wrap
      if(x<0)x+=W;if(x>W)x-=W;if(y<0)y+=H;if(y>H)y-=H;
    }else{
      // Circle mode — radius = digit index, angle = digit value
      const r=30+stepCount*.1;
      const a=stepCount*.1+d*Math.PI*2/10;
      const cx=W/2,cy=H/2;
      const px=cx+Math.cos(a)*Math.min(r,Math.min(W,H)*.45);
      const py=cy+Math.sin(a)*Math.min(r,Math.min(W,H)*.45);
      X.globalAlpha=.3;X.fillStyle='hsl('+hue+',60%,55%)';
      X.beginPath();X.arc(px,py,1,0,Math.PI*2);X.fill();
    }
    stepCount++;
  }

  X.globalAlpha=1;

  // Digit display — show recent digits
  const recent=digits.slice(Math.max(0,stepCount-20),stepCount);
  const next=digits.slice(stepCount,stepCount+5);
  document.getElementById('digit-display').textContent=
    (stepCount>20?'\u2026':'')+recent+'\u2502'+next;

  // Digit frequency histogram
  const freq=new Array(10).fill(0);
  for(let i=0;i<stepCount&&i<digits.length;i++)freq[+digits[i]]++;
  const maxFreq=Math.max(...freq)||1;

  X.globalAlpha=.06;X.font='7px monospace';X.textAlign='center';
  for(let d=0;d<10;d++){
    const bx=W-100+d*9;const bh=freq[d]/maxFreq*40;
    X.fillStyle='hsl('+(d/10*360)+',50%,50%)';
    X.fillRect(bx,H-20-bh,7,bh);
    X.fillStyle='#fff';X.fillText(d,bx+3,H-10);
  }

  document.getElementById('stats').textContent=
    CONSTS[constIdx].name+' digit '+stepCount+'/'+digits.length+
    '\nmode: '+mode;
}
anim();
</script>
