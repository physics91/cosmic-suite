<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Mandala</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000'/><circle cx='16' cy='16' r='8' fill='none' stroke='%23cc88ff' stroke-width='.5' opacity='.5'/><circle cx='16' cy='16' r='4' fill='none' stroke='%23ff88cc' stroke-width='.5' opacity='.5'/></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#050508;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;cursor:crosshair}
    canvas{display:block}
    #info{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.2);font-size:10px;letter-spacing:2px;z-index:2;pointer-events:none}
    #controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
    .btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);padding:5px 12px;border-radius:12px;cursor:pointer;font-size:10px;transition:all .2s}
    .btn:hover{background:rgba(255,255,255,.1);color:#fff}
    #sym{position:fixed;top:40px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.12);font-size:9px;z-index:2;pointer-events:none}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">MOVE TO CREATE · CLICK TO CHANGE SYMMETRY</div>
<div id="sym"></div>
<div id="controls">
  <button class="btn" onclick="clearMandala()">Clear</button>
  <button class="btn" onclick="symmetry=Math.max(2,symmetry-2)">- Sym</button>
  <button class="btn" onclick="symmetry=Math.min(32,symmetry+2)">+ Sym</button>
  <button class="btn" onclick="hueShift=(hueShift+60)%360">Color</button>
  <button class="btn" onclick="brushSize=brushSize===1?3:brushSize===3?5:1">Brush</button>
  <button class="btn" onclick="exportMandala()">Save</button>
</div>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight;X.fillStyle='#050508';X.fillRect(0,0,W,H);}
resize();addEventListener('resize',resize);

let symmetry=8,hueShift=0,brushSize=2,drawing=false,lastX=0,lastY=0,strokes=0;

C.addEventListener('mousedown',e=>{drawing=true;lastX=e.clientX;lastY=e.clientY;});
C.addEventListener('mouseup',()=>drawing=false);
C.addEventListener('mousemove',e=>{
  if(!drawing)return;
  const cx=W/2,cy=H/2;
  const dx=e.clientX-cx,dy=e.clientY-cy;
  const ldx=lastX-cx,ldy=lastY-cy;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const hue=(hueShift+dist*.5+strokes*.1)%360;

  for(let i=0;i<symmetry;i++){
    const angle=i*Math.PI*2/symmetry;
    const cos=Math.cos(angle),sin=Math.sin(angle);
    // Current point rotated
    const rx=dx*cos-dy*sin+cx,ry=dx*sin+dy*cos+cy;
    const lrx=ldx*cos-ldy*sin+cx,lry=ldx*sin+ldy*cos+cy;
    // Draw stroke
    X.globalAlpha=.4;X.strokeStyle=`hsl(${hue},60%,60%)`;X.lineWidth=brushSize;X.lineCap='round';
    X.beginPath();X.moveTo(lrx,lry);X.lineTo(rx,ry);X.stroke();
    // Mirror
    const mrx=(-dx)*cos-dy*sin+cx,mry=(-dx)*sin+dy*cos+cy;
    const mlrx=(-ldx)*cos-ldy*sin+cx,mlry=(-ldx)*sin+ldy*cos+cy;
    X.beginPath();X.moveTo(mlrx,mlry);X.lineTo(mrx,mry);X.stroke();}

  X.globalAlpha=1;strokes++;lastX=e.clientX;lastY=e.clientY;});

// Touch
C.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;});
C.addEventListener('touchend',()=>drawing=false);
C.addEventListener('touchmove',e=>{e.preventDefault();
  const ev={clientX:e.touches[0].clientX,clientY:e.touches[0].clientY};
  C.dispatchEvent(new MouseEvent('mousemove',ev));
  lastX=ev.clientX;lastY=ev.clientY;});

C.addEventListener('click',()=>{symmetry=symmetry>=16?4:symmetry+2;});

function clearMandala(){X.fillStyle='#050508';X.fillRect(0,0,W,H);strokes=0;}
function exportMandala(){const l=document.createElement('a');l.download='mandala_'+Date.now()+'.png';l.href=C.toDataURL();l.click();}

// Subtle center marker
function drawCenter(){
  X.globalAlpha=.03;X.strokeStyle='#fff';X.lineWidth=.5;
  for(let i=0;i<symmetry;i++){const a=i*Math.PI*2/symmetry;
    X.beginPath();X.moveTo(W/2,H/2);X.lineTo(W/2+Math.cos(a)*Math.max(W,H),H/2+Math.sin(a)*Math.max(W,H));X.stroke();}
  X.globalAlpha=1;}

function anim(){requestAnimationFrame(anim);
  drawCenter();
  document.getElementById('sym').textContent=symmetry*2+'-fold symmetry · '+strokes+' strokes · brush '+brushSize;}
anim();

addEventListener('keydown',e=>{
  if(e.key==='c')clearMandala();if(e.key==='s')exportMandala();
  if(e.key==='+')symmetry=Math.min(32,symmetry+2);if(e.key==='-')symmetry=Math.max(2,symmetry-2);
  if(e.key==='f')document.documentElement.requestFullscreen().catch(()=>{});});
</script>
</body>
</html>
