<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbits</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000'/><circle cx='16' cy='16' r='4' fill='%23ffcc44' opacity='.5'/><circle cx='24' cy='12' r='2' fill='%234488ff' opacity='.6'/></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#020208;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;cursor:crosshair}
    canvas{display:block}
    #info{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.12);font-size:9px;letter-spacing:3px;z-index:2;pointer-events:none}
    #stats{position:fixed;bottom:16px;left:16px;color:rgba(255,255,255,.08);font-size:8px;z-index:2;pointer-events:none;font-family:monospace;line-height:1.8}
    .btn{position:fixed;z-index:20;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.3);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:9px;letter-spacing:1px}
    .btn:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">DRAG TO LAUNCH PLANETS &middot; RIGHT-CLICK TO REMOVE &middot; SCROLL = ZOOM</div>
<div id="stats"></div>
<button class="btn" style="bottom:16px;right:16px" onclick="clearBodies()">Clear</button>
<button class="btn" style="bottom:16px;right:70px" onclick="presetSolar()">Solar</button>
<button class="btn" style="bottom:16px;right:130px" onclick="presetBinary()">Binary Star</button>
<button class="btn" style="bottom:16px;right:225px" onclick="presetFigure8()">Figure-8</button>
<button class="btn" style="bottom:16px;right:310px" onclick="toggleTrails()"><span id="trLabel">Trails ON</span></button>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a><a id="random-jump" href="portal.html" style="position:fixed;top:12px;right:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">random &rarr;</a>
<script>document.getElementById('random-jump').onclick=function(){const e=['art.html','attractor.html','automata.html','beats.html','breathe.html','cellular-music.html','chaos-map.html','chat.html','clock.html','conway.html','dice.html','entropy.html','flocking.html','fourier.html','fractal.html','gravity-beats.html','gravity-well.html','harmonograph.html','index.html','interference.html','life.html','living-mandala.html','mandala.html','memory.html','music.html','neural.html','oracle.html','orbit.html','order.html','pendulum.html','pi.html','puzzle.html','racer.html','reaction.html','rhythm.html','sandbox.html','scale.html','sonic-terrain.html','sorting.html','spirograph.html','swarm-gravity.html','tarot.html','terrain.html','topology.html','type.html','words.html'];location.href=e[Math.random()*e.length|0];return false;};</script>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight;}
resize();addEventListener('resize',resize);

const G=500;
let bodies=[],showTrails=true,zoom=1,camX=0,camY=0;

class Body{
  constructor(x,y,vx,vy,mass,color,fixed){
    this.x=x;this.y=y;this.vx=vx||0;this.vy=vy||0;
    this.mass=mass||1;this.color=color||'#4488ff';
    this.fixed=fixed||false;
    this.trail=[];this.hue=Math.random()*360;
  }
}

// Start with a sun
bodies.push(new Body(0,0,0,0,1000,'#ffcc44',true));

function clearBodies(){bodies=[new Body(0,0,0,0,1000,'#ffcc44',true)];}

function presetSolar(){
  clearBodies();
  const planets=[
    {d:80,v:2.5,m:3,c:'#4488ff'},{d:130,v:2,m:5,c:'#cc8844'},
    {d:200,v:1.6,m:8,c:'#44aa88'},{d:280,v:1.3,m:2,c:'#ff6644'},
  ];
  for(const p of planets){
    const a=Math.random()*Math.PI*2;
    bodies.push(new Body(Math.cos(a)*p.d,Math.sin(a)*p.d,-Math.sin(a)*p.v,Math.cos(a)*p.v,p.m,p.c));
  }
}

function presetBinary(){
  clearBodies();bodies=[];
  bodies.push(new Body(-60,0,0,1.5,500,'#ffcc44',false));
  bodies.push(new Body(60,0,0,-1.5,500,'#ffaa88',false));
  bodies.push(new Body(200,0,0,-2.8,2,'#4488ff',false));
}

function presetFigure8(){
  clearBodies();bodies=[];
  const p=0.347111,q=0.532728;
  bodies.push(new Body(-1*80,0,p*3,q*3,300,'#ff6644'));
  bodies.push(new Body(1*80,0,p*3,q*3,300,'#4488ff'));
  bodies.push(new Body(0,0,-2*p*3,-2*q*3,300,'#44ff88'));
}

function toggleTrails(){showTrails=!showTrails;document.getElementById('trLabel').textContent=showTrails?'Trails ON':'Trails OFF';}

// === INPUT ===
let dragStart=null,dragEnd=null;
C.addEventListener('mousedown',e=>{
  if(e.button===2)return;
  dragStart={x:(e.clientX-W/2)/zoom+camX,y:(e.clientY-H/2)/zoom+camY};
});
C.addEventListener('mousemove',e=>{
  if(dragStart)dragEnd={x:(e.clientX-W/2)/zoom+camX,y:(e.clientY-H/2)/zoom+camY};
});
C.addEventListener('mouseup',e=>{
  if(dragStart&&dragEnd){
    const vx=(dragStart.x-dragEnd.x)*.02;
    const vy=(dragStart.y-dragEnd.y)*.02;
    const hue=Math.random()*360;
    bodies.push(new Body(dragStart.x,dragStart.y,vx,vy,2+Math.random()*5,'hsl('+hue+',60%,60%)'));
  }
  dragStart=null;dragEnd=null;
});
C.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const mx=(e.clientX-W/2)/zoom+camX,my=(e.clientY-H/2)/zoom+camY;
  let best=-1,bd=900;
  for(let i=0;i<bodies.length;i++){
    if(bodies[i].fixed)continue;
    const dx=bodies[i].x-mx,dy=bodies[i].y-my;
    if(dx*dx+dy*dy<bd){bd=dx*dx+dy*dy;best=i;}
  }
  if(best>=0)bodies.splice(best,1);
});
addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.2,Math.min(5,zoom*(e.deltaY>0?.9:1.1)));},{passive:false});
addEventListener('keydown',e=>{
  if(e.key==='f')document.documentElement.requestFullscreen().catch(()=>{});
  if(e.key==='c')clearBodies();
  if(e.key===' '){e.preventDefault();presetSolar();}
});

// === PHYSICS ===
function simulate(){
  const dt=.5;
  for(const b of bodies){
    if(b.fixed)continue;
    let ax=0,ay=0;
    for(const o of bodies){
      if(o===b)continue;
      const dx=o.x-b.x,dy=o.y-b.y;
      const d2=dx*dx+dy*dy+50;
      const d=Math.sqrt(d2);
      const f=G*o.mass/(d2);
      ax+=dx/d*f;ay+=dy/d*f;
    }
    b.vx+=ax*dt;b.vy+=ay*dt;
  }
  for(const b of bodies){
    if(b.fixed)continue;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(showTrails){b.trail.push({x:b.x,y:b.y});if(b.trail.length>500)b.trail.shift();}
  }
  // Remove escaped bodies
  for(let i=bodies.length-1;i>=0;i--){
    if(!bodies[i].fixed&&(Math.abs(bodies[i].x)>5000||Math.abs(bodies[i].y)>5000))bodies.splice(i,1);
  }
}

// === RENDER ===
const bgStars=Array.from({length:100},()=>({x:Math.random()*3e3,y:Math.random()*3e3,s:Math.random(),p:Math.random()*Math.PI*2}));

function toScreen(x,y){
  return{x:W/2+(x-camX)*zoom,y:H/2+(y-camY)*zoom};
}

function anim(){requestAnimationFrame(anim);
  simulate();
  X.fillStyle='rgba(2,2,8,.12)';X.fillRect(0,0,W,H);

  // Stars
  for(const s of bgStars){s.p+=.002;X.globalAlpha=.03+Math.sin(s.p)*.015;X.fillStyle='#fff';
    X.beginPath();X.arc(s.x%W,s.y%H,s.s,0,Math.PI*2);X.fill();}

  // Trails
  if(showTrails){
    for(const b of bodies){
      if(b.trail.length<2)continue;
      X.strokeStyle=b.color;X.lineWidth=.5;X.globalAlpha=.1;
      X.beginPath();
      for(let i=0;i<b.trail.length;i++){
        const s=toScreen(b.trail[i].x,b.trail[i].y);
        i===0?X.moveTo(s.x,s.y):X.lineTo(s.x,s.y);
      }
      X.stroke();
    }
  }

  // Bodies
  for(const b of bodies){
    const s=toScreen(b.x,b.y);
    const r=Math.max(2,Math.sqrt(b.mass)*.4*zoom);
    // Glow
    X.globalAlpha=b.fixed?.15:.06;
    const g=X.createRadialGradient(s.x,s.y,0,s.x,s.y,r*4);
    g.addColorStop(0,b.color);g.addColorStop(1,'rgba(0,0,0,0)');
    X.fillStyle=g;X.beginPath();X.arc(s.x,s.y,r*4,0,Math.PI*2);X.fill();
    // Body
    X.globalAlpha=b.fixed?.8:.6;X.fillStyle=b.color;
    X.beginPath();X.arc(s.x,s.y,r,0,Math.PI*2);X.fill();
  }

  // Launch arrow
  if(dragStart&&dragEnd){
    const s1=toScreen(dragStart.x,dragStart.y);
    const s2=toScreen(dragEnd.x,dragEnd.y);
    X.globalAlpha=.2;X.strokeStyle='#fff';X.lineWidth=1;X.setLineDash([4,4]);
    X.beginPath();X.moveTo(s1.x,s1.y);X.lineTo(s2.x,s2.y);X.stroke();
    X.setLineDash([]);
    X.globalAlpha=.3;X.fillStyle='#fff';
    X.beginPath();X.arc(s1.x,s1.y,4,0,Math.PI*2);X.fill();
  }

  X.globalAlpha=1;
  document.getElementById('stats').textContent=
    'bodies: '+bodies.length+'\nzoom: '+zoom.toFixed(1)+'x';
}
anim();
</script>
<script>try{const _pc=new BroadcastChannel("cosmic-pulse");const _pn="orbits.html";setInterval(()=>_pc.postMessage({type:"pulse",href:_pn}),1000);}catch(e){}</script>
</body>
</html>
