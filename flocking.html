<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flocking</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000'/><polygon points='16,8 14,14 18,14' fill='%2388ccff' opacity='.4'/><polygon points='12,14 10,20 14,20' fill='%2388ccff' opacity='.3'/></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#030310;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;cursor:none}
    canvas{display:block}
    #info{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.12);font-size:9px;letter-spacing:3px;z-index:2;pointer-events:none;text-align:center}
    #stats{position:fixed;bottom:16px;left:16px;color:rgba(255,255,255,.08);font-size:8px;z-index:2;pointer-events:none;font-family:monospace;line-height:1.8}
    .btn{position:fixed;z-index:20;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.3);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:9px;letter-spacing:1px}
    .btn:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
    .btn.active{background:rgba(136,200,255,.1);border-color:rgba(136,200,255,.3)}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">BOIDS &middot; 3 RULES CREATE FLOCKING &middot; MOVE MOUSE TO ATTRACT</div>
<div id="stats"></div>
<button class="btn" style="bottom:16px;right:16px" onclick="addBoids(50)">+50 Boids</button>
<button class="btn" style="bottom:16px;right:110px" onclick="clearAll()">Clear</button>
<button class="btn" style="bottom:16px;right:165px" onclick="addPredator()">Add Predator</button>
<button class="btn active" style="bottom:16px;right:280px" id="btnTrail" onclick="showTrails=!showTrails;this.classList.toggle('active')">Trails</button>
<button class="btn" style="bottom:40px;right:16px" onclick="cycleSpecies()">Species: <span id="spV">1</span></button>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a><a id="random-jump" href="#" onclick="const e=['art.html','attractor.html','automata.html','beats.html','breathe.html','cellular-music.html','chat.html','clock.html','conway.html','dice.html','entropy.html','fourier.html','gravity-beats.html','gravity-well.html','harmonograph.html','index.html','interference.html','life.html','living-mandala.html','mandala.html','memory.html','music.html','neural.html','oracle.html','orbit.html','pendulum.html','puzzle.html','racer.html','reaction.html','rhythm.html','sandbox.html','scale.html','sonic-terrain.html','tarot.html','terrain.html','topology.html','type.html','words.html','flocking.html'];location.href=e[Math.random()*e.length|0];return false" style="position:fixed;top:12px;right:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">random &rarr;</a>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight;}
resize();addEventListener('resize',resize);

// === CONSTANTS ===
const MAX_BOIDS=10000;
const TRAIL_LEN=15;
const COLORS=['#88ccff','#ff8866','#66ffaa','#ffcc44','#cc88ff'];
const PERCEPTION=60,SEP_DIST=25,MAX_SPEED=4,MAX_FORCE=0.15;

// === STATE ===
let showTrails=true,numSpecies=1;
let mx=W/2,my=H/2,mouseActive=false;
let boidCount=0;
let wasmReady=false;
let wasmExports=null;

// === PREDATORS (stay in JS — few objects) ===
const predators=[];
class Predator{
  constructor(x,y){
    this.x=x;this.y=y;this.vx=(Math.random()-.5)*2;this.vy=(Math.random()-.5)*2;
  }
}

// === BOID DATA: SoA layout (WASM views or JS fallback) ===
let wasmPx,wasmPy,wasmVx,wasmVy,wasmType;
let jsPx,jsPy,jsVx,jsVy,jsType;

// Per-boid rendering state (always JS)
let boidSpecies;   // Float32Array — species index per boid
let boidHue;       // Float32Array — cached hue for rendering

// Trail ring buffer (pre-allocated, no GC)
let trailX,trailY,trailHead;

function initArrays(n){
  boidSpecies=new Float32Array(n);
  boidHue=new Float32Array(n);
  trailX=new Float32Array(n*TRAIL_LEN);
  trailY=new Float32Array(n*TRAIL_LEN);
  trailHead=new Int32Array(n);
  if(!wasmReady){
    jsPx=new Float32Array(n);
    jsPy=new Float32Array(n);
    jsVx=new Float32Array(n);
    jsVy=new Float32Array(n);
    jsType=new Float32Array(n);
  }
}

// === WASM LOADING ===
async function initWasm(){
  try{
    const resp=await WebAssembly.instantiateStreaming(fetch('./physics.wasm'),{
      env:{abort:()=>{}}
    });
    wasmExports=resp.instance.exports;
    const mem=wasmExports.memory;

    wasmExports.boids_init(MAX_BOIDS,W,H);
    wasmExports.boids_set_params(
      25.0,   // separation weight
      0.05,   // alignment weight
      0.003,  // cohesion weight
      MAX_SPEED,
      MAX_FORCE,
      PERCEPTION,
      SEP_DIST
    );

    const pxPtr=wasmExports.boids_get_px_ptr();
    const pyPtr=wasmExports.boids_get_py_ptr();
    const vxPtr=wasmExports.boids_get_vx_ptr();
    const vyPtr=wasmExports.boids_get_vy_ptr();
    const typePtr=wasmExports.boids_get_type_ptr();
    wasmPx=new Float32Array(mem.buffer,pxPtr,MAX_BOIDS);
    wasmPy=new Float32Array(mem.buffer,pyPtr,MAX_BOIDS);
    wasmVx=new Float32Array(mem.buffer,vxPtr,MAX_BOIDS);
    wasmVy=new Float32Array(mem.buffer,vyPtr,MAX_BOIDS);
    wasmType=new Float32Array(mem.buffer,typePtr,MAX_BOIDS);

    wasmReady=true;
    console.log('WASM boids loaded — max:',MAX_BOIDS);

    initArrays(MAX_BOIDS);
    addBoids(1000);
  }catch(e){
    console.warn('WASM unavailable, using JS fallback:',e);
    initArrays(MAX_BOIDS);
    addBoids(1000);
  }
}

// === BOID MANAGEMENT ===
function addBoid(x,y,species){
  if(boidCount>=MAX_BOIDS)return;
  const i=boidCount;
  const bx=x!=null?x:Math.random()*W;
  const by=y!=null?y:Math.random()*H;
  const bvx=(Math.random()-.5)*4;
  const bvy=(Math.random()-.5)*4;
  const sp=species||0;

  if(wasmReady){
    wasmExports.boids_add(bx,by,bvx,bvy,sp);
  }else{
    jsPx[i]=bx;jsPy[i]=by;jsVx[i]=bvx;jsVy[i]=bvy;jsType[i]=sp;
  }

  boidSpecies[i]=sp;
  boidHue[i]=0; // not used, we use COLORS[species]
  trailHead[i]=0;
  const base=i*TRAIL_LEN;
  for(let t=0;t<TRAIL_LEN;t++){trailX[base+t]=bx;trailY[base+t]=by;}
  boidCount++;
}

function addBoids(n,species){
  for(let i=0;i<n;i++)addBoid(null,null,species!=null?species:0);
}

function addPredator(){predators.push(new Predator(W/2,H/2));}

function clearAll(){
  boidCount=0;
  predators.length=0;
  // Re-init WASM boids module to reset count
  if(wasmReady){
    wasmExports.boids_init(MAX_BOIDS,W,H);
    wasmExports.boids_set_params(25.0,0.05,0.003,MAX_SPEED,MAX_FORCE,PERCEPTION,SEP_DIST);
  }
}

function cycleSpecies(){
  numSpecies=numSpecies>=5?1:numSpecies+1;
  document.getElementById('spV').textContent=numSpecies;
  clearAll();
  for(let s=0;s<numSpecies;s++)addBoids(Math.floor(1000/numSpecies),s);
}

// === INPUT ===
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;mouseActive=true;});
addEventListener('keydown',e=>{
  if(e.key==='f')document.documentElement.requestFullscreen().catch(()=>{});
  if(e.key===' '){e.preventDefault();addPredator();}
  if(e.key==='c')clearAll();
});
addEventListener('click',e=>{if(e.target.closest('.btn,a'))return;
  for(let i=0;i<20;i++)addBoid(e.clientX+(Math.random()-.5)*30,e.clientY+(Math.random()-.5)*30,Math.floor(Math.random()*numSpecies));
});
addEventListener('touchstart',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY;mouseActive=true;},{passive:true});
addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY;},{passive:true});

// === JS FALLBACK PHYSICS ===
function stepPhysicsJS(){
  for(let i=0;i<boidCount;i++){
    let sepX=0,sepY=0,sepN=0;
    let aliX=0,aliY=0,aliN=0;
    let cohX=0,cohY=0,cohN=0;

    const bx=jsPx[i],by=jsPy[i],bvx=jsVx[i],bvy=jsVy[i],bsp=jsType[i];

    for(let j=0;j<boidCount;j++){
      if(j===i)continue;
      const dx=jsPx[j]-bx,dy=jsPy[j]-by;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d>PERCEPTION)continue;
      const sameSpecies=jsType[j]===bsp;

      if(d<SEP_DIST&&d>0){sepX-=dx/d;sepY-=dy/d;sepN++;}
      if(sameSpecies){aliX+=jsVx[j];aliY+=jsVy[j];aliN++;}
      if(sameSpecies){cohX+=jsPx[j];cohY+=jsPy[j];cohN++;}
    }

    let fx=0,fy=0;
    if(sepN>0){fx+=sepX/sepN*1.5;fy+=sepY/sepN*1.5;}
    if(aliN>0){const ax=aliX/aliN-bvx,ay=aliY/aliN-bvy;fx+=ax*.05;fy+=ay*.05;}
    if(cohN>0){const cx=cohX/cohN-bx,cy=cohY/cohN-by;fx+=cx*.003;fy+=cy*.003;}

    // Mouse attraction
    if(mouseActive){
      const dx=mx-bx,dy=my-by;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<200){fx+=dx/d*.08;fy+=dy/d*.08;}
    }

    // Predator avoidance
    for(const p of predators){
      const dx=p.x-bx,dy=p.y-by;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<120){fx-=dx/d*1.5;fy-=dy/d*1.5;}
    }

    const fMag=Math.sqrt(fx*fx+fy*fy);
    if(fMag>MAX_FORCE){fx=fx/fMag*MAX_FORCE;fy=fy/fMag*MAX_FORCE;}

    jsVx[i]+=fx;jsVy[i]+=fy;
    const spd=Math.sqrt(jsVx[i]*jsVx[i]+jsVy[i]*jsVy[i]);
    if(spd>MAX_SPEED){jsVx[i]=jsVx[i]/spd*MAX_SPEED;jsVy[i]=jsVy[i]/spd*MAX_SPEED;}
    if(spd<1){jsVx[i]=jsVx[i]/spd;jsVy[i]=jsVy[i]/spd;}

    jsPx[i]+=jsVx[i];jsPy[i]+=jsVy[i];
    if(jsPx[i]<0)jsPx[i]=W;if(jsPx[i]>W)jsPx[i]=0;
    if(jsPy[i]<0)jsPy[i]=H;if(jsPy[i]>H)jsPy[i]=0;
  }
}

// === PREDATOR PHYSICS (always JS) ===
function stepPredators(){
  for(const p of predators){
    const px=wasmReady?wasmPx:jsPx;
    const py=wasmReady?wasmPy:jsPy;
    let nearX=0,nearY=0,nearD=Infinity;
    for(let i=0;i<boidCount;i++){
      const d=(px[i]-p.x)**2+(py[i]-p.y)**2;
      if(d<nearD){nearD=d;nearX=px[i];nearY=py[i];}
    }
    if(nearD<Infinity){
      const dx=nearX-p.x,dy=nearY-p.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      p.vx+=(dx/d)*.05;p.vy+=(dy/d)*.05;
    }
    const spd=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
    if(spd>3){p.vx=p.vx/spd*3;p.vy=p.vy/spd*3;}
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
  }
}

// === PREDATOR AVOIDANCE for WASM boids (apply as attractor hack) ===
// WASM only has a single attractor. We combine mouse + predator repulsion
// by computing a net force on each boid in JS after WASM step, nudging velocities.
function applyPredatorAvoidanceWasm(){
  if(predators.length===0)return;
  for(let i=0;i<boidCount;i++){
    let fx=0,fy=0;
    for(const p of predators){
      const dx=p.x-wasmPx[i],dy=p.y-wasmPy[i];
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<120){fx-=dx/d*1.5;fy-=dy/d*1.5;}
    }
    if(fx!==0||fy!==0){
      const fMag=Math.sqrt(fx*fx+fy*fy);
      if(fMag>MAX_FORCE){fx=fx/fMag*MAX_FORCE;fy=fy/fMag*MAX_FORCE;}
      wasmVx[i]+=fx;wasmVy[i]+=fy;
      const spd=Math.sqrt(wasmVx[i]*wasmVx[i]+wasmVy[i]*wasmVy[i]);
      if(spd>MAX_SPEED){wasmVx[i]=wasmVx[i]/spd*MAX_SPEED;wasmVy[i]=wasmVy[i]/spd*MAX_SPEED;}
    }
  }
}

// === RENDER ===
function anim(){requestAnimationFrame(anim);
  X.fillStyle='rgba(3,3,16,.1)';X.fillRect(0,0,W,H);

  const px=wasmReady?wasmPx:jsPx;
  const py=wasmReady?wasmPy:jsPy;
  const vx=wasmReady?wasmVx:jsVx;
  const vy=wasmReady?wasmVy:jsVy;

  // === PHYSICS STEP ===
  if(wasmReady){
    // Set mouse attractor
    if(mouseActive){
      wasmExports.boids_set_attractor(mx,my,0.08);
    }else{
      wasmExports.boids_set_attractor(0,0,0);
    }
    wasmExports.boids_step(1.0);
    applyPredatorAvoidanceWasm();
  }else{
    stepPhysicsJS();
  }

  stepPredators();

  // === UPDATE TRAILS ===
  if(showTrails){
    for(let i=0;i<boidCount;i++){
      const head=trailHead[i];
      const base=i*TRAIL_LEN;
      trailX[base+head]=px[i];
      trailY[base+head]=py[i];
      trailHead[i]=(head+1)%TRAIL_LEN;
    }
  }

  // === DRAW TRAILS ===
  if(showTrails){
    for(let i=0;i<boidCount;i++){
      const sp=boidSpecies[i]|0;
      const base=i*TRAIL_LEN;
      const head=trailHead[i];
      X.strokeStyle=COLORS[sp%COLORS.length];X.lineWidth=.5;X.globalAlpha=.04;
      X.beginPath();
      for(let t=0;t<TRAIL_LEN;t++){
        const idx=base+((head+t)%TRAIL_LEN);
        t===0?X.moveTo(trailX[idx],trailY[idx]):X.lineTo(trailX[idx],trailY[idx]);
      }
      X.stroke();
    }
  }

  // === DRAW BOIDS ===
  for(let i=0;i<boidCount;i++){
    const bvx=vx[i],bvy=vy[i];
    const angle=Math.atan2(bvy,bvx);
    const spd=Math.sqrt(bvx*bvx+bvy*bvy);
    const sz=3+spd*.5;
    const sp=boidSpecies[i]|0;
    X.globalAlpha=.5;X.fillStyle=COLORS[sp%COLORS.length];
    X.save();X.translate(px[i],py[i]);X.rotate(angle);
    X.beginPath();X.moveTo(sz,0);X.lineTo(-sz*.5,-sz*.4);X.lineTo(-sz*.5,sz*.4);X.closePath();X.fill();
    X.restore();
  }

  // === DRAW PREDATORS ===
  for(const p of predators){
    X.globalAlpha=.4;X.fillStyle='#ff3333';
    X.beginPath();X.arc(p.x,p.y,6,0,Math.PI*2);X.fill();
    X.globalAlpha=.08;
    X.beginPath();X.arc(p.x,p.y,120,0,Math.PI*2);X.stroke();
  }

  // === MOUSE CURSOR ===
  if(mouseActive){
    X.globalAlpha=.06;X.fillStyle='#88ccff';
    X.beginPath();X.arc(mx,my,8,0,Math.PI*2);X.fill();
    X.globalAlpha=.02;
    X.beginPath();X.arc(mx,my,200,0,Math.PI*2);X.stroke();
  }

  X.globalAlpha=1;
  document.getElementById('stats').textContent=
    'boids: '+boidCount+(wasmReady?' (WASM)':' (JS)')+'\npredators: '+predators.length+'\nspecies: '+numSpecies;
}

// Start after WASM init attempt
initWasm().then(()=>anim());
</script>
<script>try{const _pc=new BroadcastChannel("cosmic-pulse");const _pn="flocking.html";setInterval(()=>_pc.postMessage({type:"pulse",href:_pn}),1000);}catch(e){}</script>
</body>
</html>
