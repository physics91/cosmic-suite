<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Life</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000'/><circle cx='12' cy='14' r='3' fill='%23ff4444'/><circle cx='20' cy='14' r='3' fill='%2344ff44'/><circle cx='16' cy='20' r='3' fill='%234488ff'/></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#080810;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;cursor:crosshair}
    canvas{display:block}
    #ui{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10}
    .btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.5);padding:5px 14px;border-radius:12px;cursor:pointer;font-size:11px;transition:all .2s}
    .btn:hover{background:rgba(255,255,255,.1);color:#fff}
    #info{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.25);font-size:10px;letter-spacing:2px;z-index:10;pointer-events:none}
    #matrix{position:fixed;top:16px;right:16px;z-index:10;font-size:9px;font-family:monospace}
    #title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.025);font-size:50px;font-weight:100;letter-spacing:10px;pointer-events:none;z-index:0}
  </style>
</head>
<body>
<div id="title">LIFE</div>
<div id="info">PARTICLES ATTRACT OR REPEL BASED ON COLOR · LIFE EMERGES FROM SIMPLE RULES</div>
<div id="matrix"></div>
<div id="ui">
  <button class="btn" onclick="randomize()">Randomize</button>
  <button class="btn" onclick="preset('cells')">Cells</button>
  <button class="btn" onclick="preset('chase')">Chase</button>
  <button class="btn" onclick="preset('swarm')">Swarm</button>
  <button class="btn" onclick="reset()">Reset</button>
</div>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight;}
resize();addEventListener('resize',resize);

const SPECIES=[
  {name:'R',color:'#ff4444'},{name:'G',color:'#44ff44'},
  {name:'B',color:'#4488ff'},{name:'Y',color:'#ffcc44'}];
const N=SPECIES.length;
let rules=Array.from({length:N},()=>Array.from({length:N},()=>+((Math.random()-.5)*2).toFixed(1)));

let particles=[];const COUNT=400;
function createParticles(){particles=[];
  for(let i=0;i<COUNT;i++)particles.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,sp:i%N});}
createParticles();

function preset(name){
  if(name==='cells')rules=[[1,-.5,-.5,.2],[-.5,1,-.5,.2],[-.5,-.5,1,.2],[.2,.2,.2,-.3]];
  else if(name==='chase')rules=[[0,1,-.5,0],[-1,0,1,0],[.5,-1,0,0],[0,0,0,0]];
  else if(name==='swarm')rules=[[.3,.1,.1,.1],[.1,.3,.1,.1],[.1,.1,.3,.1],[.1,.1,.1,.3]];
  renderMatrix();}
function randomize(){rules=Array.from({length:N},()=>Array.from({length:N},()=>+((Math.random()-.5)*2).toFixed(1)));renderMatrix();}
function reset(){createParticles();}

// Matrix UI — built with DOM (no innerHTML)
function renderMatrix(){
  const el=document.getElementById('matrix');el.replaceChildren();
  const tbl=document.createElement('table');tbl.style.borderCollapse='collapse';
  const hRow=document.createElement('tr');const empty=document.createElement('td');hRow.appendChild(empty);
  for(const s of SPECIES){const td=document.createElement('td');td.textContent=s.name;td.style.cssText='width:28px;text-align:center;font-weight:bold;color:'+s.color+';padding:2px';hRow.appendChild(td);}
  tbl.appendChild(hRow);
  for(let i=0;i<N;i++){const row=document.createElement('tr');
    const lbl=document.createElement('td');lbl.textContent=SPECIES[i].name;lbl.style.cssText='font-weight:bold;color:'+SPECIES[i].color+';padding:2px 4px';row.appendChild(lbl);
    for(let j=0;j<N;j++){const td=document.createElement('td');const v=rules[i][j];
      td.textContent=v.toFixed(1);td.style.cssText='width:28px;height:16px;text-align:center;cursor:pointer;border:1px solid rgba(255,255,255,.03);padding:2px;color:'+(v>0?'rgba(68,255,68,.6)':v<0?'rgba(255,68,68,.6)':'rgba(255,255,255,.2)');
      td.addEventListener('click',(()=>{const ci=i,cj=j;return()=>{rules[ci][cj]=+((rules[ci][cj]+.5)%2.5-1).toFixed(1);if(rules[ci][cj]>1.2)rules[ci][cj]=-1;renderMatrix();};})());
      row.appendChild(td);}
    tbl.appendChild(row);}
  el.appendChild(tbl);}
renderMatrix();

const RADIUS=80,FRICTION=.5,FORCE=.5;
function update(){
  for(const p of particles){let fx=0,fy=0;
    for(const q of particles){if(p===q)continue;
      let dx=q.x-p.x,dy=q.y-p.y;
      if(dx>W/2)dx-=W;if(dx<-W/2)dx+=W;if(dy>H/2)dy-=H;if(dy<-H/2)dy+=H;
      const d=Math.sqrt(dx*dx+dy*dy);if(d>RADIUS||d<1)continue;
      const rule=rules[p.sp][q.sp];
      const f=d<20?-1/(d*2):rule*(1-d/RADIUS)*FORCE;
      fx+=(dx/d)*f;fy+=(dy/d)*f;}
    p.vx=(p.vx+fx)*FRICTION;p.vy=(p.vy+fy)*FRICTION;
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x+=W;if(p.x>=W)p.x-=W;if(p.y<0)p.y+=H;if(p.y>=H)p.y-=H;}}

let _fc=0,_ft=0,_fps=0;
function anim(){requestAnimationFrame(anim);_fc++;_ft+=16;if(_ft>=1000){_fps=_fc;_fc=0;_ft=0;}
  X.fillStyle='rgba(8,8,16,.15)';X.fillRect(0,0,W,H);update();
  for(const p of particles){const s=SPECIES[p.sp];const spd=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
    X.globalAlpha=.04+spd*.02;X.fillStyle=s.color;X.beginPath();X.arc(p.x,p.y,4+spd*2,0,Math.PI*2);X.fill();
    X.globalAlpha=.6+spd*.2;X.beginPath();X.arc(p.x,p.y,1.5,0,Math.PI*2);X.fill();}
  X.globalAlpha=1;
  document.getElementById('info').textContent=COUNT+' PARTICLES · '+N+' SPECIES · '+_fps+' FPS · CLICK MATRIX TO EDIT';}
anim();
</script>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a>
</body>
</html>
