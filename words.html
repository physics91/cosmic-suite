<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Words</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000'/><text x='16' y='20' text-anchor='middle' fill='%23ff88aa' font-size='12' opacity='.6'>W</text></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#080810;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
    canvas{display:block}
    #inp{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);width:70%;max-width:500px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;outline:none;text-align:center;z-index:3;letter-spacing:1px}
    #inp::placeholder{color:rgba(255,255,255,.15)}
    #info{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.2);font-size:10px;letter-spacing:2px;z-index:2;pointer-events:none}
    #stats{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.1);font-size:8px;z-index:2;pointer-events:none;letter-spacing:1px}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">TYPE WORDS · THEY COME ALIVE · THEY INTERACT</div>
<input id="inp" placeholder="type a word and press enter..." autofocus>
<div id="stats"></div>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight;}
resize();addEventListener('resize',resize);

// Each word becomes a living entity with personality derived from its letters
let entities=[];

class WordEntity{
  constructor(word,x,y){
    this.word=word;this.x=x;this.y=y;this.vx=(Math.random()-.5)*2;this.vy=(Math.random()-.5)*2;
    // Personality from word content
    const code=word.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
    this.hue=code%360;this.mass=word.length;
    this.social=(code%3===0)?1:(code%3===1)?-1:0;// attracts, repels, or neutral
    this.energy=.5+word.length*.1;this.size=10+word.length*2;
    this.age=0;this.pulse=Math.random()*Math.PI*2;}

  interact(other){
    let dx=other.x-this.x,dy=other.y-this.y;
    const d=Math.sqrt(dx*dx+dy*dy)+1;if(d>300)return;
    // Words with similar letters attract
    const shared=this.word.split('').filter(c=>other.word.includes(c)).length;
    const affinity=(shared/Math.max(this.word.length,other.word.length))-.3;
    // Social personality modifies force
    const force=(affinity*this.social*.5+this.social*.1)*(1-d/300)/d;
    this.vx+=dx/d*force;this.vy+=dy/d*force;
    // Repel when too close
    if(d<this.size+other.size){this.vx-=dx/d*.3;this.vy-=dy/d*.3;}}

  update(){
    this.age++;this.pulse+=.03;this.x+=this.vx;this.y+=this.vy;
    this.vx*=.98;this.vy*=.98;
    // Bounce off walls softly
    if(this.x<this.size){this.x=this.size;this.vx*=-.5;}
    if(this.x>W-this.size){this.x=W-this.size;this.vx*=-.5;}
    if(this.y<this.size){this.y=this.size;this.vy*=-.5;}
    if(this.y>H-this.size-60){this.y=H-this.size-60;this.vy*=-.5;}}

  draw(c){
    const spd=Math.sqrt(this.vx*this.vx+this.vy*this.vy);
    const breathe=1+Math.sin(this.pulse)*.1;
    // Aura
    c.globalAlpha=.04+spd*.02;c.fillStyle=`hsl(${this.hue},50%,50%)`;
    c.beginPath();c.arc(this.x,this.y,this.size*2*breathe,0,Math.PI*2);c.fill();
    // Social indicator ring
    c.globalAlpha=.08;c.strokeStyle=this.social>0?'#44ff88':this.social<0?'#ff4444':'#888';
    c.lineWidth=1;c.beginPath();c.arc(this.x,this.y,this.size*1.5*breathe,0,Math.PI*2);c.stroke();
    // Word text
    c.globalAlpha=.5+spd*.1;c.fillStyle=`hsl(${this.hue},60%,70%)`;
    c.font=`${12+this.mass}px 'Segoe UI',sans-serif`;c.textAlign='center';c.textBaseline='middle';
    c.fillText(this.word,this.x,this.y);
    // Personality label
    c.globalAlpha=.1;c.font='7px sans-serif';
    c.fillText(this.social>0?'friendly':this.social<0?'shy':'neutral',this.x,this.y+this.size+8);}
}

// Input
document.getElementById('inp').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const val=e.target.value.trim();if(!val)return;
    const words=val.split(/\s+/);
    for(const w of words){if(w.length>0){
      entities.push(new WordEntity(w,W/2+(Math.random()-.5)*200,H/2+(Math.random()-.5)*200));
      // Sound
      try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
        o.frequency.value=200+w.length*50;o.type='sine';g.gain.setValueAtTime(.02,a.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.3);o.connect(g);g.connect(a.destination);
        o.start();o.stop(a.currentTime+.3);}catch(e){}}}
    e.target.value='';e.stopPropagation();}
  if(e.key==='Escape'){entities=[];}});

// Connection lines between interacting words
function drawConnections(c){
  for(let i=0;i<entities.length;i++){for(let j=i+1;j<entities.length;j++){
    const a=entities[i],b=entities[j];
    const dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d>200)continue;
    const shared=a.word.split('').filter(c2=>b.word.includes(c2)).length;
    if(shared<1)continue;
    c.globalAlpha=(1-d/200)*.06*shared;c.strokeStyle=`hsl(${(a.hue+b.hue)/2},50%,60%)`;
    c.lineWidth=.5+shared*.3;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();}}}

const bg=Array.from({length:80},()=>({x:Math.random()*3e3,y:Math.random()*3e3,s:Math.random(),p:Math.random()*Math.PI*2}));

function anim(){requestAnimationFrame(anim);
  X.fillStyle='rgba(8,8,16,.1)';X.fillRect(0,0,W,H);
  for(const s of bg){s.p+=.003;X.globalAlpha=.03+Math.sin(s.p)*.02;X.fillStyle='#fff';
    X.beginPath();X.arc(s.x%W,s.y%H,s.s,0,Math.PI*2);X.fill();}
  // Interactions
  for(const e of entities){for(const o of entities){if(e!==o)e.interact(o);}e.update();}
  drawConnections(X);
  for(const e of entities)e.draw(X);
  X.globalAlpha=1;
  const friendly=entities.filter(e=>e.social>0).length;
  const shy=entities.filter(e=>e.social<0).length;
  document.getElementById('stats').textContent=entities.length+' words · '+friendly+' friendly · '+shy+' shy · Esc to clear';}
anim();
addEventListener('keydown',e=>{if(e.key==='f'&&!e.target.closest('input'))document.documentElement.requestFullscreen().catch(()=>{});});
</script>
</body>
</html>
