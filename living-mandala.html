<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Mandala</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000'/><circle cx='16' cy='16' r='8' fill='none' stroke='%23ff88cc' stroke-width='.5'/><circle cx='16' cy='16' r='4' fill='none' stroke='%2388ccff' stroke-width='.5'/></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#060610;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;cursor:crosshair}
    canvas{display:block}
    #info{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.2);font-size:10px;letter-spacing:2px;z-index:2;pointer-events:none}
    #controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
    .btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);padding:5px 12px;border-radius:12px;cursor:pointer;font-size:10px;transition:all .2s}
    .btn:hover{background:rgba(255,255,255,.1);color:#fff}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">LIVING MANDALA · CLICK TO ADD LIFE</div>
<div id="controls">
  <button class="btn" onclick="symN=Math.max(3,symN-1)">- Fold</button>
  <button class="btn" onclick="symN=Math.min(24,symN+1)">+ Fold</button>
  <button class="btn" onclick="particles=[]">Clear</button>
  <button class="btn" onclick="burst()">Burst</button>
  <button class="btn" onclick="attract=!attract;this.textContent=attract?'Attract':'Repel'">Attract</button>
  <button class="btn" onclick="const l=document.createElement('a');l.download='living_mandala.png';l.href=C.toDataURL();l.click()">Save</button>
</div>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a><a id="random-jump" href="#" onclick="const e=['art.html','attractor.html','automata.html','beats.html','breathe.html','cellular-music.html','chat.html','clock.html','conway.html','dice.html','entropy.html','fourier.html','gravity-beats.html','gravity-well.html','harmonograph.html','index.html','interference.html','life.html','living-mandala.html','mandala.html','memory.html','music.html','neural.html','oracle.html','orbit.html','pendulum.html','puzzle.html','racer.html','reaction.html','rhythm.html','sandbox.html','scale.html','sonic-terrain.html','tarot.html','terrain.html','topology.html','type.html','words.html'];location.href=e[Math.random()*e.length|0];return false" style="position:fixed;top:12px;right:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">random &rarr;</a>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight;}
resize();addEventListener('resize',resize);

let particles=[],symN=8,attract=true;

class Mote{
  constructor(r,a){this.r=r;this.a=a;this.vr=0;this.va=(Math.random()-.5)*.01;
    this.hue=Math.random()*360;this.sz=1.5+Math.random()*2;}
  update(){
    // Attract/repel from center
    const centerForce=attract?.002:-.001;
    this.vr+=(100-this.r)*centerForce*.01;
    // Inter-particle forces (radial neighbors)
    for(const p of particles){if(p===this)continue;
      const dr=p.r-this.r,da=p.a-this.a;
      const d=Math.sqrt(dr*dr+(da*this.r)*(da*this.r))+1;
      if(d>80)continue;
      const f=d<15?-.01:.003/d;
      this.vr+=dr/d*f;this.va+=da*f*.1;}
    this.vr*=.96;this.va*=.96;
    this.r+=this.vr;this.a+=this.va;
    this.r=Math.max(10,Math.min(Math.min(W,H)*.45,this.r));}
}

function addAt(cx,cy){
  const dx=cx-W/2,dy=cy-H/2;
  const r=Math.sqrt(dx*dx+dy*dy);const a=Math.atan2(dy,dx);
  particles.push(new Mote(r,a));if(particles.length>300)particles.shift();}

function burst(){for(let i=0;i<30;i++){
  particles.push(new Mote(30+Math.random()*150,Math.random()*Math.PI*2/symN));}}

C.addEventListener('click',e=>addAt(e.clientX,e.clientY));
C.addEventListener('mousemove',e=>{if(e.buttons)addAt(e.clientX,e.clientY);});
C.addEventListener('touchstart',e=>{e.preventDefault();addAt(e.touches[0].clientX,e.touches[0].clientY);});
C.addEventListener('touchmove',e=>{e.preventDefault();addAt(e.touches[0].clientX,e.touches[0].clientY);});

function anim(){requestAnimationFrame(anim);
  X.fillStyle='rgba(6,6,16,.06)';X.fillRect(0,0,W,H);
  const cx=W/2,cy=H/2;
  // Update
  for(const p of particles)p.update();
  // Draw with symmetry
  for(const p of particles){
    for(let s=0;s<symN;s++){
      const angle=p.a+s*Math.PI*2/symN;
      const px=cx+Math.cos(angle)*p.r,py=cy+Math.sin(angle)*p.r;
      // Mirror
      const mx=cx+Math.cos(-angle)*p.r,my=cy+Math.sin(-angle)*p.r;
      const spd=Math.sqrt(p.vr*p.vr+p.va*p.va);
      X.globalAlpha=.15+spd*2;X.fillStyle=`hsl(${p.hue+p.r},60%,60%)`;
      X.beginPath();X.arc(px,py,p.sz,0,Math.PI*2);X.fill();
      X.beginPath();X.arc(mx,my,p.sz,0,Math.PI*2);X.fill();
      // Glow
      X.globalAlpha=.02+spd;X.beginPath();X.arc(px,py,p.sz*4,0,Math.PI*2);X.fill();}}
  // Center
  X.globalAlpha=.03;X.strokeStyle='#fff';X.lineWidth=.5;
  X.beginPath();X.arc(cx,cy,5,0,Math.PI*2);X.stroke();
  X.globalAlpha=1;
  document.getElementById('info').textContent=symN*2+'-fold · '+particles.length+' motes · '+(attract?'attract':'repel');}
anim();burst();
addEventListener('keydown',e=>{if(e.key==='f')document.documentElement.requestFullscreen().catch(()=>{});
  if(e.key===' '){e.preventDefault();burst();}if(e.key==='c')particles=[];});
</script>
<script>try{const _pc=new BroadcastChannel("cosmic-pulse");const _pn="living-mandala.html";setInterval(()=>_pc.postMessage({type:"pulse",href:_pn}),1000);}catch(e){}</script>
</body>
</html>
