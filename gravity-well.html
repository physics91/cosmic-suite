<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Well</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000'/><circle cx='16' cy='16' r='6' fill='none' stroke='%236644ff' stroke-width='1' opacity='.5'/><circle cx='16' cy='16' r='2' fill='%23fff' opacity='.3'/></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#020208;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;cursor:crosshair}
    canvas{display:block}
    #info{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.15);font-size:9px;letter-spacing:3px;z-index:2;pointer-events:none;text-align:center}
    #stats{position:fixed;bottom:16px;left:16px;color:rgba(255,255,255,.12);font-size:9px;z-index:2;pointer-events:none;font-family:monospace;line-height:1.8}
    #title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.015);font-size:100px;font-weight:100;letter-spacing:15px;pointer-events:none;z-index:1}
    .btn{position:fixed;z-index:20;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.3);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:9px;letter-spacing:1px}
    .btn:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
    .btn.active{background:rgba(100,68,255,.15);border-color:rgba(100,68,255,.3)}
  </style>
</head>
<body>
<div id="title">GRAVITY</div>
<div id="info">CLICK TO PLACE WELLS · DRAG FOR MASS · RIGHT-CLICK TO REMOVE · SCROLL FOR PHOTON DENSITY</div>
<div id="stats"></div>
<button class="btn" style="bottom:16px;right:16px" onclick="clearAll()">Clear</button>
<button class="btn active" style="bottom:16px;right:80px" id="btnGrid" onclick="toggleGrid()">Grid</button>
<button class="btn" style="bottom:16px;right:130px" onclick="toggleMode()"><span id="modeLabel">Lensing</span></button>
<button class="btn" style="bottom:40px;right:16px" onclick="presetBinary()">Binary</button>
<button class="btn" style="bottom:40px;right:80px" onclick="presetTriple()">Triple</button>
<button class="btn" style="bottom:40px;right:140px" onclick="presetCluster()">Cluster</button>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a><a id="random-jump" href="#" onclick="const e=['art.html','attractor.html','automata.html','beats.html','breathe.html','cellular-music.html','chat.html','clock.html','conway.html','dice.html','entropy.html','fourier.html','gravity-beats.html','gravity-well.html','harmonograph.html','index.html','interference.html','life.html','living-mandala.html','mandala.html','memory.html','music.html','neural.html','oracle.html','orbit.html','pendulum.html','puzzle.html','racer.html','reaction.html','rhythm.html','sandbox.html','scale.html','sonic-terrain.html','tarot.html','terrain.html','topology.html','type.html','words.html'];location.href=e[Math.random()*e.length|0];return false" style="position:fixed;top:12px;right:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">random &rarr;</a>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight;}
resize();addEventListener('resize',resize);

// === CONFIG ===
const MAX_PHOTONS=10000;
const TRAIL_LEN=30;
let photonDensity=500; // Default higher with WASM
let showGrid=true;
let mode='lensing';

// === GRAVITY WELLS (JS-side, few objects) ===
const wells=[];
class GravityWell{
  constructor(x,y,mass){
    this.x=x;this.y=y;this.mass=mass||50;
    this.targetMass=this.mass;
    this.pulsePhase=Math.random()*Math.PI*2;
    this.color=`hsl(${260+Math.random()*40},70%,50%)`;
    this.wasmIdx=-1; // attractor index in WASM
  }
}

// === ORBIT MODE (JS-side, separate from WASM photons) ===
const orbitParticles=[];
class OrbitParticle{
  constructor(x,y,vx,vy){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.trail=[];this.hue=Math.random()*360;this.life=1;
  }
}

function spawnOrbitRing(cx,cy,radius,count){
  for(let i=0;i<count;i++){
    const a=Math.PI*2*i/count;
    const x=cx+Math.cos(a)*radius;
    const y=cy+Math.sin(a)*radius;
    const speed=Math.sqrt(50*30/radius);
    orbitParticles.push(new OrbitParticle(x,y,-Math.sin(a)*speed,Math.cos(a)*speed));
  }
}

// === PHOTON DATA (SoA TypedArrays — WASM or JS fallback) ===
let photonCount=0;
// Per-photon rendering state (not in WASM)
let photonHue, photonCaptured, photonLife;
// Trail ring buffer (pre-allocated, no GC)
let trailX, trailY, trailHead;
// WASM views
let wasmPx, wasmPy, wasmVx, wasmVy;
let wasmReady=false;
let wasmExports=null;

// JS fallback arrays
let jsPx, jsPy, jsVx, jsVy;

function initPhotonArrays(n){
  photonHue=new Float32Array(n);
  photonCaptured=new Uint8Array(n);
  photonLife=new Float32Array(n);
  trailX=new Float32Array(n*TRAIL_LEN);
  trailY=new Float32Array(n*TRAIL_LEN);
  trailHead=new Int32Array(n);
  if(!wasmReady){
    jsPx=new Float32Array(n);
    jsPy=new Float32Array(n);
    jsVx=new Float32Array(n);
    jsVy=new Float32Array(n);
  }
}

function resetPhoton(i){
  const side=Math.random()*4|0;
  let x,y,vx,vy;
  if(side===0){x=0;y=Math.random()*H;vx=1;vy=(Math.random()-.5)*.3;}
  else if(side===1){x=W;y=Math.random()*H;vx=-1;vy=(Math.random()-.5)*.3;}
  else if(side===2){x=Math.random()*W;y=0;vx=(Math.random()-.5)*.3;vy=1;}
  else{x=Math.random()*W;y=H;vx=(Math.random()-.5)*.3;vy=-1;}
  const spd=2+Math.random();
  const len=Math.sqrt(vx*vx+vy*vy);
  vx=vx/len*spd;vy=vy/len*spd;

  const px=wasmReady?wasmPx:jsPx;
  const py=wasmReady?wasmPy:jsPy;
  const pvx=wasmReady?wasmVx:jsVx;
  const pvy=wasmReady?wasmVy:jsVy;
  px[i]=x;py[i]=y;pvx[i]=vx;pvy[i]=vy;

  photonHue[i]=200+Math.random()*60;
  photonCaptured[i]=0;
  photonLife[i]=1;
  trailHead[i]=0;
  // Clear trail
  const base=i*TRAIL_LEN;
  for(let t=0;t<TRAIL_LEN;t++){trailX[base+t]=x;trailY[base+t]=y;}
}

function setPhotonCount(n){
  n=Math.min(n,MAX_PHOTONS);
  if(wasmReady){
    // Add/remove particles in WASM
    const cur=wasmExports.nbody_get_count();
    if(n>cur){
      for(let i=cur;i<n;i++){
        const side=Math.random()*4|0;
        let x,y,vx,vy;
        if(side===0){x=0;y=Math.random()*H;vx=1;vy=(Math.random()-.5)*.3;}
        else if(side===1){x=W;y=Math.random()*H;vx=-1;vy=(Math.random()-.5)*.3;}
        else if(side===2){x=Math.random()*W;y=0;vx=(Math.random()-.5)*.3;vy=1;}
        else{x=Math.random()*W;y=H;vx=(Math.random()-.5)*.3;vy=-1;}
        const spd=2+Math.random(),len=Math.sqrt(vx*vx+vy*vy);
        vx=vx/len*spd;vy=vy/len*spd;
        wasmExports.nbody_add(x,y,vx,vy,0);
        photonHue[i]=200+Math.random()*60;
        photonCaptured[i]=0;
        photonLife[i]=1;
        trailHead[i]=0;
        const base=i*TRAIL_LEN;
        for(let t=0;t<TRAIL_LEN;t++){trailX[base+t]=x;trailY[base+t]=y;}
      }
    }
    // For removal, we just track photonCount and skip rendering beyond it
  } else {
    for(let i=photonCount;i<n;i++) resetPhoton(i);
  }
  photonCount=n;
}

let _wasmMem=null;
function refreshWasmViews(){
  if(!wasmExports||!_wasmMem)return;
  const buf=_wasmMem.buffer;
  wasmPx=new Float32Array(buf,wasmExports.nbody_get_px_ptr(),MAX_PHOTONS);
  wasmPy=new Float32Array(buf,wasmExports.nbody_get_py_ptr(),MAX_PHOTONS);
  wasmVx=new Float32Array(buf,wasmExports.nbody_get_vx_ptr(),MAX_PHOTONS);
  wasmVy=new Float32Array(buf,wasmExports.nbody_get_vy_ptr(),MAX_PHOTONS);
}

// === WASM LOADING ===
async function initWasm(){
  try{
    const resp=await WebAssembly.instantiateStreaming(fetch('./physics.wasm'),{
      env:{abort:()=>{}}
    });
    wasmExports=resp.instance.exports;
    _wasmMem=wasmExports.memory;

    // Init nbody with MAX_PHOTONS capacity
    wasmExports.nbody_init(MAX_PHOTONS,W,H);
    wasmExports.nbody_set_params(0,0,1.0,9999); // No particle-particle gravity, no damping
    wasmExports.nbody_set_speed_clamp(2.5); // Light speed
    wasmExports.nbody_set_attractor_softening(500);

    // Create TypedArray views over WASM memory
    refreshWasmViews();

    wasmReady=true;
    console.log('WASM physics loaded — max photons:',MAX_PHOTONS);

    // Spawn initial photons in WASM
    initPhotonArrays(MAX_PHOTONS);
    setPhotonCount(photonDensity);
  }catch(e){
    console.warn('WASM unavailable, using JS fallback:',e);
    initPhotonArrays(MAX_PHOTONS);
    setPhotonCount(photonDensity);
  }
}

// === JS FALLBACK PHYSICS ===
function stepPhysicsJS(dt){
  for(let i=0;i<photonCount;i++){
    let ax=0,ay=0;
    for(const w of wells){
      const dx=w.x-jsPx[i],dy=w.y-jsPy[i];
      const d2=dx*dx+dy*dy;
      const d=Math.sqrt(d2);
      if(d<Math.sqrt(w.mass)*1.5){
        if(!photonCaptured[i]){capturedCount++;playCapture();}
        photonCaptured[i]=1;photonLife[i]-=.05;
      }
      const f=w.mass*30/(d2+500);
      ax+=dx/d*f;ay+=dy/d*f;
    }
    jsVx[i]+=ax;jsVy[i]+=ay;
    const spd=Math.sqrt(jsVx[i]*jsVx[i]+jsVy[i]*jsVy[i]);
    const c=2.5;
    jsVx[i]=jsVx[i]/spd*c;jsVy[i]=jsVy[i]/spd*c;
    jsPx[i]+=jsVx[i];jsPy[i]+=jsVy[i];
    if(jsPx[i]<-50||jsPx[i]>W+50||jsPy[i]<-50||jsPy[i]>H+50||photonLife[i]<=0) resetPhoton(i);
  }
}

// === SPACETIME GRID ===
function drawGrid(){
  if(!showGrid)return;
  const spacing=40;
  X.strokeStyle='rgba(60,40,120,.08)';
  X.lineWidth=.5;
  for(let gx=0;gx<W;gx+=spacing){
    X.beginPath();
    for(let gy=0;gy<=H;gy+=4){
      let dx=0,dy=0;
      for(const w of wells){
        const wx=gx-w.x,wy=gy-w.y;
        const d2=wx*wx+wy*wy+1000;
        const f=w.mass*200/d2;
        dx-=wx/Math.sqrt(d2)*f;dy-=wy/Math.sqrt(d2)*f;
      }
      const px=gx+dx,py=gy+dy;
      gy===0?X.moveTo(px,py):X.lineTo(px,py);
    }
    X.stroke();
  }
  for(let gy=0;gy<H;gy+=spacing){
    X.beginPath();
    for(let gx=0;gx<=W;gx+=4){
      let dx=0,dy=0;
      for(const w of wells){
        const wx=gx-w.x,wy=gy-w.y;
        const d2=wx*wx+wy*wy+1000;
        const f=w.mass*200/d2;
        dx-=wx/Math.sqrt(d2)*f;dy-=wy/Math.sqrt(d2)*f;
      }
      X.lineTo(gx+dx,gy+dy);
    }
    X.stroke();
  }
}

// === INPUT ===
let dragStart=null,dragWell=null;
addEventListener('mousedown',e=>{
  if(e.button===2){
    let best=-1,bd=2500;
    for(let i=0;i<wells.length;i++){
      const dx=wells[i].x-e.clientX,dy=wells[i].y-e.clientY;
      const d=dx*dx+dy*dy;if(d<bd){bd=d;best=i;}
    }
    if(best>=0){
      if(wasmReady&&wells[best].wasmIdx>=0) wasmExports.nbody_remove_attractor(wells[best].wasmIdx);
      wells.splice(best,1);
      // Re-sync attractor indices
      syncAttractors();
    }
    return;
  }
  dragStart={x:e.clientX,y:e.clientY};
  const w=new GravityWell(e.clientX,e.clientY,10);
  wells.push(w);dragWell=w;
  if(wasmReady){
    w.wasmIdx=wasmExports.nbody_add_attractor(w.x,w.y,w.mass);
  }
  if(mode==='orbit')spawnOrbitRing(e.clientX,e.clientY,80,20);
});
addEventListener('mousemove',e=>{
  if(dragWell&&dragStart){
    const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;
    dragWell.targetMass=10+Math.sqrt(dx*dx+dy*dy)*1.5;
  }
});
addEventListener('mouseup',()=>{dragStart=null;dragWell=null;});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{
  e.preventDefault();
  photonDensity=Math.max(10,Math.min(MAX_PHOTONS,photonDensity+(e.deltaY>0?-50:50)));
  setPhotonCount(photonDensity);
},{passive:false});
addEventListener('keydown',e=>{
  if(e.key==='f')document.documentElement.requestFullscreen().catch(()=>{});
  if(e.key==='g')toggleGrid();
  if(e.key==='c')clearAll();
});

function syncAttractors(){
  if(!wasmReady)return;
  wasmExports.nbody_clear_attractors();
  for(const w of wells){
    w.wasmIdx=wasmExports.nbody_add_attractor(w.x,w.y,w.mass);
  }
}

function toggleGrid(){showGrid=!showGrid;document.getElementById('btnGrid').classList.toggle('active',showGrid);}
function toggleMode(){mode=mode==='lensing'?'orbit':'lensing';document.getElementById('modeLabel').textContent=mode==='lensing'?'Lensing':'Orbit';}
function clearAll(){wells.length=0;orbitParticles.length=0;if(wasmReady)wasmExports.nbody_clear_attractors();}
function presetBinary(){clearAll();wells.push(new GravityWell(W*.35,H*.5,80));wells.push(new GravityWell(W*.65,H*.5,80));syncAttractors();if(mode==='orbit'){spawnOrbitRing(W*.35,H*.5,60,15);spawnOrbitRing(W*.65,H*.5,60,15);}}
function presetTriple(){clearAll();for(let i=0;i<3;i++){const a=Math.PI*2*i/3-Math.PI/2;wells.push(new GravityWell(W/2+Math.cos(a)*150,H/2+Math.sin(a)*150,60));}syncAttractors();if(mode==='orbit')for(const w of wells)spawnOrbitRing(w.x,w.y,50,12);}
function presetCluster(){clearAll();for(let i=0;i<7;i++){wells.push(new GravityWell(W/2+(Math.random()-.5)*300,H/2+(Math.random()-.5)*300,20+Math.random()*60));}syncAttractors();}

// === AUDIO ===
let aC=null;
function initAudio(){
  try{aC=new(AudioContext||webkitAudioContext)();}catch(e){}
}
function playCapture(){
  if(!aC)initAudio();if(!aC)return;
  const t=aC.currentTime;
  const o=aC.createOscillator(),g=aC.createGain();
  o.type='sine';o.frequency.value=200+Math.random()*400;
  g.gain.setValueAtTime(.01,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);
  o.connect(g);g.connect(aC.destination);o.start(t);o.stop(t+.5);
}

// === RENDER ===
const bgStars=Array.from({length:120},()=>({x:Math.random()*4e3,y:Math.random()*4e3,s:Math.random(),a:Math.random()*Math.PI*2}));
let frame=0,capturedCount=0;

function anim(){requestAnimationFrame(anim);frame++;
  // Fade
  X.fillStyle='rgba(2,2,8,.12)';X.fillRect(0,0,W,H);

  // Background stars
  X.fillStyle='#fff';
  for(const s of bgStars){
    s.a+=.001;X.globalAlpha=.03+Math.sin(s.a)*.015;
    X.beginPath();X.arc(s.x%W,s.y%H,s.s*.8,0,Math.PI*2);X.fill();
  }
  X.globalAlpha=1;

  drawGrid();

  // Update wells (smooth mass transition + sync to WASM)
  for(const w of wells){
    w.mass+=(w.targetMass-w.mass)*.1;
    w.pulsePhase+=.03;
    if(wasmReady&&w.wasmIdx>=0) wasmExports.nbody_update_attractor(w.wasmIdx,w.x,w.y,w.mass);
    // Draw well
    const pulse=1+Math.sin(w.pulsePhase)*.1;
    const r=Math.sqrt(w.mass)*2;
    const grad=X.createRadialGradient(w.x,w.y,0,w.x,w.y,r*3*pulse);
    grad.addColorStop(0,'rgba(0,0,0,.9)');
    grad.addColorStop(.3,'rgba(40,20,80,.3)');
    grad.addColorStop(.7,'rgba(80,40,160,.05)');
    grad.addColorStop(1,'transparent');
    X.fillStyle=grad;
    X.beginPath();X.arc(w.x,w.y,r*3*pulse,0,Math.PI*2);X.fill();
    X.strokeStyle=w.color;X.lineWidth=1;X.globalAlpha=.15+Math.sin(w.pulsePhase*.5)*.05;
    X.beginPath();X.ellipse(w.x,w.y,r*2.5,r*.8,frame*.005,0,Math.PI*2);X.stroke();
    X.globalAlpha=.08;
    X.beginPath();X.ellipse(w.x,w.y,r*3,r*1.2,frame*.005+.3,0,Math.PI*2);X.stroke();
    X.globalAlpha=1;
    X.fillStyle='rgba(200,180,255,.08)';
    X.beginPath();X.arc(w.x,w.y,r*.3,0,Math.PI*2);X.fill();
  }

  // === PHOTON PHYSICS + RENDER ===
  if(mode==='lensing'){
    const px=wasmReady?wasmPx:jsPx;
    const py=wasmReady?wasmPy:jsPy;

    if(wasmReady){
      wasmExports.nbody_step(1.0);
      // Rebind views in case memory.grow occurred
      if(wasmPx.buffer.byteLength===0) refreshWasmViews();
      // Check captures + bounds (JS side, reading WASM memory)
      const count=Math.min(photonCount,wasmExports.nbody_get_count());
      for(let i=0;i<count;i++){
        // Capture detection
        for(const w of wells){
          const dx=w.x-px[i],dy=w.y-py[i];
          const d=Math.sqrt(dx*dx+dy*dy);
          if(d<Math.sqrt(w.mass)*1.5){
            if(!photonCaptured[i]){capturedCount++;playCapture();}
            photonCaptured[i]=1;photonLife[i]-=.05;
          }
        }
        // Bounds check
        if(px[i]<-50||px[i]>W+50||py[i]<-50||py[i]>H+50||photonLife[i]<=0){
          resetPhoton(i);
        }
        // Update trail ring buffer
        const head=trailHead[i];
        const base=i*TRAIL_LEN;
        trailX[base+head]=px[i];
        trailY[base+head]=py[i];
        trailHead[i]=(head+1)%TRAIL_LEN;
      }
    }else{
      stepPhysicsJS(1);
      for(let i=0;i<photonCount;i++){
        const head=trailHead[i];
        const base=i*TRAIL_LEN;
        trailX[base+head]=px[i];
        trailY[base+head]=py[i];
        trailHead[i]=(head+1)%TRAIL_LEN;
      }
    }

    // Render photons
    for(let i=0;i<photonCount;i++){
      const captured=photonCaptured[i];
      const base=i*TRAIL_LEN;
      const head=trailHead[i];

      // Draw trail
      X.strokeStyle=captured?'hsla(280,80%,60%,.3)':`hsla(${photonHue[i]|0},60%,70%,.15)`;
      X.lineWidth=captured?1.5:1;
      X.beginPath();
      let started=false;
      for(let t=0;t<TRAIL_LEN;t++){
        const idx=base+((head+t)%TRAIL_LEN);
        if(!started){X.moveTo(trailX[idx],trailY[idx]);started=true;}
        else X.lineTo(trailX[idx],trailY[idx]);
      }
      X.stroke();

      // Photon head
      X.globalAlpha=captured?.4:.2;
      X.fillStyle=captured?'#aa88ff':'#88bbff';
      X.beginPath();X.arc(px[i],py[i],captured?1.5:1,0,Math.PI*2);X.fill();
      X.globalAlpha=1;
    }
  }

  // Orbit mode (stays in JS, not WASM)
  if(mode==='orbit'){
    for(let i=orbitParticles.length-1;i>=0;i--){
      const p=orbitParticles[i];
      for(const w of wells){
        const dx=w.x-p.x,dy=w.y-p.y;
        const d2=dx*dx+dy*dy;
        const d=Math.sqrt(d2);
        const f=w.mass*30/(d2+200);
        p.vx+=dx/d*f;p.vy+=dy/d*f;
        if(d<Math.sqrt(w.mass)){p.life=0;}
      }
      p.x+=p.vx;p.y+=p.vy;
      p.trail.push({x:p.x,y:p.y});
      if(p.trail.length>60)p.trail.shift();
      if(p.x<-100||p.x>W+100||p.y<-100||p.y>H+100)p.life=0;
      if(p.life<=0){orbitParticles.splice(i,1);continue;}
      if(p.trail.length>1){
        X.strokeStyle=`hsla(${p.hue},60%,60%,.12)`;X.lineWidth=1;
        X.beginPath();
        for(let j=0;j<p.trail.length;j++){
          j===0?X.moveTo(p.trail[j].x,p.trail[j].y):X.lineTo(p.trail[j].x,p.trail[j].y);
        }
        X.stroke();
      }
      X.globalAlpha=.4;X.fillStyle=`hsl(${p.hue},60%,60%)`;
      X.beginPath();X.arc(p.x,p.y,1.5,0,Math.PI*2);X.fill();
      X.globalAlpha=1;
    }
  }

  // Stats
  document.getElementById('stats').textContent=
    `wells: ${wells.length}\nphotons: ${photonCount}${wasmReady?' (WASM)':' (JS)'}\ncaptured: ${capturedCount}\nmode: ${mode}`;
}

// Start
initWasm().then(()=>anim());
</script>
