<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Tarot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000'/><text x='16' y='22' text-anchor='middle' fill='%23ffcc44' font-size='18' opacity='.5'>☆</text></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#080810;overflow-x:hidden;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 20px}
    canvas{position:fixed;top:0;left:0;z-index:0;pointer-events:none}
    .content{position:relative;z-index:1;max-width:700px;width:100%;text-align:center}
    h1{color:rgba(255,255,255,.3);font-weight:100;font-size:18px;letter-spacing:8px;margin-bottom:20px}
    #spread{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:20px 0}
    .card{width:140px;height:220px;border-radius:12px;cursor:pointer;position:relative;transition:all .6s;transform-style:preserve-3d}
    .card.flipped{transform:rotateY(180deg)}
    .card-face{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:12px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
    .card-back{background:linear-gradient(135deg,rgba(40,20,60,.9),rgba(20,10,40,.9));border:1px solid rgba(255,200,100,.15)}
    .card-back .pattern{color:rgba(255,200,100,.2);font-size:40px}
    .card-front{background:linear-gradient(135deg,rgba(10,10,30,.95),rgba(20,15,40,.95));border:1px solid rgba(255,200,100,.2);transform:rotateY(180deg)}
    .card-front .symbol{font-size:48px;margin-bottom:8px}
    .card-front .name{color:rgba(255,200,100,.7);font-size:12px;letter-spacing:2px;margin-bottom:6px}
    .card-front .meaning{color:rgba(255,255,255,.35);font-size:10px;line-height:1.6;font-style:italic}
    #reading{color:rgba(255,255,255,.3);font-size:12px;line-height:2;max-width:500px;margin:20px auto;font-style:italic;min-height:60px}
    .btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);padding:8px 20px;border-radius:14px;cursor:pointer;font-size:11px;transition:all .2s;margin-top:10px}
    .btn:hover{background:rgba(255,255,255,.1);color:#fff}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div class="content">
  <h1>COSMIC TAROT</h1>
  <div id="spread"></div>
  <div id="reading">Click the cards to reveal your cosmic reading.</div>
  <button class="btn" onclick="newReading()">New Reading</button>
</div>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a><a id="random-jump" href="#" onclick="const e=['art.html','attractor.html','automata.html','beats.html','breathe.html','cellular-music.html','chat.html','clock.html','conway.html','dice.html','entropy.html','fourier.html','gravity-beats.html','gravity-well.html','harmonograph.html','index.html','interference.html','life.html','living-mandala.html','mandala.html','memory.html','music.html','neural.html','oracle.html','orbit.html','pendulum.html','puzzle.html','racer.html','reaction.html','rhythm.html','sandbox.html','scale.html','sonic-terrain.html','tarot.html','terrain.html','topology.html','type.html','words.html'];location.href=e[Math.random()*e.length|0];return false" style="position:fixed;top:12px;right:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">random &rarr;</a>
<script>
const CARDS=[
  {symbol:'☀',name:'THE STAR',meanings:['Hope illuminates your path','A new beginning burns bright','The universe conspires in your favor']},
  {symbol:'🌙',name:'THE MOON',meanings:['Trust your intuition','Something hidden will be revealed','The unconscious speaks — listen']},
  {symbol:'⚡',name:'THE BOLT',meanings:['Sudden change approaches','Destruction clears space for creation','Embrace the unexpected']},
  {symbol:'🌊',name:'THE TIDE',meanings:['Go with the flow','Emotions run deep — let them','What ebbs will return']},
  {symbol:'🔥',name:'THE FLAME',meanings:['Passion ignites within you','Transform what no longer serves','Your energy is your greatest gift']},
  {symbol:'💎',name:'THE CRYSTAL',meanings:['Clarity comes through stillness','The answer is already within you','Patience reveals what rushing conceals']},
  {symbol:'🌀',name:'THE SPIRAL',meanings:['Growth is never linear','You are exactly where you need to be','The pattern repeats at a higher level']},
  {symbol:'🕳',name:'THE VOID',meanings:['In emptiness, find potential','Release attachment to outcome','The void is not nothing — it is everything waiting']},
  {symbol:'🌱',name:'THE SEED',meanings:['Something new is germinating','Plant intentions, not expectations','Small beginnings lead to vast forests']},
  {symbol:'⚖',name:'THE BALANCE',meanings:['Harmony requires both sides','Neither too much nor too little','Find the center between extremes']},
  {symbol:'🪞',name:'THE MIRROR',meanings:['What you see in others exists in you','Self-reflection precedes self-knowledge','The universe reflects your inner state']},
  {symbol:'∞',name:'THE INFINITE',meanings:['There are no endings, only transitions','You are part of something much larger','Every moment contains eternity']},
  {symbol:'🗝',name:'THE KEY',meanings:['The door you seek is already open','Knowledge unlocks fear','You hold the answer you\'ve been searching for']},
  {symbol:'🦋',name:'THE CHANGE',meanings:['Metamorphosis is underway','Let go of who you were','Beauty emerges from surrender']},
  {symbol:'⭐',name:'THE GUIDE',meanings:['Follow what makes you feel alive','A mentor appears when the student is ready','Your north star knows the way']},
];

const POSITIONS=['PAST','PRESENT','FUTURE'];
const CONNECTORS=['This journey began with','In this moment, you carry','What awaits is'];

let spread=[];

function newReading(){
  const el=document.getElementById('spread');el.replaceChildren();
  spread=[];document.getElementById('reading').textContent='Click the cards to reveal your cosmic reading.';
  // Pick 3 random unique cards
  const deck=[...CARDS];
  for(let i=0;i<3;i++){
    const idx=Math.random()*deck.length|0;const card=deck.splice(idx,1)[0];
    spread.push({...card,revealed:false,meaning:card.meanings[Math.random()*card.meanings.length|0]});
    // Create card DOM
    const div=document.createElement('div');div.className='card';div.dataset.idx=i;
    div.addEventListener('click',()=>revealCard(i));
    const back=document.createElement('div');back.className='card-face card-back';
    const pattern=document.createElement('div');pattern.className='pattern';pattern.textContent='✦';
    const pos=document.createElement('div');pos.style.cssText='color:rgba(255,200,100,.3);font-size:9px;letter-spacing:2px;margin-top:10px';
    pos.textContent=POSITIONS[i];back.appendChild(pattern);back.appendChild(pos);
    const front=document.createElement('div');front.className='card-face card-front';
    const sym=document.createElement('div');sym.className='symbol';sym.textContent=card.symbol;
    const name=document.createElement('div');name.className='name';name.textContent=card.name;
    const mean=document.createElement('div');mean.className='meaning';mean.textContent=spread[i].meaning;
    front.appendChild(sym);front.appendChild(name);front.appendChild(mean);
    div.appendChild(back);div.appendChild(front);el.appendChild(div);}}

function revealCard(idx){
  if(spread[idx].revealed)return;spread[idx].revealed=true;
  document.querySelectorAll('.card')[idx].classList.add('flipped');
  // Sound
  try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
    o.frequency.value=300+idx*100;o.type='sine';g.gain.setValueAtTime(.03,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.5);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.5);}catch(e){}
  // Build reading
  const revealed=spread.filter(s=>s.revealed);
  let text='';for(let i=0;i<revealed.length;i++){
    const s=spread.findIndex(c=>c===revealed[i]);
    text+=(text?'\n\n':'')+CONNECTORS[s]+' '+revealed[i].name+' — '+revealed[i].meaning+'.';}
  if(revealed.length===3)text+='\n\nThe cosmos has spoken. Listen with your whole being.';
  document.getElementById('reading').textContent=text;}

// Background
const C=document.getElementById('c'),X=C.getContext('2d');
function resize(){C.width=innerWidth;C.height=innerHeight;}resize();addEventListener('resize',resize);
const stars=Array.from({length:80},()=>({x:Math.random()*3e3,y:Math.random()*3e3,s:Math.random(),p:Math.random()*Math.PI*2}));
function anim(){requestAnimationFrame(anim);X.fillStyle='rgba(8,8,16,.05)';X.fillRect(0,0,C.width,C.height);
  for(const s of stars){s.p+=.003;X.globalAlpha=.04+Math.sin(s.p)*.02;X.fillStyle='#fff';
    X.beginPath();X.arc(s.x%C.width,s.y%C.height,s.s,0,Math.PI*2);X.fill();}X.globalAlpha=1;}
anim();newReading();
addEventListener('keydown',e=>{if(e.key==='f')document.documentElement.requestFullscreen().catch(()=>{});
  if(e.key==='n')newReading();});
</script>
<script>try{const _pc=new BroadcastChannel("cosmic-pulse");const _pn="tarot.html";setInterval(()=>_pc.postMessage({type:"pulse",href:_pn}),1000);}catch(e){}</script>
</body>
</html>
