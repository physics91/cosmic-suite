<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendulum</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000'/><line x1='16' y1='8' x2='20' y2='20' stroke='%23ffaa44' stroke-width='1' opacity='.5'/><circle cx='20' cy='20' r='2' fill='%23ffaa44' opacity='.5'/></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#040408;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
    canvas{display:block}
    #info{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.12);font-size:9px;letter-spacing:3px;z-index:2;pointer-events:none;text-align:center}
    #stats{position:fixed;bottom:16px;left:16px;color:rgba(255,255,255,.08);font-size:8px;z-index:2;pointer-events:none;font-family:monospace;line-height:1.8}
    .btn{position:fixed;z-index:20;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.3);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:9px;letter-spacing:1px}
    .btn:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
    .btn.active{background:rgba(255,170,68,.1);border-color:rgba(255,170,68,.3)}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">DOUBLE PENDULUM &middot; CHAOS IN MOTION &middot; CLICK TO RESET WITH PERTURBATION</div>
<div id="stats"></div>
<button class="btn" style="bottom:16px;right:16px" onclick="resetAll()">Reset</button>
<button class="btn" style="bottom:16px;right:75px" onclick="addPendulum()">+Pendulum</button>
<button class="btn" style="bottom:16px;right:165px" onclick="clearTrails()">Clear Trails</button>
<button class="btn" style="bottom:16px;right:255px" onclick="toggleTriple()"><span id="triLabel">Double</span></button>
<button class="btn" style="bottom:40px;right:16px" onclick="speed=speed>=4?1:speed*2;this.textContent='Speed '+speed+'x'">Speed 1x</button>
<button class="btn active" style="bottom:40px;right:100px" id="btnTrail" onclick="showTrail=!showTrail;this.classList.toggle('active')">Trails</button>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight;}
resize();addEventListener('resize',resize);

const G=9.81,DT=.01;
let pendulums=[],showTrail=true,speed=1,isTriple=false,time=0;

class DoublePendulum{
  constructor(a1,a2,a3){
    this.L1=120;this.L2=100;this.L3=80;
    this.m1=10;this.m2=10;this.m3=8;
    this.a1=a1;this.a2=a2;this.a3=a3||0;
    this.v1=0;this.v2=0;this.v3=0;
    this.trail=[];
    this.hue=Math.random()*360;
    this.triple=isTriple;
  }
  step(){
    const{L1,L2,m1,m2,a1,a2,v1,v2}=this;
    // RK4-ish double pendulum equations
    const da=a1-a2;
    const den1=2*m1+m2-m2*Math.cos(2*da);
    const acc1=(-G*(2*m1+m2)*Math.sin(a1)-m2*G*Math.sin(a1-2*a2)-2*Math.sin(da)*m2*(v2*v2*L2+v1*v1*L1*Math.cos(da)))/(L1*den1);
    const acc2=(2*Math.sin(da)*(v1*v1*L1*(m1+m2)+G*(m1+m2)*Math.cos(a1)+v2*v2*L2*m2*Math.cos(da)))/(L2*den1);
    this.v1+=acc1*DT;this.v2+=acc2*DT;
    this.v1*=.9999;this.v2*=.9999; // tiny damping
    this.a1+=this.v1*DT;this.a2+=this.v2*DT;

    if(this.triple){
      // Third segment — simplified
      const da2=this.a2-this.a3;
      const acc3=(2*Math.sin(da2)*(this.v2*this.v2*L2*(m1+m2)+G*(m1+m2)*Math.cos(this.a2)))/(this.L3*(2*m1+this.m3));
      this.v3+=acc3*DT;this.v3*=.9999;
      this.a3+=this.v3*DT;
    }

    // Trail point — tip position
    const tip=this.getTip();
    this.trail.push({x:tip.x,y:tip.y});
    if(this.trail.length>2000)this.trail.shift();
  }
  getPoints(){
    const cx=W/2,cy=H*.35;
    const x1=cx+this.L1*Math.sin(this.a1);
    const y1=cy+this.L1*Math.cos(this.a1);
    const x2=x1+this.L2*Math.sin(this.a2);
    const y2=y1+this.L2*Math.cos(this.a2);
    let x3=x2,y3=y2;
    if(this.triple){
      x3=x2+this.L3*Math.sin(this.a3);
      y3=y2+this.L3*Math.cos(this.a3);
    }
    return{cx,cy,x1,y1,x2,y2,x3,y3};
  }
  getTip(){
    const p=this.getPoints();
    return this.triple?{x:p.x3,y:p.y3}:{x:p.x2,y:p.y2};
  }
}

function addPendulum(){
  const base=pendulums.length>0?pendulums[0].a1:Math.PI*.75;
  const base2=pendulums.length>0?pendulums[0].a2:Math.PI*.5;
  const base3=pendulums.length>0?(pendulums[0].a3||Math.PI*.3):Math.PI*.3;
  // Tiny perturbation
  const p=new DoublePendulum(
    base+.001*(pendulums.length+1),
    base2+.0005*(pendulums.length+1),
    base3+.001*(pendulums.length+1)
  );
  pendulums.push(p);
}

function resetAll(){
  pendulums=[];
  const a1=Math.PI*.5+Math.random()*Math.PI*.5;
  const a2=Math.PI*.3+Math.random()*Math.PI*.4;
  const a3=Math.PI*.2+Math.random()*Math.PI*.3;
  for(let i=0;i<3;i++){
    const p=new DoublePendulum(a1+.001*i,a2+.0005*i,a3+.001*i);
    pendulums.push(p);
  }
}

function clearTrails(){for(const p of pendulums)p.trail=[];}

function toggleTriple(){
  isTriple=!isTriple;
  document.getElementById('triLabel').textContent=isTriple?'Triple':'Double';
  resetAll();
  for(const p of pendulums)p.triple=isTriple;
}

// Init with 3 nearly-identical pendulums
resetAll();

addEventListener('click',e=>{
  if(e.target.closest('.btn,a'))return;
  resetAll();
});

addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();resetAll();}
  if(e.key==='f')document.documentElement.requestFullscreen().catch(()=>{});
  if(e.key==='t')clearTrails();
  if(e.key==='+')addPendulum();
});

// === RENDER ===
const bgStars=Array.from({length:60},()=>({x:Math.random()*3e3,y:Math.random()*3e3,s:Math.random(),p:Math.random()*Math.PI*2}));

function anim(){requestAnimationFrame(anim);time+=DT;
  // Step
  for(let s=0;s<speed;s++)for(const p of pendulums)p.step();

  X.fillStyle='rgba(4,4,8,.06)';X.fillRect(0,0,W,H);

  // Stars
  for(const s of bgStars){s.p+=.002;X.globalAlpha=.03+Math.sin(s.p)*.01;X.fillStyle='#fff';
    X.beginPath();X.arc(s.x%W,s.y%H,s.s,0,Math.PI*2);X.fill();}

  // Trails
  if(showTrail){
    for(const p of pendulums){
      if(p.trail.length<2)continue;
      X.strokeStyle='hsla('+p.hue+',70%,60%,.15)';X.lineWidth=1;
      X.beginPath();
      for(let i=0;i<p.trail.length;i++){
        const t=p.trail[i];
        i===0?X.moveTo(t.x,t.y):X.lineTo(t.x,t.y);
      }
      X.stroke();
      // Recent trail brighter
      if(p.trail.length>10){
        X.strokeStyle='hsla('+p.hue+',80%,70%,.4)';X.lineWidth=1.5;
        X.beginPath();
        const start=Math.max(0,p.trail.length-50);
        for(let i=start;i<p.trail.length;i++){
          const t=p.trail[i];
          i===start?X.moveTo(t.x,t.y):X.lineTo(t.x,t.y);
        }
        X.stroke();
      }
    }
  }

  // Pendulum arms
  for(const p of pendulums){
    const pts=p.getPoints();
    X.globalAlpha=.3;X.strokeStyle='hsla('+p.hue+',50%,60%,.5)';X.lineWidth=2;
    X.beginPath();X.moveTo(pts.cx,pts.cy);X.lineTo(pts.x1,pts.y1);X.lineTo(pts.x2,pts.y2);
    if(p.triple)X.lineTo(pts.x3,pts.y3);
    X.stroke();
    // Joints
    X.globalAlpha=.5;X.fillStyle='hsl('+p.hue+',60%,60%)';
    X.beginPath();X.arc(pts.x1,pts.y1,4,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(pts.x2,pts.y2,5,0,Math.PI*2);X.fill();
    if(p.triple){X.beginPath();X.arc(pts.x3,pts.y3,4,0,Math.PI*2);X.fill();}
    // Tip glow
    const tip=p.getTip();
    X.globalAlpha=.1;
    X.beginPath();X.arc(tip.x,tip.y,12,0,Math.PI*2);X.fill();
  }

  // Pivot
  X.globalAlpha=.15;X.fillStyle='#fff';
  X.beginPath();X.arc(W/2,H*.35,3,0,Math.PI*2);X.fill();

  X.globalAlpha=1;
  // Divergence measure
  let maxDiv=0;
  if(pendulums.length>1){
    const t0=pendulums[0].getTip();
    for(let i=1;i<pendulums.length;i++){
      const ti=pendulums[i].getTip();
      const d=Math.sqrt((t0.x-ti.x)**2+(t0.y-ti.y)**2);
      if(d>maxDiv)maxDiv=d;
    }
  }
  document.getElementById('stats').textContent=
    'pendulums: '+pendulums.length+'\n'+(isTriple?'triple':'double')+
    '\ndivergence: '+maxDiv.toFixed(1)+'px\ntime: '+time.toFixed(1)+'s'+
    '\nspeed: '+speed+'x';
}
anim();
</script>
<script>try{const _pc=new BroadcastChannel("cosmic-pulse");const _pn="pendulum.html";setInterval(()=>_pc.postMessage({type:"pulse",href:_pn}),1000);}catch(e){}</script>
</body>
</html>
