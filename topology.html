<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topology</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000'/><ellipse cx='16' cy='16' rx='8' ry='4' fill='none' stroke='%23ff88aa' stroke-width='.8' opacity='.5' transform='rotate(30 16 16)'/></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#040410;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;cursor:grab}
    body.dragging{cursor:grabbing}
    canvas{display:block}
    #info{position:fixed;top:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.15);font-size:9px;letter-spacing:3px;z-index:2;pointer-events:none;text-align:center}
    #shape-name{position:fixed;top:44px;left:50%;transform:translateX(-50%);color:rgba(255,180,220,.25);font-size:14px;letter-spacing:5px;font-weight:200;z-index:2;pointer-events:none}
    #desc{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.1);font-size:10px;letter-spacing:1px;z-index:2;pointer-events:none;max-width:400px;text-align:center;line-height:1.8}
    .btn{position:fixed;z-index:20;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.3);padding:5px 12px;border-radius:8px;cursor:pointer;font-size:9px;letter-spacing:1px}
    .btn:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
    .btn.active{background:rgba(255,136,170,.1);border-color:rgba(255,136,170,.3)}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">DRAG TO ROTATE &middot; SCROLL TO ZOOM &middot; CLICK BUTTONS TO CHANGE SHAPE</div>
<div id="shape-name">TORUS</div>
<div id="desc"></div>
<button class="btn active" style="bottom:16px;right:16px" onclick="setShape(0)">Torus</button>
<button class="btn" style="bottom:16px;right:80px" onclick="setShape(1)">M&ouml;bius</button>
<button class="btn" style="bottom:16px;right:150px" onclick="setShape(2)">Klein</button>
<button class="btn" style="bottom:16px;right:205px" onclick="setShape(3)">Trefoil</button>
<button class="btn" style="bottom:16px;right:270px" onclick="setShape(4)">Sphere</button>
<button class="btn" style="bottom:16px;right:335px" onclick="setShape(5)">Boy</button>
<button class="btn" style="bottom:40px;right:16px" id="btnAuto" onclick="autoRotate=!autoRotate;this.classList.toggle('active')">Auto Rotate</button>
<button class="btn" style="bottom:40px;right:115px" onclick="wireframe=!wireframe;this.classList.toggle('active')">Solid</button>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight;}
resize();addEventListener('resize',resize);

// === 3D MATH ===
function rotX(p,a){const c=Math.cos(a),s=Math.sin(a);return[p[0],p[1]*c-p[2]*s,p[1]*s+p[2]*c];}
function rotY(p,a){const c=Math.cos(a),s=Math.sin(a);return[p[0]*c+p[2]*s,p[1],-p[0]*s+p[2]*c];}
function rotZ(p,a){const c=Math.cos(a),s=Math.sin(a);return[p[0]*c-p[1]*s,p[0]*s+p[1]*c,p[2]];}

function project(p,zoom){
  const d=5+p[2]*zoom*.3;
  const scale=300*zoom/d;
  return[W/2+p[0]*scale,H/2-p[1]*scale,d];
}

// === SHAPES ===
const SHAPES=[
  {name:'TORUS',desc:'A donut. Genus 1. The simplest surface with a hole.',
    gen:(u,v)=>{const R=1,r=.4;return[(R+r*Math.cos(v))*Math.cos(u),(R+r*Math.cos(v))*Math.sin(u),r*Math.sin(v)];}},
  {name:'M\u00d6BIUS STRIP',desc:'One side. One edge. A surface that defies orientation.',
    gen:(u,v)=>{const w=v-.5;return[(1+w*.5*Math.cos(u/2))*Math.cos(u),(1+w*.5*Math.cos(u/2))*Math.sin(u),w*.5*Math.sin(u/2)];}},
  {name:'KLEIN BOTTLE',desc:'No inside, no outside. A closed surface with no boundary that cannot exist in 3D without self-intersection.',
    gen:(u,v)=>{const r=4*(1-Math.cos(u)/2);let x,y,z;
      if(u<Math.PI){x=6*Math.cos(u)*(1+Math.sin(u))+r*Math.cos(u)*Math.cos(v);y=16*Math.sin(u)+r*Math.sin(u)*Math.cos(v);}
      else{x=6*Math.cos(u)*(1+Math.sin(u))+r*Math.cos(v+Math.PI);y=16*Math.sin(u);}
      z=r*Math.sin(v);return[x*.06,y*.06-1,z*.06];}},
  {name:'TREFOIL KNOT',desc:'The simplest non-trivial knot. It cannot be untied without cutting.',
    gen:(u,v)=>{const r=.3;const x=Math.sin(u)+2*Math.sin(2*u);const y=Math.cos(u)-2*Math.cos(2*u);const z=-Math.sin(3*u);
      const dx=Math.cos(u)+4*Math.cos(2*u),dy=-Math.sin(u)+4*Math.sin(2*u),dz=-3*Math.cos(3*u);
      const len=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
      const nx=-dz*dy/len+dy*dz/len,ny=dz*dx/len-dx*dz/len,nz=dx*dy/len-dy*dx/len;
      const nlen=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
      const bx=(dy*(dz/len)-dz*(dy/len)),by=(dz*(dx/len)-dx*(dz/len)),bz=(dx*(dy/len)-dy*(dx/len));
      const blen=Math.sqrt(bx*bx+by*by+bz*bz)||1;
      return[(x+r*(Math.cos(v)*nx/nlen+Math.sin(v)*bx/blen))*.3,
             (y+r*(Math.cos(v)*ny/nlen+Math.sin(v)*by/blen))*.3,
             (z+r*(Math.cos(v)*nz/nlen+Math.sin(v)*bz/blen))*.3];}},
  {name:'SPHERE',desc:'The most perfect shape. Every point equidistant from center. Genus 0.',
    gen:(u,v)=>{return[Math.sin(v)*Math.cos(u),Math.sin(v)*Math.sin(u),Math.cos(v)];}},
  {name:'BOY SURFACE',desc:'An immersion of the real projective plane in 3D. Named after Werner Boy, 1901.',
    gen:(u,v)=>{const c1=Math.cos(u),s1=Math.sin(u),c2=Math.cos(v),s2=Math.sin(v);
      const sq2=Math.sqrt(2);
      const d=2-sq2*s2*Math.sin(3*u);
      return[(sq2*c2*c2*Math.cos(2*u)+c1*s2)/(d)*.8,
             (sq2*c2*c2*Math.sin(2*u)-s1*s2)/(d)*.8,
             (3*c2*c2)/(d)*.8-1];}},
];

let currentShape=0,rxAngle=.3,ryAngle=0,zoom=1,autoRotate=true,wireframe=true;
let time=0;

function setShape(i){
  currentShape=i;
  document.getElementById('shape-name').textContent=SHAPES[i].name;
  document.getElementById('desc').textContent=SHAPES[i].desc;
  document.querySelectorAll('.btn').forEach((b,idx)=>{if(idx<6)b.classList.toggle('active',idx===i);});
}
setShape(0);

// === INPUT ===
let dragging=false,lastMX=0,lastMY=0;
C.addEventListener('mousedown',e=>{dragging=true;lastMX=e.clientX;lastMY=e.clientY;document.body.classList.add('dragging');});
addEventListener('mousemove',e=>{if(!dragging)return;
  ryAngle+=(e.clientX-lastMX)*.005;rxAngle+=(e.clientY-lastMY)*.005;
  lastMX=e.clientX;lastMY=e.clientY;});
addEventListener('mouseup',()=>{dragging=false;document.body.classList.remove('dragging');});
addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.3,Math.min(3,zoom+(e.deltaY>0?-.1:.1)));},{passive:false});
// Touch
let touchDist=0;
C.addEventListener('touchstart',e=>{
  if(e.touches.length===1){dragging=true;lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY;}
  if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;touchDist=Math.sqrt(dx*dx+dy*dy);}
},{passive:true});
C.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&dragging){ryAngle+=(e.touches[0].clientX-lastMX)*.005;rxAngle+=(e.touches[0].clientY-lastMY)*.005;lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY;}
  if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;const d=Math.sqrt(dx*dx+dy*dy);zoom=Math.max(.3,Math.min(3,zoom+(d-touchDist)*.005));touchDist=d;}
},{passive:true});
C.addEventListener('touchend',()=>{dragging=false;});
addEventListener('keydown',e=>{
  if(e.key==='f')document.documentElement.requestFullscreen().catch(()=>{});
  if(e.key===' '){e.preventDefault();autoRotate=!autoRotate;document.getElementById('btnAuto').classList.toggle('active');}
  if(e.key==='ArrowRight')setShape((currentShape+1)%SHAPES.length);
  if(e.key==='ArrowLeft')setShape((currentShape+SHAPES.length-1)%SHAPES.length);
});

// === RENDER ===
const bgStars=Array.from({length:80},()=>({x:Math.random()*3e3,y:Math.random()*3e3,s:Math.random(),p:Math.random()*Math.PI*2}));

function anim(){requestAnimationFrame(anim);time+=.016;
  if(autoRotate&&!dragging){ryAngle+=.008;rxAngle+=.002;}

  X.fillStyle='rgba(4,4,16,.12)';X.fillRect(0,0,W,H);

  // Stars
  for(const s of bgStars){s.p+=.002;X.globalAlpha=.03+Math.sin(s.p)*.015;X.fillStyle='#fff';
    X.beginPath();X.arc(s.x%W,s.y%H,s.s,0,Math.PI*2);X.fill();}

  const shape=SHAPES[currentShape];
  const uSteps=60,vSteps=30;
  const uMax=currentShape===1?Math.PI*2:Math.PI*2; // Mobius needs full 2pi
  const vMax=currentShape===4?Math.PI:Math.PI*2; // Sphere v goes 0-pi

  // Generate mesh
  const lines=[];
  for(let ui=0;ui<=uSteps;ui++){
    for(let vi=0;vi<=vSteps;vi++){
      const u=ui/uSteps*uMax;
      const v=vi/vSteps*vMax;
      let p=shape.gen(u,v);
      p=rotX(p,rxAngle);p=rotY(p,ryAngle);
      const sp=project(p,zoom);

      // Horizontal lines
      if(vi<vSteps){
        const v2=(vi+1)/vSteps*vMax;
        let p2=shape.gen(u,v2);
        p2=rotX(p2,rxAngle);p2=rotY(p2,ryAngle);
        const sp2=project(p2,zoom);
        lines.push({x1:sp[0],y1:sp[1],x2:sp2[0],y2:sp2[1],z:(sp[2]+sp2[2])/2});
      }
      // Vertical lines
      if(ui<uSteps){
        const u2=(ui+1)/uSteps*uMax;
        let p2=shape.gen(u2,v);
        p2=rotX(p2,rxAngle);p2=rotY(p2,ryAngle);
        const sp2=project(p2,zoom);
        lines.push({x1:sp[0],y1:sp[1],x2:sp2[0],y2:sp2[1],z:(sp[2]+sp2[2])/2});
      }
    }
  }

  // Sort by depth (back to front)
  lines.sort((a,b)=>b.z-a.z);

  // Draw
  for(const l of lines){
    const depth=Math.max(0,Math.min(1,(l.z-2)/6));
    if(wireframe){
      X.globalAlpha=.04+depth*.12;
      const hue=200+depth*80+Math.sin(time+l.z)*.5*20;
      X.strokeStyle='hsl('+hue+',60%,'+(40+depth*30)+'%)';
      X.lineWidth=.3+depth*.5;
    }else{
      X.globalAlpha=.02+depth*.08;
      X.strokeStyle='hsl('+(280+depth*60)+',50%,'+(30+depth*20)+'%)';
      X.lineWidth=.5+depth;
    }
    X.beginPath();X.moveTo(l.x1,l.y1);X.lineTo(l.x2,l.y2);X.stroke();
  }

  X.globalAlpha=1;
}
anim();
</script>
<script>try{const _pc=new BroadcastChannel("cosmic-pulse");const _pn="topology.html";setInterval(()=>_pc.postMessage({type:"pulse",href:_pn}),1000);}catch(e){}</script>
</body>
</html>
