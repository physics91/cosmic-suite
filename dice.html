<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Dice</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000'/><text x='16' y='22' text-anchor='middle' fill='%23ffaa44' font-size='16' opacity='.5'>⬡</text></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#060610;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
    canvas{position:fixed;top:0;left:0;z-index:0;pointer-events:none}
    #dice{position:relative;z-index:2;font-size:120px;transition:transform .8s cubic-bezier(.2,.8,.3,1.2);user-select:none}
    #dice.roll{animation:tumble .8s}
    @keyframes tumble{0%{transform:rotate(0) scale(1)}25%{transform:rotate(180deg) scale(.6)}50%{transform:rotate(360deg) scale(1.2)}75%{transform:rotate(540deg) scale(.9)}100%{transform:rotate(720deg) scale(1)}}
    #result{position:relative;z-index:2;color:rgba(255,255,255,.5);font-size:16px;font-weight:200;letter-spacing:3px;margin-top:20px;text-align:center;max-width:400px;line-height:1.8;min-height:60px}
    #name{position:relative;z-index:2;color:rgba(255,200,100,.6);font-size:12px;letter-spacing:4px;margin-top:8px}
    h1{position:relative;z-index:2;color:rgba(255,255,255,.15);font-weight:100;font-size:14px;letter-spacing:6px;margin-bottom:30px}
    #hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.1);font-size:9px;z-index:2;letter-spacing:2px}
    #history{position:fixed;right:16px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.15);font-size:20px;z-index:2;pointer-events:none;display:flex;flex-direction:column;gap:8px}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<h1>COSMIC DICE</h1>
<div id="dice">⬡</div>
<div id="name"></div>
<div id="result">Click or press Space to cast the cosmic dice.</div>
<div id="history"></div>
<div id="hint">CLICK · SPACE · SHAKE</div>
<a href="portal.html" style="position:fixed;top:12px;left:12px;color:rgba(255,255,255,.15);font-size:9px;text-decoration:none;z-index:99;letter-spacing:1px">&larr; suite</a>
<script>
const FACES=[
  {sym:'☀',name:'THE SUN',msg:'Radiance. Your path is illuminated. Act boldly.'},
  {sym:'🌙',name:'THE MOON',msg:'Mystery. Look beneath the surface. Trust intuition.'},
  {sym:'⭐',name:'THE STAR',msg:'Hope. Something wonderful approaches. Stay open.'},
  {sym:'🌀',name:'THE SPIRAL',msg:'Change. Growth is happening, even when invisible.'},
  {sym:'💎',name:'THE CRYSTAL',msg:'Clarity. The answer is simpler than you think.'},
  {sym:'🔥',name:'THE FLAME',msg:'Passion. Follow what makes your soul burn bright.'},
  {sym:'🌊',name:'THE WAVE',msg:'Flow. Stop resisting. Move with the current.'},
  {sym:'⚡',name:'THE BOLT',msg:'Breakthrough. The unexpected is your ally today.'},
  {sym:'🌱',name:'THE SEED',msg:'Beginning. Plant something today. Water it tomorrow.'},
  {sym:'∞',name:'THE INFINITE',msg:'Perspective. This moment is eternal. You are infinite.'},
  {sym:'🕳',name:'THE VOID',msg:'Emptiness. In the nothing, find everything.'},
  {sym:'🦋',name:'THE BUTTERFLY',msg:'Transformation. Who you were is not who you must be.'},
];

let rolling=false,history=[];

function roll(){
  if(rolling)return;rolling=true;
  const el=document.getElementById('dice');el.classList.remove('roll');
  void el.offsetWidth;el.classList.add('roll');
  // Rapid symbol changes during roll
  let count=0;const interval=setInterval(()=>{
    el.textContent=FACES[Math.random()*FACES.length|0].sym;count++;
    if(count>15){clearInterval(interval);
      const face=FACES[Math.random()*FACES.length|0];
      el.textContent=face.sym;
      document.getElementById('name').textContent=face.name;
      document.getElementById('result').textContent=face.msg;
      history.unshift(face.sym);if(history.length>8)history.pop();
      document.getElementById('history').textContent=history.join('\n');
      // Sound
      try{const a=new(AudioContext||webkitAudioContext)();
        [400,500,600].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;
          g.gain.setValueAtTime(.02,a.currentTime+i*.1);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.1+.4);
          o.connect(g);g.connect(a.destination);o.start(a.currentTime+i*.1);o.stop(a.currentTime+i*.1+.4);});}catch(e){}
      rolling=false;}
  },50);}

addEventListener('click',roll);
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();roll();}
  if(e.key==='f')document.documentElement.requestFullscreen().catch(()=>{});});
// Shake detection for mobile
let lastAccel=0;
addEventListener('devicemotion',e=>{if(!e.accelerationIncludingGravity)return;
  const a=e.accelerationIncludingGravity;const total=Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z);
  if(total>30&&total-lastAccel>15)roll();lastAccel=total;});

// Background
const C=document.getElementById('c'),X=C.getContext('2d');
function resize(){C.width=innerWidth;C.height=innerHeight;}resize();addEventListener('resize',resize);
const stars=Array.from({length:80},()=>({x:Math.random()*3e3,y:Math.random()*3e3,s:Math.random(),p:Math.random()*Math.PI*2}));
function anim(){requestAnimationFrame(anim);X.fillStyle='rgba(6,6,16,.05)';X.fillRect(0,0,C.width,C.height);
  for(const s of stars){s.p+=.003;X.globalAlpha=.04+Math.sin(s.p)*.02;X.fillStyle='#fff';
    X.beginPath();X.arc(s.x%C.width,s.y%C.height,s.s,0,Math.PI*2);X.fill();}X.globalAlpha=1;}
anim();
</script>
</body>
</html>
